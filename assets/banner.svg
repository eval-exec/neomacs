<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 380" width="1600" height="380" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">NEOMACS</title>
  <desc id="bannerDesc">The NEOMACS taijitu mark beside the NEOMACS wordmark, above the line "The Emacs from the future."</desc>
  <!-- Glyphs are outlines, not font-family text: GitHub serves this as a bare
       <img>, where a named font falls back to whatever the visitor has.
       Wordmark: M PLUS 1 Black.  Tagline: Source Code Pro Medium. -->
