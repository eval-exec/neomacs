# Issue labels, as code.  Synced to the repository by .github/workflows/labels.yml.
#
# Dimensions (one prefix per dimension, consistent separators):
#   platform: where the report applies        area: which subsystem
#   status:   how far triage got              plus GitHub's default
#   type labels (bug, enhancement, ...) and the bot labels.
#
# Names and colors are quoted on purpose: `008672` is an *integer* (octal, in
# some parsers) unless quoted, and a name like `area: display` contains the
# key/value separator.  Both would reach the API as the wrong type.
#
# Keep the set small: if a label never gets applied, delete it here.
---
- name: 'area: display'
  color: '0075ca'
  description: 'Redisplay, layout, rendering, fonts and glyphs'
- name: 'area: elisp'
  color: 'bfd4f2'
  description: 'The evaluator, bytecode/JIT and Lisp-level behaviour'
- name: 'area: input'
  color: '5319e7'
  description: 'Keyboard, mouse, IME and event translation'
- name: 'area: packaging'
  color: 'd4c5f9'
  description: 'Build, install, packaging and releases'
- name: 'area: web'
  color: '4E8828'
  description: 'The webview/xwidget surface'
- name: 'area: window-frame'
  color: 'c5def5'
  description: 'Windows, frames, menus and chrome'
