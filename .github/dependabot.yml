version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cranelift:
        patterns:
          - "cranelift-*"
      wgpu:
        patterns:
          - "wgpu"
          - "wgpu-*"
          - "naga"

  - package-ecosystem: pip
    directory: /crates/neomacs-wasm/tests
    schedule:
      interval: weekly
