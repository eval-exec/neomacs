name: gui tests macos

# The macOS scenario tier, in its own workflow so it can run (and be
# cancelled) without the Linux matrix. The same fixtures and frame-snapshot
# contract as the Linux GUI job, driven through the fixture/Elisp channel
# instead of native input injection, so a hosted runner needs no
# Accessibility or Screen Recording grant. Native-input scenarios (menus,
# focus, WM contracts) stay on Linux and on provisioned self-hosted macOS
# hosts; each scenario declares the capabilities it needs and the harness
# reports `unsupported` when the host lacks one.
#
# The path filter keeps unrelated PRs from paying for a macOS release build.
# Runtime, display and harness changes can all affect GUI behavior, as can a
# dependency bump or a change to the oracle/driver actions.

on:
  pull_request:
    paths:
      - 'crates/neomacs-gui-tests/**'
      - 'crates/neomacs-infra/**'
      - 'crates/neovm-core/**'
      - 'crates/neomacs/**'
      - 'crates/neomacs-display-runtime/**'
      - 'crates/neomacs-display-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/ci/build-gnu-oracle.sh'
      - '.github/actions/install-build-deps/**'
      - '.github/actions/setup-rust/**'
      - '.github/actions/setup-gnu-emacs-macos/**'
      - '.github/workflows/gui-tests-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-tests-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  neomacs-gui-tests-macos:
    name: real GUI tests (macos aarch64, scenario tier)
    runs-on: macos-latest
    # Matches the doom-install macOS arm's cold fresh-build budget.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_GUI_TEST_BACKEND: macos
      NEOMACS_GUI_TEST_BINARY: ${{ github.workspace }}/target/release/neomacs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR/nextest"
      - uses: ./.github/actions/install-build-deps

      # Share the macOS release cache with the neovm-core macOS job: same
      # workspace, release profile and target, both running fresh-build.  Save
      # only on main so PRs do not write a multi-GB PR-scoped copy.
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-gui-tests
          # Must match the neovm-core macOS job: both restore and save the ONE
          # `macos-aarch64-release-ws` entry, and whatever rust-cache saves
          # under this key must include the workspace crates in both jobs or
          # the first saver would pin the shared entry to the slower shape.
          cache-shared-key: macos-aarch64-release-ws
          cache-workspace-crates: "true"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          target: aarch64-apple-darwin

      - name: Build the runtime under test
        run: cargo xtask fresh-build --release

      # The pinned macOS oracle is a batch build. It is not a GUI reference,
      # but it is exactly the pinned `emacs` that bootstraps the Doom fixture
      # (`bin/doom sync`) for the config-boot probe.
      - name: Set up the pinned GNU batch reference
        uses: ./.github/actions/setup-gnu-emacs-macos

      # Best effort: the config-boot test prints the absent-fixture reason and
      # skips, so a network outage must not fail the rendering tier.
      - name: Materialize the Doom config fixture
        continue-on-error: true
        run: cargo run -p xtask -- infra materialize doom

      # A locked console or a sleeping display makes every window occluded:
      # the suite reports `surface-present` unsupported and the snapshot
      # canary skips with that reason. Print the evidence once per run so a
      # skip is diagnosable from the job log.
      - name: Report the desktop session state
        run: |
          launchctl managername || true
          ioreg -n Root -d1 -a | grep -A1 -E 'IOConsoleLocked|CGSSessionScreenIsLocked' || true
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Display Asleep|Online' || true

      # Two tiers in one run: the snapshot/geometry scenarios need only the
      # scenario driver and pass on a locked console, while the paint canary
      # declares surface-present and reports `unsupported` (with the reason
      # printed above) when the runner's desktop cannot present.
      - name: Run the scenario-tier GUI tests
        run: |
          cargo nextest run -p neomacs-gui-tests --test gui \
            -E 'test(~real_gui_smoke_generates_surface_readback_png) | test(~child_frame_position) | test(~child_frame_sizing) | test(~compact_frame_geometry) | test(~display_window_geometry::pixelwise_window_resize) | test(~integer_width) | test(~doom_gui_boot_renders_on_the_host_backend)' \
            --test-threads 1 --no-fail-fast

      - name: Upload GUI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neomacs-gui-tests-macos-${{ github.run_id }}
          path: target/neomacs-gui-tests
          if-no-files-found: ignore
          retention-days: 14
