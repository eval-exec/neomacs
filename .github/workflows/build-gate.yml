name: build gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: cargo check workspace (${{ matrix.label }})
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            label: linux-aarch64
          - runner: macos-latest
            label: macos-aarch64
          # `macos-15-intel` is GitHub's last x86_64 runner image, promised
          # only until August 2027 (actions/runner-images#13045).  Keep the
          # workspace compiling for x86_64-apple-darwin here so the release
          # job never discovers a breakage at tag time.
          - runner: macos-15-intel
            label: macos-x86_64
          - runner: windows-latest
            label: windows-msvc-x86_64
          - runner: windows-11-arm
            label: windows-msvc-aarch64
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install-build-deps

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-check-${{ matrix.label }}
          cache-shared-key: ${{ matrix.label }}-dev
          # These two legs exist only to keep a RELEASE target compiling (the
          # macOS Intel image so a tag never discovers x86_64 breakage, and
          # Windows-on-ARM likewise).  Nothing else restores their caches, and
          # each was ~1.1-1.3 GB in the shared 10 GiB store that the macOS
          # release caches must also live in.  They still run and gate the
          # workspace; they compile cold.  Every platform that ships or runs
          # the suite keeps its cache.
          cache: ${{ matrix.label != 'macos-x86_64' && matrix.label != 'windows-msvc-aarch64' }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: ${{ matrix.label == 'linux-x86_64' || matrix.label == 'windows-msvc-x86_64' || runner.os == 'macOS' }}

      - name: Check native dependency type coherence
        if: matrix.label == 'linux-x86_64'
        run: cargo run --locked -p xtask -- check-dependency-coherence

      - name: cargo check workspace (Unix)
        if: runner.os != 'Windows'
        run: cargo check --workspace --all-targets

      - name: cargo check workspace (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo check --workspace --all-targets

      # The harness spawn-architecture tripwire and the canonical-environment
      # tests live in neomacs-test-env; no other job runs them, so an unpinned
      # harness spawn could reach main. This leg already installs nextest.
      - name: Test harness spawn architecture
        if: matrix.label == 'linux-x86_64'
        run: cargo nextest run --locked -p neomacs-test-env

      - name: Test DirectWrite native font replay
        if: matrix.label == 'windows-msvc-x86_64'
        shell: bash
        run: >-
          cargo nextest run -p neomacs-layout-engine
          font_backend::windows::tests

      - name: Test CoreText Thin-only font matching
        if: runner.os == 'macOS'
        run: >-
          cargo nextest run --locked -p neomacs-layout-engine --lib
          -E 'test(registered_coretext_thin_fixture_enumerates_and_opens_with_normal_preference)'
          --no-tests=fail

      - name: cargo check minimal capability build
        if: matrix.label == 'linux-x86_64'
        run: cargo check -p neomacs --no-default-features

      # Every formerly ignored test now lives behind an explicit feature.
      # The neovm-core perf/measurement probes and trybuild compile-contract
      # suites, the layout engine's benchmark probes, the tui Doom reproduction
      # aid, and neomacs' release-pdump integration suites are all compiled out
      # of the default set; keep each opt-in set building so the mechanisms
      # cannot rot.
      - name: cargo check opt-in test mechanisms
        if: matrix.label == 'linux-x86_64'
        run: |
          cargo check -p neovm-core --tests --features perf-probes,contract-fixtures
          cargo check -p neomacs-layout-engine --tests --features perf-probes
          cargo check -p neomacs-tui-tests --tests --features doom-repro
          cargo check -p neomacs --tests --features release-pdump-tests

      - name: Test SQLite-disabled capability surface
        if: matrix.label == 'linux-x86_64'
        run: >-
          cargo nextest run -p neovm-core --no-default-features
          -E 'test(disabled_build_exposes_only_gnu_capability_probes)'
