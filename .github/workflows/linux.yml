name: linux

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_TUI_RECORD: on
      NEOMACS_MELPA_ORACLE_EMACS: emacs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR"

      - name: Install system dependencies (apt)
        run: scripts/ci/setup-linux.sh ecosystem

      # Before the tui tests, which spawn the GNU oracle. This provisions a
      # Nix of its own; the later install-nix-action in this job must reuse
      # it (this workflow is manual-dispatch only, so a conflict fails loudly
      # in a low-traffic job rather than silently skipping the oracle).
      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: linux-x86_64
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      - name: Verify build with cargo xtask fresh-build
        run: cargo xtask fresh-build --release

      - name: Run unit tests for neovm-core
        run: cargo nextest run -p neovm-core --no-fail-fast

      - name: Run oracle tests for neovm-core
        run: cargo nextest run -p neovm-oracle-tests --no-fail-fast

      - name: Run tui tests for neomacs
        run: cargo nextest run -p neomacs-tui-tests --release --no-fail-fast

      - name: Install Nix for exact MELPA test runtimes
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Run melpa package tests for neomacs
        run: cargo nextest run -p neomacs-melpa-tests --release --no-fail-fast

      - name: Upload TUI recordings
        if: always()
        uses: ./.github/actions/upload-tui-recordings
        with:
          artifact-name: neomacs-tui-recordings-linux-${{ github.run_id }}

  lint:
    name: lint & clippy (frontend, linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (apt)
        run: scripts/ci/setup-linux.sh build

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: linux-x86_64-lint
          cache-shared-key: linux-x86_64-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # 5a: whole-workspace formatting (matches the repo owner's pre-push gate).
      - name: Check formatting
        run: cargo fmt --all --check

      # 5b/5c: clippy hygiene gate for the five frontend crates, default
      # features. `--no-deps` scopes linting to the selected packages so the
      # gate does not depend on (or fail on) the neovm-* crates' own lint state,
      # which is owned separately.
      - name: Clippy (frontend crates, default features)
        run: |
          cargo clippy \
            -p neomacs-display-protocol \
            -p neomacs-layout-engine \
            -p neomacs-renderer-wgpu \
            -p neomacs-display-runtime \
            -p neomacs \
            --no-deps -- -D warnings

      # webview variant for the two crates that expose the feature. This is
      # type-check only (no linking), but neomacs-webview's build.rs runs bindgen
      # and therefore needs the EGL/WPE dev headers; wpe-platform-2.0 is optional
      # (build.rs skips it when absent). Kept best-effort so a runner without
      # these packages does not block the hard gate above — the wpe gate is
      # verified locally where the WPE stack is installed.
      - name: Install WPE dev headers (best-effort)
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends \
            libegl-dev \
            libwpewebkit-1.0-dev \
            libwpe-1.0-dev \
            libwpebackend-fdo-1.0-dev

      - name: Clippy (renderer-wgpu + display-runtime, webview feature)
        continue-on-error: true
        run: |
          cargo clippy \
            -p neomacs-renderer-wgpu \
            -p neomacs-display-runtime \
            --no-deps --features webview -- -D warnings
