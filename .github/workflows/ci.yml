name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Lint release shell contracts
        run: |
          shellcheck \
            install.sh \
            scripts/dispatch-release-event.sh \
            scripts/generate-release-notes.sh \
            scripts/prepare-docker-runtime-context.sh \
            scripts/test-dispatch-release-event.sh \
            scripts/test-docker-runtime-context.sh \
            scripts/test-generate-release-notes.sh \
            scripts/check-native-font-boundaries.sh \
            scripts/lib/macos-macho.sh \
            scripts/vendor-macos-runtime.sh \
            scripts/test-macos-dependency-closure.sh
          sh -n install.sh
          bash -n \
            scripts/dispatch-release-event.sh \
            scripts/generate-release-notes.sh \
            scripts/prepare-docker-runtime-context.sh \
            scripts/test-dispatch-release-event.sh \
            scripts/test-docker-runtime-context.sh \
            scripts/test-generate-release-notes.sh \
            scripts/check-native-font-boundaries.sh \
            scripts/lib/macos-macho.sh \
            scripts/vendor-macos-runtime.sh \
            scripts/test-macos-dependency-closure.sh

      - name: Test Docker runtime context contract
        run: ./scripts/test-docker-runtime-context.sh

      - name: Test release dispatch contract
        run: ./scripts/test-dispatch-release-event.sh

      - name: Test release-note generation contract
        run: ./scripts/test-generate-release-notes.sh

      - name: Check native font dependency boundaries
        run: ./scripts/check-native-font-boundaries.sh

      # The dependency closure is pure path logic over otool output, so it is
      # testable with stub tools on Linux.  Running it here means a regression
      # is caught in seconds on every push instead of by a macOS release job
      # forty minutes in.
      - name: Test macOS dependency closure contract
        run: ./scripts/test-macos-dependency-closure.sh

  fmt:
    name: cargo fmt (${{ matrix.label }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
          - runner: macos-latest
            label: macos-aarch64
          - runner: windows-latest
            label: windows-msvc-x86_64
    steps:
      - *checkout

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # cargo fmt does not compile: a build cache here is ~180 MiB per
          # platform for no reuse, against a shared 10 GiB repo limit.
          cache: "false"
          cache-key: ci-fmt-${{ matrix.label }}

      - name: cargo fmt
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/neovm-core/fuzz/Cargo.toml --check

  cargo-deny:
    name: cargo deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
          command-arguments: --hide-inclusion-graph

  check:
    name: cargo check workspace (${{ matrix.label }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            label: linux-aarch64
          - runner: macos-latest
            label: macos-aarch64
          - runner: windows-latest
            label: windows-msvc-x86_64
          - runner: windows-11-arm
            label: windows-msvc-aarch64
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - *checkout

      - &install_linux_deps
        name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: scripts/ci/setup-linux.sh build

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-check-${{ matrix.label }}
          cache-shared-key: ${{ matrix.label }}-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: ${{ matrix.label == 'linux-x86_64' || matrix.label == 'windows-msvc-x86_64' }}

      - name: cargo check workspace (Unix)
        if: runner.os != 'Windows'
        run: cargo check --workspace

      - name: cargo check workspace (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo check --workspace

      - name: Test DirectWrite native font replay
        if: matrix.label == 'windows-msvc-x86_64'
        shell: bash
        run: >-
          cargo nextest run -p neomacs-layout-engine
          font_backend::windows::tests

      - name: cargo check minimal capability build
        if: matrix.label == 'linux-x86_64'
        run: cargo check -p neomacs --no-default-features

      - name: Test SQLite-disabled capability surface
        if: matrix.label == 'linux-x86_64'
        run: >-
          cargo nextest run -p neovm-core --no-default-features
          -E 'test(disabled_build_exposes_only_gnu_capability_probes)'

  # Cross-compilation cannot exercise inotify, kqueue, or
  # ReadDirectoryChangesW.  Keep this independent from the workspace check so
  # an unrelated platform-only crate failure cannot skip the native runtime
  # contract, and build only neovm-core's library test binary.
  native-file-notify:
    name: native file notifications (${{ matrix.label }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
          - runner: macos-latest
            label: macos-aarch64
          - runner: windows-latest
            label: windows-msvc-x86_64
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - *checkout

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-file-notify-${{ matrix.label }}
          cache-shared-key: ${{ matrix.label }}-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: "true"

      - name: Test native runtime contracts
        shell: bash
        run: >-
          cargo nextest run -p neovm-core --lib
          -E 'test(native_runtime_test) |
          test(windows_set_file_times_does_not_require_content_write_access) |
          test(windows_file_writable_p_accepts_existing_directory_forms) |
          test(windows_copy_file_without_keep_time_refreshes_timestamps) |
          test(copy_file_keep_time_preserves_source_modification_time) |
          test(backup_buffer_uses_rename_when_copying_is_disabled)'

  # The native Rust tests above isolate backend/thread/lifecycle failures.  A
  # release Neomacs is still required to prove the public Lisp API, special
  # event dispatch, timers, auto-revert, and backend agree as one system.  The
  # Linux release runtime is already built below; build only the two other
  # native products here instead of paying for a second Linux release link.
  file-notify-public-ert:
    name: GNU file notification ERT (${{ matrix.label }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: macos-aarch64
            binary: target/release/neomacs
          - runner: windows-latest
            label: windows-msvc-x86_64
            binary: target/release/neomacs.exe
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUST_LOG: warn
    steps:
      - *checkout

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-file-notify-ert-${{ matrix.label }}
          cache-shared-key: ${{ matrix.label }}-release
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build fresh release runtime
        shell: bash
        run: cargo xtask fresh-build --release

      # loaddefs-gen deliberately warns and continues when loading a source
      # file fails, so a successful fresh-build exit status alone cannot catch
      # a broken clean-tree bootstrap.  Simulate Darwin without the generated
      # tramp-loaddefs seed and require Tramp's source-loading guard to work.
      - name: Test clean-tree Tramp loaddefs bootstrap
        shell: bash
        run: >-
          "${{ matrix.binary }}" --batch -Q
          -L lisp/net
          -l test/lisp/net/tramp-bootstrap-tests.el
          -f ert-run-tests-batch-and-exit

      - name: Run unchanged upstream GNU file-notify ERT suite
        shell: bash
        run: |
          set -euxo pipefail
          task_tmp="$PWD/target/file-notify-ert-tmp"
          mkdir -p "$task_tmp"
          if [ "$RUNNER_OS" = Windows ]; then
            task_tmp="$(cygpath -w "$task_tmp")"
            export REMOTE_TEMPORARY_FILE_DIRECTORY=NUL
            export TEMP="$task_tmp"
            export TMP="$task_tmp"
          else
            export REMOTE_TEMPORARY_FILE_DIRECTORY=/dev/null
          fi
          export TMPDIR="$task_tmp"
          "${{ matrix.binary }}" --batch -Q \
            -l test/lisp/filenotify-tests.el \
            -f ert-run-tests-batch-and-exit

  linux-no-gstreamer-startup:
    name: startup without GStreamer (linux x86_64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR"

      - name: Install dependencies without GStreamer
        run: scripts/ci/setup-linux.sh build-no-gstreamer

      - name: Prove GStreamer development files are absent
        run: '! pkg-config --exists gstreamer-1.0'

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
          cache-key: ci-no-gstreamer-linux-x86_64

      - name: Build the minimal product without video
        run: cargo xtask fresh-build --release --minimal

      - name: Audit startup closure
        run: |
          if readelf --dynamic target/release/neomacs | grep -Eq 'Shared library: \[libgst'; then
            echo "minimal executable unexpectedly links GStreamer" >&2
            exit 1
          fi

      - name: Smoke the pdump relocating fallback (NEOVM_PDUMP_NO_FIXED_MAP)
        run: |
          # The planned-base hit path skips relocation validation wholesale;
          # this keeps the delta-apply fallback (and its bounds checks) green
          # forever. A green lane on purpose — the standing-red display jobs
          # would hide a fallback regression.
          NEOVM_PDUMP_NO_FIXED_MAP=1 target/release/neomacs --batch -Q --eval '(kill-emacs 0)'

      - name: Smoke batch and real TUI in a GStreamer-free container
        run: |
          docker run --rm --volume "$PWD:/workspace:ro" ubuntu:24.04 \
            bash -euxo pipefail -c "
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                libncursesw6 libstdc++6 libfontconfig1 libfreetype6 zlib1g util-linux
              ! ldconfig -p | grep -Eq 'libgst(video|base|app|allocators|reamer)'
              /workspace/target/release/neomacs --batch --eval '(kill-emacs 0)'
              TERM=xterm timeout 30s script -qec \"/workspace/target/release/neomacs -Q -nw --eval '(kill-emacs 0)'\" /dev/null
            "

  neomacs-workspace-test-archive:
    name: workspace test archive (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # A release workspace test archive links several large test binaries.
      # Bound compiler and linker parallelism to fit the hosted runner.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_LTO: "false"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--threads=1"
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - &prepare_workspace_tmp
        name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR/nextest"
      - *install_linux_deps
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-workspace-archive-linux-x86_64
          cache-shared-key: linux-x86_64-release
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      - name: Build and archive workspace tests
        run: |
          cargo nextest archive \
            --release \
            --workspace \
            --archive-file neomacs-workspace-tests.tar.zst

      - name: Upload workspace test archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neomacs-workspace-tests-nextest-archive-linux-x86_64
          path: neomacs-workspace-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

  neomacs-melpa-direct-windows-tests:
    name: MELPA direct adapter Job Object contracts (windows x86_64)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - *checkout

      - name: Prepare workspace temp directory
        shell: pwsh
        run: |
          $taskTmp = Join-Path $env:GITHUB_WORKSPACE 'tmp'
          New-Item -ItemType Directory -Force -Path $taskTmp | Out-Null
          "TMPDIR=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-windows-direct-adapter-x86_64
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      - name: Run native Windows direct adapter contracts
        run: >-
          cargo nextest run
          -p neomacs-melpa-tests
          -E 'test(/direct_windows_/)'
          --success-output immediate
          --no-fail-fast

  neovm-core-tests:
    if: github.event_name != 'schedule'
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: core

  neomacs-test-runtime:
    name: Packaged Neomacs Runtime (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - *install_linux_deps
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-shared-runtime-linux-x86_64
          cache-shared-key: linux-x86_64-release
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build fresh release runtime
        run: cargo xtask fresh-build --release

      - name: Run upstream GNU SQLite ERT suite
        run: >-
          target/release/neomacs
          --batch -Q
          -l test/src/sqlite-tests.el
          -f ert-run-tests-batch-and-exit

      - name: Run unchanged upstream GNU file-notify ERT suite
        env:
          REMOTE_TEMPORARY_FILE_DIRECTORY: /dev/null
        run: |
          mkdir -p "$PWD/target/file-notify-ert-tmp"
          TMPDIR="$PWD/target/file-notify-ert-tmp" \
            target/release/neomacs --batch -Q \
              -l test/lisp/filenotify-tests.el \
              -f ert-run-tests-batch-and-exit

      # The standing detector for the missing-GC-root class (DIVERGENCES.md
      # 161/162). This collector is precise, so a Lisp value that rides Rust
      # control flow is invisible to trace_roots unless it was rooted
      # deliberately -- and such a bug is invisible to an ordinary green suite:
      # the whole 38k-pin oracle suite was green on BOTH sides of 161's
      # use-after-free. NEOVM_GC_STRESS=1 collects at every allocation-bearing
      # safe point, which turns "sometimes" into "always".
      - name: GC-stress the shipped runtime
        run: cargo xtask gc-stress

      # Exercise install.sh end-to-end against a release-shaped tree built
      # from THIS commit (file:// download base), so the curl|bash path --
      # download, checksum, versioned install, symlink chain, runtime-root
      # resolution with no environment variables -- is proven before any
      # release publishes it.
      #
      # BOTH tarball shapes are staged, because install.sh has a branch for
      # each and a release that only exercises one of them ships the other
      # untested: the current layout, whose dump sits in the archlib
      # (libexec/neomacs/<version>/<triple>, GNU's archlibdir), and the
      # pre-0.0.16 layout, whose dump sits in bin/ -- which --tag still has to
      # be able to install.
      - name: Verify install.sh against a staged release tree
        run: |
          set -eux
          triple=x86_64-unknown-linux-gnu
          crate_version="$(
            awk '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0}
                 s && /^version[[:space:]]*=/{gsub(/^version[[:space:]]*=[[:space:]]*"/,"");gsub(/".*$/,"");print;exit}' \
              Cargo.toml
          )"
          archlib="libexec/neomacs/$crate_version/$triple"

          stage_release() {
            local version="$1" layout="$2"
            local stage_root="$TMPDIR/install-release-$layout"
            local staged="$stage_root/v$version"
            local pkg_parent="$stage_root/pkg"
            local pkg="$pkg_parent/neomacs-$version-$triple"
            rm -rf "$stage_root"
            mkdir -p "$staged" "$pkg/bin" "$pkg/share/neomacs"
            cp target/release/neomacs target/release/neomacsclient "$pkg/bin/"
            if [ "$layout" = archlib ]; then
              mkdir -p "$pkg/$archlib"
              cp target/release/neomacs.pdump "$pkg/$archlib/neomacs.pdump"
            else
              cp target/release/neomacs.pdump "$pkg/bin/neomacs.pdump"
            fi
            cp -r lisp etc "$pkg/share/neomacs/"
            tar czf "$staged/neomacs-$version-$triple.tar.gz" \
              -C "$pkg_parent" "neomacs-$version-$triple"
            ( cd "$staged" && sha256sum "neomacs-$version-$triple.tar.gz" > SHA256SUMS )
            local prefix="$stage_root/prefix"
            NEOMACS_DOWNLOAD_BASE="file://$stage_root" \
              sh install.sh --tag "v$version" --prefix "$prefix"
            test -x "$prefix/bin/neomacs"
            test "$(readlink "$prefix/share/neomacs/current")" = "versions/$version"
            test "$(readlink "$prefix/bin/neomacs")" = "../share/neomacs/current/bin/neomacs"
            local exe ver_dir
            exe="$(readlink -f "$prefix/bin/neomacs")"
            ver_dir="$(dirname "$(dirname "$exe")")"
            if [ "$layout" = archlib ]; then
              test -f "$ver_dir/$archlib/neomacs.pdump"
              test ! -f "$(dirname "$exe")/neomacs.pdump"
              # exec-directory is PATH_EXEC (GNU src/callproc.c:1961), so the
              # installed tree has to answer with its own archlib.
              env -u NEOMACS_RUNTIME_ROOT -u EMACSPATH \
                "$prefix/bin/neomacs" --batch \
                --eval "(princ exec-directory)" | grep -Fx "$ver_dir/$archlib/"
            else
              test -f "$(dirname "$exe")/neomacs.pdump"
            fi
            test -d "$ver_dir/share/neomacs/lisp"
            env -u NEOMACS_RUNTIME_ROOT \
              "$prefix/bin/neomacs" --batch --eval '(princ (emacs-version))'
          }

          stage_release citest archlib
          stage_release citestlegacy legacy

      - name: Package shared test runtime
        run: |
          test -x target/release/neomacs
          test -f target/release/neomacs.pdump
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el
          test -d etc/charsets
          tar czf neomacs-test-runtime-linux-x86_64.tar.gz \
            target/release/neomacs \
            target/release/neomacs.pdump \
            lisp \
            etc

      - name: Upload shared test runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neomacs-test-runtime-linux-x86_64
          path: neomacs-test-runtime-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  neovm-oracle-tests:
    if: github.event_name != 'schedule'
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: oracle

  neomacs-tui-tests:
    if: github.event_name != 'schedule'
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: tui

  neomacs-melpa-tests:
    name: MELPA ${{ matrix.suite }} compatibility and GNU parity (linux x86_64)
    if: github.event_name != 'schedule'
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: batch
            filter: binary_id(=neomacs-melpa-test-support)|(binary_id(=neomacs-melpa-tests)-test(~gui_parity_tests::))
          - suite: tui
            filter: binary_id(=neomacs-melpa-tests::melpa_tui)
          - suite: gui
            filter: binary_id(=neomacs-melpa-tests)&test(~gui_parity_tests::)
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEXTEST_FILTER: ${{ matrix.filter }}
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
      NEOMACS_MELPA_ORACLE_EMACS: /usr/bin/emacs
      NEOMACS_GUI_TEST_BACKEND: x11
      NEOMACS_GUI_TEST_BINARY: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_GUI_TEST_GNU_EMACS: /usr/bin/emacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Install Linux ecosystem dependencies
        run: scripts/ci/setup-linux.sh ecosystem
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-melpa-${{ matrix.suite }}
          # Runs prebuilt binaries out of the downloaded nextest archive and
          # never invokes rustc, so a Cargo build cache here can never be read
          # back.  Measured: these entries were ~246 MiB each and carried the
          # SAME content hash as each other, in a 10 GiB store whose overflow
          # was evicting the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - &download_test_runtime
        name: Download shared test runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neomacs-test-runtime-linux-x86_64
          path: .

      - &unpack_test_runtime
        name: Unpack shared test runtime
        run: |
          tar xzf neomacs-test-runtime-linux-x86_64.tar.gz
          chmod +x target/release/neomacs
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el

      - &download_workspace_test_archive
        name: Download workspace test archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neomacs-workspace-tests-nextest-archive-linux-x86_64
          path: .

      - name: Install Nix for exact MELPA test runtimes
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Run deterministic package ecosystem compatibility tests
        env:
          NEOMACS_TUI_RECORD: ${{ matrix.suite == 'tui' && 'on' || 'off' }}
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E "$NEXTEST_FILTER" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --success-output immediate \
            --no-fail-fast

      - name: Upload MELPA TUI recordings
        if: matrix.suite == 'tui' && always()
        uses: ./.github/actions/upload-tui-recordings
        with:
          artifact-name: neomacs-melpa-tui-recordings-${{ github.run_id }}

  neomacs-display-tests:
    name: display stack tests (linux x86_64)
    if: github.event_name != 'schedule'
    needs: neomacs-workspace-test-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEXTEST_FILTER: "package(neomacs-display-protocol)|package(neomacs-display-runtime)|package(neomacs-layout-engine)|package(neomacs-renderer-wgpu)"
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - *install_linux_deps
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-display-tests
          # Runs prebuilt binaries out of the downloaded nextest archive and
          # never invokes rustc, so a Cargo build cache here can never be read
          # back.  Measured: these entries were ~246 MiB each and carried the
          # SAME content hash as each other, in a 10 GiB store whose overflow
          # was evicting the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - *download_workspace_test_archive

      - name: Run display stack tests
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E "$NEXTEST_FILTER" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast

  neomacs-prefix-face-tui-parity:
    name: GNU prefix face TUI parity (linux x86_64)
    if: github.event_name != 'schedule'
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_TUI_NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Install GNU Emacs oracle dependencies
        run: scripts/ci/setup-linux.sh oracle
      - name: Set up test runner
        uses: ./.github/actions/setup-rust
        with:
          # This job executes the archived test binary against the shared
          # fresh-build runtime and never invokes rustc.
          cache: "false"
          cache-key: ci-prefix-face-tui-parity
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      - name: Compare buffer-remapped prefix faces with GNU Emacs
        env:
          NEOMACS_TUI_RECORD: on
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E 'package(neomacs-tui-tests) and test(=line_and_wrap_prefix_named_face_remapping_match_gnu)' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast

      - name: Upload prefix-face TUI recordings
        if: always()
        uses: ./.github/actions/upload-tui-recordings
        with:
          artifact-name: neomacs-prefix-face-tui-recordings-${{ github.run_id }}

  neomacs-gui-tests:
    name: real GUI tests (linux x86_64, X11)
    if: github.event_name != 'schedule'
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_GUI_TEST_BACKEND: x11
      NEOMACS_GUI_TEST_BINARY: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_GUI_TEST_GNU_EMACS: /usr/bin/emacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Install Linux ecosystem dependencies
        run: scripts/ci/setup-linux.sh ecosystem
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-real-gui-tests
          # Runs prebuilt binaries out of the downloaded nextest archive and
          # never invokes rustc, so a Cargo build cache here can never be read
          # back.  Measured: these entries were ~246 MiB each and carried the
          # SAME content hash as each other, in a 10 GiB store whose overflow
          # was evicting the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      - name: Run real GUI tests
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E 'package(neomacs-gui-tests)' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast

      - name: Upload GUI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neomacs-gui-tests-linux-x11-${{ github.run_id }}
          path: target/neomacs-gui-tests
          if-no-files-found: ignore
          retention-days: 14

  neomacs-melpa-live-canary:
    name: MELPA live ecosystem canary (linux x86_64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
      NEOMACS_MELPA_ORACLE_EMACS: /usr/bin/emacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Install Linux ecosystem dependencies
        run: scripts/ci/setup-linux.sh ecosystem
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-melpa-live-canary
          # Runs prebuilt binaries out of the downloaded nextest archive and
          # never invokes rustc, so a Cargo build cache here can never be read
          # back.  Measured: these entries were ~246 MiB each and carried the
          # SAME content hash as each other, in a 10 GiB store whose overflow
          # was evicting the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      - name: Run current MELPA ecosystem canary
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            --run-ignored only \
            -E 'package(neomacs-melpa-tests) and test(=live_melpa_ecosystem_installs_and_survives_restart)' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --success-output immediate \
            --no-fail-fast

  doom-install-compatibility:
    name: doom install compatibility (linux x86_64)
    if: github.event_name != 'schedule'
    needs: neomacs-test-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - *install_linux_deps
      - *download_test_runtime
      - *unpack_test_runtime

      - name: Install unmodified Doom with Neomacs
        run: ./scripts/test-doom-install.sh

  regex-fuzz:
    name: regex differential fuzzing (linux x86_64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - *install_linux_deps

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Restore evolving fuzz corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/neovm-core/fuzz/corpus
          key: regex-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            regex-fuzz-corpus-

      - name: Fuzz Pike VM against the backtracker
        run: |
          cargo +nightly fuzz run regex_pike_vm \
            --fuzz-dir crates/neovm-core/fuzz -- \
            -max_total_time=300 -max_len=512 -timeout=10

      - name: Fuzz search optimizations against exhaustive scanning
        run: |
          cargo +nightly fuzz run regex_search_optimizations \
            --fuzz-dir crates/neovm-core/fuzz -- \
            -max_total_time=300 -max_len=512 -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regex-fuzz-crashes-${{ github.run_id }}
          path: crates/neovm-core/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
