name: regex fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regex-fuzz:
    name: regex differential fuzzing (linux x86_64)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR/nextest"
      - uses: ./.github/actions/install-build-deps

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Restore evolving fuzz corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/neovm-core/fuzz/corpus
          key: regex-fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            regex-fuzz-corpus-

      - name: Fuzz Pike VM against the backtracker
        run: |
          cargo +nightly fuzz run regex_pike_vm \
            --fuzz-dir crates/neovm-core/fuzz -- \
            -max_total_time=300 -max_len=512 -timeout=10

      - name: Fuzz search optimizations against exhaustive scanning
        run: |
          cargo +nightly fuzz run regex_search_optimizations \
            --fuzz-dir crates/neovm-core/fuzz -- \
            -max_total_time=300 -max_len=512 -timeout=10

      - name: Fuzz the existence DFA filter against the matcher alone
        run: |
          cargo +nightly fuzz run regex_existence_dfa \
            --fuzz-dir crates/neovm-core/fuzz -- \
            -max_total_time=300 -max_len=512 -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regex-fuzz-crashes-${{ github.run_id }}
          path: crates/neovm-core/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
