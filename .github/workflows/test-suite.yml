name: test suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      job:
        description: >-
          Job id to run, or all. Choices are all, plus jobs that have no
          needs, and neomacs-display-tests. That display job has needs, so
          selecting it also starts neomacs-test-runtime and
          neomacs-workspace-test-archive. Every other job that needs another
          job runs only when this is all. Push, pull request, and schedule
          ignore this and run the suite.
        type: choice
        default: all
        options:
          - all
          - neomacs-workspace-test-archive
          - neomacs-melpa-direct-windows-tests
          - compile-contracts
          - neovm-eval-tests
          - compile-contracts-macos
          - gnu-emacs-oracle
          - gnu-emacs-oracle-macos
          - neomacs-macos-test-build
          - neomacs-test-runtime
          - neomacs-display-tests
          - neomacs-xwidget-webview-gui
          - doom-install-compatibility-macos
          - loom-models
  schedule:
    - cron: "17 5 * * 0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  neomacs-workspace-test-archive:
    name: workspace test archive (linux x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'neomacs-workspace-test-archive' || github.event.inputs.job == 'neomacs-display-tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Test files are merged into one binary per crate (see
      # docs/building.md), so this job links a few dozen executables instead
      # of one per test file. Linking still dominates: every binary statically
      # links neovm-core and Cranelift. mold links them faster than lld at the
      # same 4-core/16 GB budget, rustc and links share the runner's cores
      # (binaries carry no debuginfo, which keeps concurrent link RSS well
      # below 16 GB), and test code uses relaxed codegen-units — the
      # perf-critical neomacs runtime ships from the separate test-runtime
      # job, never from these harness binaries.
      # If this OOMs on a hosted runner, halve CARGO_BUILD_JOBS before
      # ever re-serializing the linker. Halved on 2026-10-25: with the merged
      # per-crate test binaries and mold, two consecutive runs (e314bf315b,
      # 7a2607a224) were killed (exit 143) during the final links, 13-19
      # minutes in, with no compiler error.
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &prepare_workspace_tmp
        name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR/nextest"
      - uses: ./.github/actions/install-build-deps
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # Test harnesses build with LTO off, codegen-units 16, and
          # mold; keep this dependency cache separate from the normal
          # release cache.
          cache-key: ci-workspace-archive-linux-x86_64
          cache-shared-key: linux-x86_64-archive-release
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      # The final test-binary links exhaust the runner's 16 GB of RAM: on
      # 88247db382 the resource sampler below showed MemAvailable falling from
      # 4 GB to 60 MB during the links while disk stayed at 106 GB free, and the
      # runner then shut down (exit 143) -- the same failure as e314bf315b,
      # 7a2607a224 and e3f23e2adb. Freeing the unused SDKs keeps disk headroom;
      # a 16 GB swap file absorbs the link peak so mold and two jobs stay.
      - name: Free runner disk and add swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /swapfile-archive
          sudo chmod 600 /swapfile-archive
          sudo mkswap /swapfile-archive
          sudo swapon /swapfile-archive
          df -h /
          free -m

      - name: Build and archive workspace tests
        # Build test binaries only for the packages the archive consumers run.
        # The excluded crates are dependencies, so their libraries are still
        # compiled; their own test harnesses are not linked into the archive.
        # A background sampler records available memory, swap and disk every
        # 30 s, so a runner shutdown during the links shows which one ran out.
        run: |
          ( while sleep 30; do
              echo "resources $(date -u +%T) mem_avail_kB=$(awk '/MemAvailable/ {print $2}' /proc/meminfo) swap_free_kB=$(awk '/SwapFree/ {print $2}' /proc/meminfo) disk_avail_kB=$(df --output=avail -k / | tail -1 | tr -d ' ')"
            done ) &
          cargo nextest archive \
            --release \
            --workspace \
            --exclude neomacs \
            --exclude neomacs-allocator \
            --exclude neomacs-diagnostics \
            --exclude neomacs-font-materializer \
            --exclude neomacs-infra \
            --exclude neomacs-parity-reference \
            --exclude neomacs-perf \
            --exclude neomacs-test-env \
            --exclude neomacs-test-fonts \
            --exclude neomacs-test-oracle \
            --exclude neomacs-terminfo \
            --exclude neomacs-video \
            --exclude neomacs-video-model \
            --exclude neomacs-webview \
            --exclude neovm-host-abi \
            --exclude neovm-worker \
            --exclude xtask \
            --archive-file neomacs-workspace-tests.tar.zst

      - name: Upload workspace test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neomacs-workspace-tests-nextest-archive-linux-x86_64
          path: neomacs-workspace-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

  neomacs-daemon-lifecycle:
    name: daemon lifecycle (linux, matching debug runtime)
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && (needs.gnu-emacs-oracle.result == 'success') }}
    needs: gnu-emacs-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/daemon-lifecycle
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-daemon-lifecycle-linux
          cache-shared-key: linux-debug-daemon-lifecycle
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - name: Set up pinned GNU Emacs client for interoperability
        uses: ./.github/actions/setup-gnu-emacs
      - name: Require the installed GNU client
        run: |
          test -x /opt/gnu-emacs-oracle/bin/emacsclient
          /opt/gnu-emacs-oracle/bin/emacsclient --version
      - name: Run all lifecycle cases serially
        env:
          NEOMACS_GNU_EMACSCLIENT: /opt/gnu-emacs-oracle/bin/emacsclient
        run: cargo nextest run --locked -p neomacs --test daemon_lifecycle

  neomacs-melpa-direct-windows-tests:
    name: MELPA direct adapter Job Object contracts (windows x86_64)
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'neomacs-melpa-direct-windows-tests') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - *checkout

      - name: Prepare workspace temp directory
        shell: pwsh
        run: |
          $taskTmp = Join-Path $env:GITHUB_WORKSPACE 'tmp'
          New-Item -ItemType Directory -Force -Path $taskTmp | Out-Null
          "TMPDIR=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # Same workspace, dev profile, and native x86_64 target as the build
          # gate's windows-msvc-x86_64 check job.  Sharing its dependency
          # cache keeps one copy of that graph in the shared 10 GiB store
          # instead of two.
          cache-key: ci-windows-direct-adapter-x86_64
          cache-shared-key: windows-msvc-x86_64-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      - name: Run native Windows direct adapter contracts
        run: >-
          cargo nextest run
          -p neomacs-melpa-tests
          -E 'test(/direct_windows_/)'
          --success-output immediate
          --no-fail-fast

  neovm-core-tests:
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && ((needs.neomacs-test-runtime.result == 'success' && needs.neomacs-workspace-test-archive.result == 'success' && needs.gnu-emacs-oracle.result == 'success')) }}
    # The core shards spawn GNU directly in their parity tests, so they need
    # the pinned oracle. Depending on the warming job also means they restore
    # its cached build instead of compiling Emacs twenty times in parallel.
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: core

  # The Darwin arm of the neovm-core suite and of the host-hermetic
  # oracle-parity families.  These jobs are separate from the Linux shards, not
  # matrix arms, because they share nothing with Linux beyond the test sources:
  # the runtime and test binaries are compiled on the Mac, and the oracle is an
  # NS GNU built by the recipe's Darwin profile (setup-gnu-emacs-macos).
  #
  # BUILD ONCE, RUN FROM THE ARCHIVE.  The macOS jobs are shaped like the
  # Linux suites (neomacs-test-runtime + neomacs-workspace-test-archive feeding
  # nextest-shards.yml): neomacs-macos-test-build compiles the runtime and the
  # test binaries once, and the consumers below unpack them and run nextest
  # from the archive.  Before this, on main run 44786267593, every job compiled
  # for itself: the core job (fresh-build plus the test build plus the run)
  # took 38 minutes, each of the three oracle-family shards spent 14-26
  # minutes on a cold fresh-build of its own before a 24-25 minute test run,
  # and GitHub's macOS concurrency limit queued the core job ~40 minutes behind
  # the shards, so the suite's macOS wall time stayed ~100 minutes even after
  # the families were sharded.  Now one build runs in parallel with the GNU
  # warmer, and four consumers that build no Rust test binaries follow it (the
  # core job's trybuild contract runner still compiles its scratch fixture,
  # as it does on the Linux core shards).
  #
  # The build is a harness build, never shipped: a hosted macOS runner has
  # ~7 GB of RAM and this workspace's shipping profile is fat LTO with a link
  # that needs far more, so the runtime builds with LTO off and 16 codegen
  # units (the Linux archive job makes the same trade, and no neovm-core or
  # oracle assertion is about the runtime binary's optimization level).  The
  # test binaries use the default test profile, the one `cargo nextest run`
  # used when each job built its own.
  #
  # A Mac lane reproduces the core job locally with
  # scripts/ci/run-neovm-core-macos-job.sh, which builds in place and runs the
  # same checks the core consumer runs from this archive.
  neomacs-macos-test-build:
    name: macOS test build (macos aarch64)
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'neomacs-macos-test-build') }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-neovm-core-tests-macos
          # The `-ws` generation marks the workspace-crate cache.  rust-cache's
          # key does NOT include `cache-workspace-crates` (only the shared key,
          # platform, toolchain and lock hash), and it skips saving when the
          # key is already up to date.  Without a new key, a pre-existing
          # `macos-aarch64-release` entry (saved without workspace crates)
          # would be restored and the improved save silently skipped.
          cache-shared-key: macos-aarch64-release-ws
          # fresh-build and the test targets recompile the workspace's own
          # crates on every commit, which was ~33 min of a job on a 3-core
          # runner.  The release-profile inputs are stable enough to cache
          # them.  This job is the ONE saver of the shared entry: the Doom
          # job and gui-tests-macos.yml restore it with workspace crates
          # enabled but never save, so no other job can race different
          # contents (or the slower dependency-only shape) under this key.
          cache-workspace-crates: "true"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
          target: aarch64-apple-darwin

      - name: Build the runtime under test
        run: cargo xtask fresh-build --release

      # One archive for every macOS consumer.  Cargo's target-selection flags
      # apply to every selected package, so `--lib --test oracle` here would
      # also strip neovm-core down to its lib; the packages' default test
      # targets are already the exact sets the consumers run: every test
      # target of neovm-core (what `cargo nextest run -p neovm-core` built),
      # and neovm-oracle-tests' lib plus its one `oracle` binary
      # (autotests = false, a single [[test]]).  Building both packages in one
      # invocation does not change neovm-core's resolved features: `cargo
      # tree -e features` over neovm-core's closure is identical with and
      # without neovm-oracle-tests selected.
      - name: Build and archive the macOS test binaries
        run: |
          cargo nextest archive \
            --package neovm-core \
            --package neovm-oracle-tests \
            --archive-file neomacs-macos-tests.tar.zst

      - name: Package the macOS test runtime
        run: |
          test -x target/release/neomacs
          test -x target/release/neomacsclient
          test -f target/release/neomacs.pdump
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el
          test -d etc/charsets
          # The fresh-build stamp attests the binary to the Lisp tree; the
          # oracle harnesses refuse a runtime without it.  Package it with the
          # pair it belongs to.
          test -f target/release/neomacs.fresh-build-stamp
          tar czf neomacs-test-runtime-macos-aarch64.tar.gz \
            target/release/neomacs \
            target/release/neomacsclient \
            target/release/neomacs.pdump \
            target/release/neomacs.fresh-build-stamp \
            lisp \
            etc

      - name: Upload the macOS test runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neomacs-test-runtime-macos-aarch64
          path: neomacs-test-runtime-macos-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload the macOS test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neomacs-macos-tests-nextest-archive-macos-aarch64
          path: neomacs-macos-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

  # The neovm-core package on macOS (unit and integration tests, including the
  # parity families that spawn GNU), run from neomacs-macos-test-build's
  # archive against the pinned NS GNU.  The host-hermetic oracle-parity
  # families -- the org/divergence/file/process selection of package
  # neovm-oracle-tests whose expectations hold on both hosts after the
  # macOS-keyed fixes -- run in Verify mode in neovm-oracle-families-macos
  # (below), three hash shards in parallel, so those expectations are proven
  # in CI and not only on a developer's Mac.  The unfiltered package still
  # carries Linux-keyed lib expectation families (cus_start_platform,
  # defvar_*, fontset, file acl, trigonometry, ...); making those
  # host-hermetic is a separate expectation project, and the shard job states
  # its boundary rather than skipping them silently.  The GNU build itself is
  # warmed by the separate `gnu-emacs-oracle-macos` job (below), so a
  # cancelled test job cannot lose it.
  #
  # The steps are scripts/ci/run-neovm-core-macos-job.sh's sequence with the
  # build replaced by the shared archive: prove the oracle, prove the
  # nil-`text-quoting-style` locale cases against it, run the package.
  neovm-core-tests-macos:
    name: neovm-core tests (macos aarch64)
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && (needs.gnu-emacs-oracle-macos.result == 'success' && needs.neomacs-macos-test-build.result == 'success') }}
    needs: [gnu-emacs-oracle-macos, neomacs-macos-test-build]
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      # The archived binaries find the unpacked runtime the way the Linux
      # core shards do (nextest-shards.yml).  thread_soak resolves its editor
      # from NEOVM_BINARY_PATH / NEOMACS_BIN.
      NEOVM_BINARY_PATH: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      # The runtime's Homebrew tooling, and the toolchain the contract
      # runners' trybuild scratch builds need.
      - uses: ./.github/actions/install-build-deps

      # Restores the build the warmer saved; the smoke step inside fails the
      # job if the cache produced the wrong oracle.
      - name: Set up the pinned GNU Emacs oracle
        id: oracle
        uses: ./.github/actions/setup-gnu-emacs-macos

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # This job compiles nothing of its own: the test binaries come from
          # the archive.  Like the Linux shards, it caches nothing.
          cache: "false"
          cache-key: ci-neovm-core-tests-macos
          install-nextest: true

      # The core filter includes neovm-core's compile-fail contract targets
      # (mint_seal_contracts runs without the contract-fixtures feature).
      # trybuild invokes `cargo --offline` on a scratch project that copies
      # this workspace's Cargo.lock and [patch.crates-io] table, so the
      # locked crates must already be in CARGO_HOME -- the same step the
      # Linux core shards run.
      - name: Fetch locked crates for trybuild's offline builds
        run: cargo fetch --locked

      - &macos_download_runtime
        name: Download the macOS test runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neomacs-test-runtime-macos-aarch64
          path: .

      - &macos_unpack_runtime
        name: Unpack the macOS test runtime
        run: |
          tar xzf neomacs-test-runtime-macos-aarch64.tar.gz
          chmod +x target/release/neomacs target/release/neomacsclient
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el
          test -f target/release/neomacs.fresh-build-stamp

      - &macos_download_archive
        name: Download the macOS test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neomacs-macos-tests-nextest-archive-macos-aarch64
          path: .

      # The oracle is the environment seam: prove it is the pinned build
      # before running anything.  A cache miss that produced a TTY-less,
      # native-comp or otherwise different GNU fails here, not inside a
      # hundred parity tests.
      - name: Check the pinned GNU Emacs oracle
        run: |
          scripts/ci/check-gnu-oracle.sh \
            "${{ steps.oracle.outputs.emacs }}" \
            "${{ steps.oracle.outputs.version }}" \
            "${{ steps.oracle.outputs.manifest }}" \
            "${{ steps.oracle.outputs.commit }}"

      # The nil-`text-quoting-style' locale resolution, the one input this
      # job can check end to end (batch, no pty): C locale is grave, UTF-8 is
      # curve, and the display-table backtick entry is grave, agreeing with
      # the pinned GNU byte for byte (the script cites the GNU lines).
      - name: Check the text-quoting-style locale cases
        run: |
          scripts/ci/check-text-quoting-locale.sh \
            "$GITHUB_WORKSPACE/target/release/neomacs" \
            "${{ steps.oracle.outputs.emacs }}"

      # Oracle families resolve GNU through the attested resolver
      # (neomacs-test-oracle) from NEOVM_FORCE_ORACLE_PATH, and a missing
      # oracle panics inside them rather than skipping.
      - name: Run the macOS neovm-core suite
        env:
          NEOVM_FORCE_ORACLE_PATH: ${{ steps.oracle.outputs.emacs }}
        run: |
          cargo nextest run \
            --archive-file neomacs-macos-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            -E 'package(neovm-core)' \
            --test-threads 16 \
            --no-fail-fast

  # The host-hermetic oracle-parity families on macOS, split from
  # neovm-core-tests-macos into three hash partitions.  The selection spawns
  # the pinned GNU for every case, and on one 3-core runner it ran ~62 minutes
  # after the ~40 minutes of the core job.  Each shard runs its partition from
  # neomacs-macos-test-build's archive and runtime (the oracle tests need
  # NEOVM_BINARY_PATH), so no shard compiles; nextest's hash partition is
  # disjoint, exhaustive and deterministic, so every selected case still runs
  # exactly once.
  neovm-oracle-families-macos:
    name: neovm-oracle families (macos aarch64) shard ${{ matrix.partition }}/3
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && (needs.gnu-emacs-oracle-macos.result == 'success' && needs.neomacs-macos-test-build.result == 'success') }}
    needs: [gnu-emacs-oracle-macos, neomacs-macos-test-build]
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      - name: Set up the pinned GNU Emacs oracle
        id: oracle
        uses: ./.github/actions/setup-gnu-emacs-macos

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # The shard runs prebuilt binaries out of the archive and caches
          # nothing, like the Linux shards.
          cache: "false"
          cache-key: ci-neovm-oracle-families-macos
          install-nextest: true

      - *macos_download_runtime
      - *macos_unpack_runtime
      - *macos_download_archive

      - name: Check the pinned GNU Emacs oracle
        run: |
          scripts/ci/check-gnu-oracle.sh \
            "${{ steps.oracle.outputs.emacs }}" \
            "${{ steps.oracle.outputs.version }}" \
            "${{ steps.oracle.outputs.manifest }}" \
            "${{ steps.oracle.outputs.commit }}"

      # The host-hermetic oracle-parity families, on the Darwin runner
      # against the same attested GNU and the runtime neomacs-macos-test-build
      # produced.  Verify mode runs the local GNU for every case and compares
      # it with the checked-in expectation, then requires Neomacs to match
      # that same live GNU: the live-comparison cases that Snapshot mode can
      # only check against a recorded value execute here, and a macOS-keyed
      # expectation is proven in CI rather than only on a lane's Mac.
      #
      # The test(...) selection is the set proven host-hermetic end to end on
      # the macmini (9652/9652 in Verify).  The rest of the package's lib
      # expectations are still GNU/Linux-keyed (cus_start_platform,
      # defvar_*, fontset, ...); running them here would be red for reasons a
      # workflow change cannot fix, so they stay on the Linux shards until
      # their families get the same macOS-keyed treatment.  The archive also
      # carries neovm-core, so package(neovm-oracle-tests) keeps the selection
      # to what `-p neovm-oracle-tests --test oracle --lib` selected: that
      # package's archived binaries are exactly its lib and `oracle`.
      - name: Run the macOS oracle-parity families
        if: ${{ !cancelled() }}
        env:
          # The identity pins the canonical oracle environment gives GNU on
          # Linux.  GNU prefers $NAME over the passwd GECOS (src/editfns.c:
          # 128-134), and a macOS runner's account full name is exactly the
          # leak the org author expectations pin out.  Scoped to this step so
          # cargo and Homebrew keep the runner's own identity.
          NAME: ""
          USER: exec
          LOGNAME: exec
          HOSTNAME: oracle-host
          EMAIL: exec@oracle-host
          NEOVM_FORCE_ORACLE_PATH: ${{ steps.oracle.outputs.emacs }}
          NEOVM_ORACLE_MODE: verify
          NEOVM_BINARY_PATH: ${{ github.workspace }}/target/release/neomacs
          NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
          NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
          NEOVM_LIBFAKETIME_SO: ${{ steps.oracle.outputs.libfaketime }}
        run: >-
          cargo nextest run
          --archive-file neomacs-macos-tests.tar.zst
          --extract-to "$TMPDIR/nextest"
          --workspace-remap "$GITHUB_WORKSPACE"
          -E 'package(neovm-oracle-tests) and (test(/^oracle_backend_quit_binding::/) | test(/org_mode/) | test(/orgexport_/) | test(~process_attributes) | test(/oracle_harness/) | test(/system_info/) | test(/user_env_load_locale_state/) | test(/misc_strict_edge_semantics/) | test(/case_428/) | test(/case_444/) | test(/file_name_runtime/) | test(/file_remote_tramp/) | test(/file_ops_deep/) | test(/float_operations_comprehensive/) | test(/member_alist_semantics/) | test(/jit_flonum_semantics/) | test(/conversion_format_semantics/) | test(/merge_ordered_lists_semantics/) | test(/oracle_command_line_max_length_is_derived_from_this_editors_stack_rlimit/) | test(/file::attributes_strict_edge_semantics/) | test(/load_history_semantics/) | test(/load_suffixes_semantics/) | test(/name_case_insensitive_strict_edge_semantics/) | test(/snarf_documentation_last_writer/) | test(/^trigonometry::/) | test(/^platform_host_semantics::/) | test(/^compare::case_table::/) | test(/^oracle_divergence::divergence::coding_process::/) | test(/^oracle_divergence_combo_complex::divergence_combo_complex::case_083::/) | test(/^oracle_combination::combination::signal_processing_advanced::/) | test(/^file::acl_strict_edge_semantics::/) | test(/^inotify_public_semantics::/) | test(/^oracle_divergence::divergence::process_async_extra_runtime::/) | test(/^oracle_divergence::divergence::unicode_normalization::/) | test(/^process::wait_semantics::/) | test(/^process::pty_output_vs_exit_semantics::/) | test(/^string::comparison_comprehensive::/) | test(/^oracle_combination::combination::/))'
          --partition hash:${{ matrix.partition }}/3 --no-fail-fast

  # The compile-fail contracts build only with the `contract-fixtures`
  # feature, so the default suites and the shard matrix never run them and
  # this standalone job is their home. It needs the workspace checkout, not
  # the nextest archive, and it stays out of the shard matrix. The runners go
  # through nextest like every other test; .config/nextest.toml runs them one
  # at a time (trybuild serializes its scratch project behind one lock) with a
  # watchdog sized for a fixture crate build instead of a unit test.
  compile-contracts:
    name: compile contracts (linux x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'compile-contracts' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # Same workspace, dev profile, and x86_64 target as the build gate's
          # check job: its dependency graph IS `linux-x86_64-dev`.  A private
          # key made a second ~1.6 GiB copy of it in the shared 10 GiB store
          # for a job that runs on every main push.
          cache-key: ci-compile-contracts-linux-x86_64
          cache-shared-key: linux-x86_64-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      # Gate rule: rust-src REQUIRED. The contract goldens embed std source
      # excerpts ($RUST/... snippets in Send/Sync note chains), which rustc
      # renders only when the std sources are installed, and they are blessed
      # with rust-src present (rust-toolchain.toml lists the component and the
      # setup action installs it). A toolchain without it mismatches every
      # excerpt-bearing golden, so fail fast before any runner starts.
      - name: Assert rust-src is installed (contract gate rule)
        run: |
          src_dir="$(rustc --print sysroot)/lib/rustlib/src/rust/library"
          if [ ! -d "$src_dir" ]; then
            echo "::error::rust-src is REQUIRED for the contract suites but $src_dir is missing." >&2
            echo "::error::Goldens are blessed with rust-src present; rust-toolchain.toml lists the component." >&2
            exit 1
          fi
          echo "rust-src present: $src_dir"

      # trybuild always invokes `cargo --offline` on a scratch project that
      # copies this workspace's Cargo.lock and [patch.crates-io] table. The
      # eval-exec forks in that table (cosmic-text first) are git checkouts a
      # fresh runner does not have, so their sources must be fetched into
      # CARGO_HOME before any contract runner starts. This job uses the rustup
      # toolchain from rust-toolchain.toml, which lists rust-src: rustc renders
      # std source excerpts into compile-fail diagnostics only when the std
      # source is installed, so the goldens are blessed with rust-src present.
      # That is the gate rule (asserted below): rust-src REQUIRED everywhere.
      - name: Fetch locked crates for trybuild's offline builds
        run: cargo fetch --locked

      # The runners are compiled only with the `contract-fixtures` feature
      # (41eaff923a moved them off #[ignore]). Without it the test targets
      # build empty and nextest runs nothing, so the job also counts
      # the runners that actually passed: p0s3 1, p1rv 3, thread_safety 16
      # (its own, sole-owner, p2ht, pentry, pentry E2 loan, pentry E2 heap
      # transfer, pentry E2 cold receipt, nmjit N1, three host-effect
      # tests, intern-shared, P15, split T2, jit grace, and
      # obarray_view_swap_compile_contracts),
      # chartable_write 1, mint_seal 1 (the mint-seal trybuild fixtures),
      # heap_capability 1 (U1 collect and sweep-protocol E0133), and
      # retained_leaf 1 (the retained-leaf trybuild fixtures);
      # check_compile_contracts.py enforces these per-target counts and the
      # summary. The nmjit N1 runner drives the isolated
      # nmjit-type-contracts workspace through its own nested nextest run.
      # Every runner lives in these test targets: the job never builds the
      # opt-level-2 lib unit-test binary, and no runner hides in the `core`
      # binary, which no contract job builds with the feature.
      - name: Self-test the contract result parser
        run: python3 scripts/check_compile_contracts.py --self-test

      - name: Run the compile-fail contracts
        run: |
          set -o pipefail
          {
            # --no-fail-fast: one failing runner must not hide the others' goldens
            # (2026-10-29: a red p1rv runner hid 4 stale thread_safety goldens).
            env -u TRYBUILD cargo nextest run -p neovm-core --features contract-fixtures --no-fail-fast \
              --test p0s3_contracts --test p1rv_contracts \
              --test thread_safety_contracts --test chartable_write_contracts \
              --test mint_seal_contracts --test heap_capability_contracts \
              --test retained_leaf_contracts
          } 2>&1 | tee "$RUNNER_TEMP/contracts.log"
          python3 scripts/check_compile_contracts.py "$RUNNER_TEMP/contracts.log"

  # release-native-depth is not a default feature, and the workspace archive
  # must not enable it: the rest of the eval harness asserts the test counter.
  # This job is the eval test that runs the release reading of the mint.
  neovm-eval-tests:
    name: neovm-eval release native depth (linux x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'neovm-eval-tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-neovm-eval-release-native-depth-linux-x86_64
          cache-shared-key: linux-x86_64-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      - name: Run the release-native-depth mint regressions
        run: cargo nextest run -p neovm-eval --lib --features release-native-depth -E 'test(n5_release_)'

  # The same contracts on the arm64 macOS toolchain. rustc on aarch64-apple-darwin
  # orders and caps its E0277/E0599 notes differently, so the suite keeps
  # arm64_macos overlays of the context and generic goldens. Until 2026-10-31 no
  # job compiled them: the Linux job cannot, and the macOS parity job builds
  # without `contract-fixtures`, so the overlays drifted for weeks (the Mac
  # bless rewrote 9 of them). This job is their gate.
  compile-contracts-macos:
    name: compile contracts (macos aarch64)
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'compile-contracts-macos') }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-compile-contracts-macos-aarch64
          cache-shared-key: macos-aarch64-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          target: aarch64-apple-darwin
          install-nextest: true

      # Same gate rule as the Linux contracts job: rust-src REQUIRED (the
      # goldens, including the arm64_macos overlays, are blessed with it).
      - name: Assert rust-src is installed (contract gate rule)
        run: |
          src_dir="$(rustc --print sysroot)/lib/rustlib/src/rust/library"
          if [ ! -d "$src_dir" ]; then
            echo "::error::rust-src is REQUIRED for the contract suites but $src_dir is missing." >&2
            echo "::error::Goldens are blessed with rust-src present; rust-toolchain.toml lists the component." >&2
            exit 1
          fi
          echo "rust-src present: $src_dir"

      - name: Fetch locked crates for trybuild's offline builds
        run: cargo fetch --locked

      - name: Self-test the contract result parser
        run: python3 scripts/check_compile_contracts.py --self-test

      - name: Run the compile-fail contracts
        run: |
          set -o pipefail
          {
            env -u TRYBUILD cargo nextest run -p neovm-core --features contract-fixtures --no-fail-fast \
              --test p0s3_contracts --test p1rv_contracts \
              --test thread_safety_contracts --test chartable_write_contracts \
              --test mint_seal_contracts --test heap_capability_contracts \
              --test retained_leaf_contracts
          } 2>&1 | tee "$RUNNER_TEMP/contracts.log"
          python3 scripts/check_compile_contracts.py "$RUNNER_TEMP/contracts.log"

  gnu-emacs-oracle:
    name: GNU Emacs oracle (linux x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'gnu-emacs-oracle' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout

      # Warm the per-commit cache of the pinned GNU reference once, while the
      # runtime and test archives build, so the tui shards and the MELPA and
      # GUI parity jobs each restore one cached build instead of compiling
      # Emacs twenty-odd times in parallel on a cache miss.
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror

      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs

  gnu-emacs-oracle-macos:
    name: GNU Emacs oracle (macos aarch64)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'gnu-emacs-oracle-macos' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - *checkout

      # Warm the cache entry once per (GNU commit, recipe profile, runner
      # image, recipe hash), from a job of its own: the build is attested and
      # saved before any test job starts, so a test job that is red or
      # restarted cannot lose it.  On a cache hit this job is a restore plus
      # the smoke check (seconds); on a miss it compiles the pinned GNU with
      # the Darwin recipe.  The measured miss time at the runner's 3-way
      # parallelism is recorded in the commit that added this job; the warm
      # budget is 60 minutes, well above it.  A push can still cancel this
      # whole run while that build is in flight, so
      # .github/workflows/macos-oracle-cache.yml warms the same entry from a
      # schedule or workflow_dispatch that push cancellations cannot
      # interrupt; this job only keeps one run self-sufficient while that
      # schedule is cold.
      - name: Set up GNU Emacs oracle (macOS)
        uses: ./.github/actions/setup-gnu-emacs-macos

  neomacs-test-runtime:
    name: Packaged Neomacs Runtime (linux x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'neomacs-test-runtime' || github.event.inputs.job == 'neomacs-display-tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-shared-runtime-linux-x86_64
          # Host compilers only. linux-x86_64-release was written by the
          # xwidget nix shell, whose PKG_CONFIG poisons a restored target.
          cache-shared-key: linux-x86_64-release-2
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build fresh release runtime
        run: |
          # The dump writer creates the image with GNU's open(..., 0666)
          # (src/pdumper.c:4200), so its mode is 0666 masked by the umask.
          # Pin the standard 022 build umask so the artifact this job
          # packages, and the staged-release assertion below, are
          # deterministic across runner images.
          umask 022
          cargo xtask fresh-build --release

      - name: Smoke the pdump relocating fallback (NEOVM_PDUMP_NO_FIXED_MAP)
        run: |
          # The planned-base hit path skips relocation validation wholesale;
          # this keeps the delta-apply fallback (and its bounds checks) green
          # forever. A green lane on purpose — the standing-red display jobs
          # would hide a fallback regression.
          NEOVM_PDUMP_NO_FIXED_MAP=1 target/release/neomacs --batch -Q --eval '(kill-emacs 0)'

      - name: Run upstream GNU SQLite ERT suite
        run: >-
          target/release/neomacs
          --batch -Q
          -l test/src/sqlite-tests.el
          -f ert-run-tests-batch-and-exit

      - name: Run process output and timer fairness ERT suite
        run: >-
          target/release/neomacs
          --batch -Q
          -l test/neomacs/process-timer-fairness-test.el
          -f ert-run-tests-batch-and-exit

      - name: Run unchanged upstream GNU file-notify ERT suite
        env:
          REMOTE_TEMPORARY_FILE_DIRECTORY: /dev/null
        run: |
          mkdir -p "$PWD/target/file-notify-ert-tmp"
          TMPDIR="$PWD/target/file-notify-ert-tmp" \
            target/release/neomacs --batch -Q \
              -l test/lisp/filenotify-tests.el \
              -f ert-run-tests-batch-and-exit

      # The standing detector for the missing-GC-root class (DIVERGENCES.md
      # 161/162). This collector is precise, so a Lisp value that rides Rust
      # control flow is invisible to trace_roots unless it was rooted
      # deliberately -- and such a bug is invisible to an ordinary green suite:
      # the whole 38k-pin oracle suite was green on BOTH sides of 161's
      # use-after-free. NEOVM_GC_STRESS=1 collects at every allocation-bearing
      # safe point, which turns "sometimes" into "always".
      - name: GC-stress the shipped runtime
        run: cargo xtask gc-stress

      # Exercise install.sh end-to-end against a release-shaped tree built
      # from THIS commit (file:// download base), so the curl|bash path --
      # download, checksum, versioned install, symlink chain, runtime-root
      # resolution with no environment variables -- is proven before any
      # release publishes it.
      #
      # BOTH tarball shapes are staged, because install.sh has a branch for
      # each and a release that only exercises one of them ships the other
      # untested: the current layout, whose dump sits in the archlib
      # (libexec/neomacs/<version>/<triple>, GNU's archlibdir), and the
      # pre-0.0.16 layout, whose dump sits in bin/ -- which --tag still has to
      # be able to install.
      - name: Verify install.sh against a staged release tree
        run: |
          set -eux
          # The staging below copies the build artifacts rather than
          # re-installing them, so their modes reach the archive unchanged;
          # pin the umask so cp cannot mask a permission regression (and so
          # the archive-entry assertion is deterministic across runners).
          umask 022
          triple=x86_64-unknown-linux-gnu
          crate_version="$(
            awk '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0}
                 s && /^version[[:space:]]*=/{gsub(/^version[[:space:]]*=[[:space:]]*"/,"");gsub(/".*$/,"");print;exit}' \
              Cargo.toml
          )"
          archlib="libexec/neomacs/$crate_version/$triple"

          stage_release() {
            local version="$1" layout="$2"
            local stage_root="$TMPDIR/install-release-$layout"
            local staged="$stage_root/v$version"
            local pkg_parent="$stage_root/pkg"
            local pkg="$pkg_parent/neomacs-$version-$triple"
            rm -rf "$stage_root"
            mkdir -p "$staged" "$pkg/bin" "$pkg/share/neomacs"
            cp target/release/neomacs target/release/neomacsclient "$pkg/bin/"
            if [ "$layout" = archlib ]; then
              mkdir -p "$pkg/$archlib"
              cp target/release/neomacs.pdump "$pkg/$archlib/neomacs.pdump"
            else
              cp target/release/neomacs.pdump "$pkg/bin/neomacs.pdump"
            fi
            cp -r lisp etc "$pkg/share/neomacs/"
            # Members owned by uid/gid 1001, what the v0.0.20 release tarball
            # recorded (the release runner's account), whatever account this
            # runner happens to use: the root install below has to prove
            # install.sh never carries an archive's owner into the tree.
            tar czf "$staged/neomacs-$version-$triple.tar.gz" \
              --owner=1001 --group=1001 --numeric-owner \
              -C "$pkg_parent" "neomacs-$version-$triple"
            # The installed runtime is loaded by every user: a root install
            # puts the dump in a system prefix, and the check below runs the
            # editor as an unprivileged account.  The writer requests GNU's
            # open(..., 0666) creation mode, so under this step's pinned 022
            # umask the entry must be -rw-r--r--; the old tempfile default
            # was a hard 0600 that plain cp carried into the archive and a
            # root install then made unreadable.  Assert the archive entry
            # before install.sh, so the packaging layer stays pinned even if
            # install.sh later normalizes modes.
            local dump_rel
            if [ "$layout" = archlib ]; then
              dump_rel="$archlib/neomacs.pdump"
            else
              dump_rel="bin/neomacs.pdump"
            fi
            tar tvzf "$staged/neomacs-$version-$triple.tar.gz" \
              | grep -F "/$dump_rel" | grep -q '^-rw-r--r--' \
              || { echo "packaged $dump_rel is not 0644 (world-readable)" >&2; exit 1; }
            ( cd "$staged" && sha256sum "neomacs-$version-$triple.tar.gz" > SHA256SUMS )
            local prefix="$stage_root/prefix"
            NEOMACS_DOWNLOAD_BASE="file://$stage_root" \
              sh install.sh --tag "v$version" --prefix "$prefix"
            test -x "$prefix/bin/neomacs"
            test "$(readlink "$prefix/share/neomacs/current")" = "versions/$version"
            test "$(readlink "$prefix/bin/neomacs")" = "../share/neomacs/current/bin/neomacs"
            local exe ver_dir
            exe="$(readlink -f "$prefix/bin/neomacs")"
            ver_dir="$(dirname "$(dirname "$exe")")"
            if [ "$layout" = archlib ]; then
              test -f "$ver_dir/$archlib/neomacs.pdump"
              test ! -f "$(dirname "$exe")/neomacs.pdump"
              # exec-directory is PATH_EXEC (GNU src/callproc.c:1961), so the
              # installed tree has to answer with its own archlib.
              env -u NEOMACS_RUNTIME_ROOT -u EMACSPATH \
                "$prefix/bin/neomacs" --batch \
                --eval "(princ exec-directory)" | grep -Fx "$ver_dir/$archlib/"
            else
              test -f "$(dirname "$exe")/neomacs.pdump"
            fi
            test -d "$ver_dir/share/neomacs/lisp"
            env -u NEOMACS_RUNTIME_ROOT \
              "$prefix/bin/neomacs" --batch --eval '(princ (emacs-version))'

            # The same archive installed by root into a system prefix.  Root's
            # tar restores the archive's owner (1001, above) unless told not
            # to, and `cp -a' carries it on, so a uid-1001 account could then
            # rewrite the dump and the Lisp tree.  Everything installed must be
            # root's, and still runnable by an ordinary user.
            local root_prefix foreign
            root_prefix="$(mktemp -d /tmp/neomacs-root-install.XXXXXX)"
            sudo env NEOMACS_DOWNLOAD_BASE="file://$stage_root" \
              sh install.sh --tag "v$version" --prefix "$root_prefix" --skip-smoke
            foreign="$(sudo find "$root_prefix" -mindepth 1 \( ! -user 0 -o ! -group 0 \) -print)"
            if [ -n "$foreign" ]; then
              printf 'not owned by root:root after a root install:\n%s\n' "$foreign" >&2
              exit 1
            fi
            env -u NEOMACS_RUNTIME_ROOT \
              "$root_prefix/bin/neomacs" --batch --eval '(princ (emacs-version))'
            sudo rm -rf "$root_prefix"
          }

          stage_release citest archlib
          stage_release citestlegacy legacy

      # The treesit oracle/TUI rows and the MELPA grammar parity tests read
      # their grammars through a cache-only reader that fails loudly on a
      # cold cache and never touches the network, and every one of their
      # jobs unpacks this shared runtime tar into the workspace -- so prime
      # the grammar cache once here, with the same GNU oracle emacs that
      # builds it on every consumer's behalf otherwise, and ship it inside
      # the tar below.  A shard compiles nothing by design; this is the one
      # priming step all of them share.  (The runner races the gnu-emacs-
      # oracle warmer on a cold per-commit cache: both may build the oracle
      # in parallel rather than put this job, which every test job waits
      # on, behind a serial warm.)
      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs

      - name: Prefetch pinned Tree-sitter grammars
        env:
          NEOVM_FORCE_ORACLE_PATH: /opt/gnu-emacs-oracle/bin/emacs
        # Verified entries short-circuit, so each retry re-fetches only the
        # grammars whose GitHub clone failed (TLS EOFs are transient).
        run: |
          for attempt in 1 2 3 4 5; do
            cargo xtask treesit-grammars && exit 0
            echo "::warning::Tree-sitter grammar prefetch attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Tree-sitter grammar prefetch failed after 5 attempts"
          exit 1

      - name: Package shared test runtime
        run: |
          test -x target/release/neomacs
          test -x target/release/neomacsclient
          test -f target/release/neomacs.pdump
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el
          test -d etc/charsets
          # The fresh-build stamp attests the binary to the Lisp tree; the
          # oracle harnesses refuse a runtime without it.  Package it with the
          # pair it belongs to.
          test -f target/release/neomacs.fresh-build-stamp
          # The grammar cache travels with the runtime for the same reason:
          # the treesit rows refuse a runtime without it.  Its cache reader
          # verifies the ready marker, the built library, and the parser.c
          # SHA-256 on every read, so tar round-tripping is safe; the git
          # object stores under source/ are prefetch provenance the reader
          # never opens, and leaving them out keeps the tar tens of MB
          # smaller.
          test -f target/melpa/tree-sitter-grammar-cache/go/*/ready
          tar czf neomacs-test-runtime-linux-x86_64.tar.gz \
            --exclude '*/source/.git' \
            target/release/neomacs \
            target/release/neomacsclient \
            target/release/neomacs.pdump \
            target/release/neomacs.fresh-build-stamp \
            target/melpa/tree-sitter-grammar-cache \
            lisp \
            etc

      - name: Upload shared test runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neomacs-test-runtime-linux-x86_64
          path: neomacs-test-runtime-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  neovm-oracle-tests:
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && ((needs.neomacs-test-runtime.result == 'success' && needs.neomacs-workspace-test-archive.result == 'success' && needs.gnu-emacs-oracle.result == 'success')) }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: oracle

  neomacs-tui-tests:
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && ((needs.neomacs-test-runtime.result == 'success' && needs.neomacs-workspace-test-archive.result == 'success' && needs.gnu-emacs-oracle.result == 'success')) }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: tui

  neomacs-melpa-tests:
    # The batch entry expands to four identically named jobs, one per hash
    # partition (see the matrix comment); the matrix's `partition` value is
    # what identifies a shard in the UI.  Do not suffix this name: CI
    # watchers key per-job baselines on it (tmp/v10x/ci/ci-watch.sh), and a
    # renamed job would lose its baseline.
    name: MELPA ${{ matrix.suite }} compatibility and GNU parity (linux x86_64)
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && ((needs.neomacs-test-runtime.result == 'success' && needs.neomacs-workspace-test-archive.result == 'success' && needs.gnu-emacs-oracle.result == 'success')) }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Select by package and test name, never by binary id: the binary
          # layout is an implementation detail (see docs/building.md). The
          # interactive package-TUI corpus moved to neomacs-tui-tests in
          # commit c9a3c0ed81 and runs in the tui shards, so there is no
          # melpa_tui target here.
          #
          # The batch corpus is ~951 tests, and each one drives a real GNU
          # and a real Neomacs process; on a 4-vCPU runner it needs 18-28
          # minutes of wall time by itself, so job setup (5.6-8.5 minutes,
          # including the oracle restore/build) left no margin inside the
          # 30-minute timeout -- three consecutive runs were cancelled at
          # the timeout (run 40740145396 reached only 816/951 before being
          # killed at 30.5 minutes).  Partition the corpus across four
          # runners: nextest's hash partition is disjoint, exhaustive and
          # deterministic (a test always lands in the same shard), so every
          # shard finishes well inside the timeout and a failure is still
          # attributable to one shard.  The GUI corpus is a single short
          # job and runs whole.
          - suite: batch
            partition: "hash:1/4"
            filter: package(neomacs-melpa-test-support) or (package(neomacs-melpa-tests) and not test(~gui_parity_tests::))
          - suite: batch
            partition: "hash:2/4"
            filter: package(neomacs-melpa-test-support) or (package(neomacs-melpa-tests) and not test(~gui_parity_tests::))
          - suite: batch
            partition: "hash:3/4"
            filter: package(neomacs-melpa-test-support) or (package(neomacs-melpa-tests) and not test(~gui_parity_tests::))
          - suite: batch
            partition: "hash:4/4"
            filter: package(neomacs-melpa-test-support) or (package(neomacs-melpa-tests) and not test(~gui_parity_tests::))
          - suite: gui
            partition: "hash:1/1"
            filter: package(neomacs-melpa-tests) and test(~gui_parity_tests::)
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEXTEST_FILTER: ${{ matrix.filter }}
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
      NEOMACS_MELPA_ORACLE_EMACS: /opt/gnu-emacs-oracle/bin/emacs
      NEOMACS_GUI_TEST_BACKEND: x11
      NEOMACS_GUI_TEST_BINARY: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_GUI_TEST_GNU_EMACS: /opt/gnu-emacs-oracle/bin/emacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Restore pinned MELPA source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/melpa/source-package-cache
            target/melpa/source-build-tools
          # Content-addressed by pin revision and tool revision; the pin set
          # hash decides when to roll the key, and restore-keys keeps the
          # still-matching entries usable when one pin moves.
          key: melpa-source-packages-${{ hashFiles('crates/neomacs-infra/src/packages/melpa-package-lock.tsv') }}
          restore-keys: |
            melpa-source-packages-
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror
      - name: Install Linux ecosystem dependencies
        run: scripts/ci/setup-linux.sh ecosystem
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-melpa-${{ matrix.suite }}
          # Runs prebuilt binaries out of the downloaded nextest archive and
          # never invokes rustc, so a Cargo build cache here can never be read
          # back.  Measured: these entries were ~246 MiB each and carried the
          # SAME content hash as each other, in a 10 GiB store whose overflow
          # was evicting the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - &download_test_runtime
        name: Download shared test runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neomacs-test-runtime-linux-x86_64
          path: .

      - &unpack_test_runtime
        name: Unpack shared test runtime
        run: |
          tar xzf neomacs-test-runtime-linux-x86_64.tar.gz
          chmod +x target/release/neomacs target/release/neomacsclient
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el
          test -f target/release/neomacs.fresh-build-stamp

      - &download_workspace_test_archive
        name: Download workspace test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neomacs-workspace-tests-nextest-archive-linux-x86_64
          path: .

      - name: Install Nix for exact MELPA test runtimes
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      # After the MELPA Nix install so the action reuses that Nix instead of
      # provisioning its own.
      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs

      - name: Run deterministic package ecosystem compatibility tests
        run: |
          # Every batch test drives a real GNU Emacs and a real Neomacs (and
          # whatever helpers the package needs) for up to a few minutes, so
          # nextest's default one-test-per-core scheduling oversubscribes a
          # 4-vCPU runner: the 2026-10-29 run lost corfu to a RestartProbe
          # timeout, apheleia to a 255 restart, and multi_term to a signal
          # race, while the same tests pass on a quiet host.  Two at a time
          # keeps each editor's processes scheduled; the observed shard wall
          # times (4-9.5 min at four threads) stay inside the 30-minute
          # timeout with the halved width.
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E "$NEXTEST_FILTER" \
            --partition "${{ matrix.partition }}" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --test-threads 2 \
            --success-output immediate \
            --no-fail-fast

  neomacs-display-tests:
    name: display stack tests (linux x86_64)
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'neomacs-display-tests') && ((needs.neomacs-test-runtime.result == 'success' && needs.neomacs-workspace-test-archive.result == 'success')) }}
    # The layout-engine tests bootstrap GNU Lisp through neovm-core, which
    # reads the workspace's lisp/ tree.  The checkout has the tracked sources
    # but not the generated ones (lisp/international/charscript.el,
    # charprop.el) -- those come from `cargo xtask fresh-build --release` in
    # the shared-runtime job, exactly as they do for every nextest shard.
    # Without this artifact 24 display tests die in bootstrap with a
    # `file-missing` signal.
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_BINARY_PATH: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
      NEOMACS_FONT_FIXTURE_CACHE: ${{ github.workspace }}/tmp/font-fixtures
      NEXTEST_FILTER: "package(neomacs-display-protocol)|package(neomacs-display-runtime)|package(neomacs-layout-engine)|package(neomacs-renderer-wgpu)"
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps
      # The font tests resolve their families through the system fontconfig;
      # the build profile installs no fonts, so 18 CJK tests degraded to the
      # primary font's .notdef advance (8.428711 px for every CJK scalar).
      - name: Install display test fonts
        run: scripts/ci/setup-linux.sh fonts
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-display-tests
          # Runs prebuilt binaries out of the downloaded nextest archive and
          # never invokes rustc, so a Cargo build cache here can never be read
          # back.  Measured: these entries were ~246 MiB each and carried the
          # SAME content hash as each other, in a 10 GiB store whose overflow
          # was evicting the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      # The archive binaries read the live remapped workspace, not the
      # --extract-to tree. Prepare the pinned image without compiling Rust.
      - name: Prepare pinned image fixtures
        run: python3 scripts/ci/prefetch-image-fixtures.py --workspace "$GITHUB_WORKSPACE"

      # Nine files only: eight desktop faces plus Noto Sans Arabic. The
      # cache key is the hash of those pins, not the full font-fixtures set.
      # A restored directory is re-hashed by the provisioner; a partial
      # desktop-fonts directory is not treated as a hit.
      - name: Hash pinned display font fixtures
        id: display-font-pins
        run: |
          set -euo pipefail
          key=$(python3 scripts/ci/prefetch-display-font-fixtures.py --workspace "$GITHUB_WORKSPACE" --print-cache-key)
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Restore pinned display font fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/font-fixtures
          key: display-font-fixtures-${{ steps.display-font-pins.outputs.key }}

      - name: Prepare pinned display font fixtures
        run: python3 scripts/ci/prefetch-display-font-fixtures.py --workspace "$GITHUB_WORKSPACE"

      - name: Run display stack tests
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E "$NEXTEST_FILTER" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast

      - name: Install software OpenGL runtime
        run: sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Render with compute-less OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
          MESA_GL_VERSION_OVERRIDE: "3.3"
          MESA_GLES_VERSION_OVERRIDE: "3.0"
          MESA_GLSL_VERSION_OVERRIDE: "330"
          MESA_EXTENSION_OVERRIDE: -GL_ARB_compute_shader
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            --extract-overwrite \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --run-ignored only \
            -E 'package(neomacs-renderer-wgpu) and test(compute_less_gl)' \
            --no-fail-fast

  neomacs-prefix-face-tui-parity:
    name: GNU prefix face TUI parity (linux x86_64)
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && ((needs.neomacs-test-runtime.result == 'success' && needs.neomacs-workspace-test-archive.result == 'success' && needs.gnu-emacs-oracle.result == 'success')) }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_TUI_NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror
      - name: Install GNU Emacs oracle dependencies
        run: scripts/ci/setup-linux.sh oracle
      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs
      - name: Set up test runner
        uses: ./.github/actions/setup-rust
        with:
          # This job executes the archived test binary against the shared
          # fresh-build runtime and never invokes rustc.
          cache: "false"
          cache-key: ci-prefix-face-tui-parity
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      - name: Compare buffer-remapped prefix faces with GNU Emacs
        env:
          # Record the cast for triage but do not pace the graded run; see
          # crates/neomacs-tui-tests/src/lib.rs ("CI records without pacing").
          NEOMACS_TUI_RECORD: on
          NEOMACS_TUI_RECORD_DELAY_MS: "0"
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E 'package(neomacs-tui-tests) and test(~line_and_wrap_prefix_named_face_remapping_match_gnu)' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast

      - name: Upload prefix-face TUI recordings
        if: always()
        uses: ./.github/actions/upload-tui-recordings
        with:
          artifact-name: neomacs-prefix-face-tui-recordings-${{ github.run_id }}

  neomacs-gui-tests:
    name: real GUI tests (linux x86_64, X11 + Wayland)
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && ((needs.neomacs-test-runtime.result == 'success' && needs.neomacs-workspace-test-archive.result == 'success' && needs.gnu-emacs-oracle.result == 'success')) }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_GUI_TEST_BACKEND: x11
      NEOMACS_GUI_TEST_BINARY: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_GUI_TEST_GNU_EMACS: /opt/gnu-emacs-oracle/bin/emacs
      # display_line_numbers::native_line_number_gui_matrix_capacity_matches_attested_gnu
      # compares live X11 getters with the attested GNU GUI oracle and states
      # that requirement as NEOVM_ORACLE_MODE=verify + NEOVM_FORCE_ORACLE_PATH
      # (the same pair nextest-shards uses). Supply them rather than weaken
      # the test's "unsupported setup is a failure, never a skip" contract.
      NEOVM_ORACLE_MODE: verify
      NEOVM_FORCE_ORACLE_PATH: /opt/gnu-emacs-oracle/bin/emacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror
      - name: Install Linux ecosystem dependencies
        run: scripts/ci/setup-linux.sh ecosystem
      - name: Set up the Weston test compositor
        run: bash scripts/ci/setup-weston.sh
      # labwc 0.9+ is the only provisioned compositor that advertises
      # xdg-toplevel-icon-v1; setup-labwc.sh installs 0.9.7 from the
      # flake-locked nixpkgs revision (cache.nixos.org substitutes it, so no
      # wlroots build happens on the runner).
      - name: Set up Nix for the labwc test compositor
        uses: ./.github/actions/setup-nix
      - name: Set up the labwc test compositor
        run: bash scripts/ci/setup-labwc.sh
      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-real-gui-tests
          # The archive passes run prebuilt binaries; only the two
          # feature-gated live compositor steps compile (the
          # neomacs-display-runtime test target), and that cold build is
          # cheaper than re-adding a cache whose entries were ~246 MiB each,
          # carried the SAME content hash as each other, and overflowed the
          # 10 GiB store until it evicted the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      - name: Prepare pinned GUI package fixtures
        run: bash scripts/ci/setup-gui-test-packages.sh

      # The standalone Native display contract workflow is disabled. Keep its
      # display-runtime scroll-input coverage in automatic CI by running it
      # from the same archive; native_display itself is already part of
      # package(neomacs-gui-tests).
      #
      # Two passes over the same archive.  The remaining serial pass holds
      # only tests whose assertions are measurements of a live compositor:
      # the input-to-presentation latency rows, the resize/presentation pixel
      # rows, the calibrated Wayland font raster rows, and the display-runtime
      # scroll-input units.  A sibling sharing the runner's cores invalidates
      # those budgets.
      #
      # native_menus and the live desktop-font suites are receipt-gated and
      # run in the bulk pass: menu input starts only after the primary
      # surface's first presentation (no fixed settle), and the desktop-font
      # stages wait for the observed GSettings change plus the native
      # presentation receipt, capped only by the 60 s process timeout.  They
      # no longer depend on a 20 s per-stage budget, so concurrency no longer
      # turns load into a failure.
      #
      # The two `continuous_120hz_` scenarios are NOT in this pass. They are
      # calibrated performance gates: native_scrolling/budget.rs judges the
      # scroll response budget against recorded software-renderer capacity and
      # deliberately fails on any host outside the recorded tiers. A shared
      # GitHub runner is not such a host -- the same AMD EPYC 9V74 model has
      # measured a 2.8 ms and a 4.0 ms llvmpipe median on different runs (the
      # Xeon 8370C runner measured 3.7 ms), so no frozen tier can hold. Run
      # them on a calibrated host instead:
      #
      #   NEOMACS_GUI_TEST_BACKEND=x11 NEOMACS_GUI_TEST_BINARY=target/release/neomacs \
      #     cargo nextest run -p neomacs-gui-tests -E 'test(continuous_120hz_)'
      #
      # Both scenarios passed there (2026-11-18, i9-14900K, llvmpipe median
      # 2.9-3.3 ms, tier SoftwareVulkanFast). The dispatch-only
      # scroll120-cohort workflow covers the same scenarios' analysis.
      - name: Run serialized input and presentation-budget scenarios
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E '(package(neomacs-gui-tests) and (test(~presents_while_command_is_stalled) or test(~presents_resolved_destination_while_command_is_stalled) or test(~presents_pixels_while_evaluator_is_stalled) or test(~have_confirmed_input_latency) or test(~resize_presentation::) or test(~wayland_font_raster::))) or (package(neomacs-display-runtime) and test(scroll_input))' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --test-threads 1 \
            --no-fail-fast

      - name: Run real GUI tests
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            --extract-overwrite \
            -E 'package(neomacs-gui-tests) and not (test(~continuous_120hz_) or test(~presents_while_command_is_stalled) or test(~presents_resolved_destination_while_command_is_stalled) or test(~presents_pixels_while_evaluator_is_stalled) or test(~have_confirmed_input_latency) or test(~resize_presentation::) or test(~wayland_font_raster::))' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --test-threads 4 \
            --no-fail-fast

      # Feature-gated live compositor tests are not in the hermetic workspace
      # archive (the archive builds with default features), so these two steps
      # build the display-runtime test target from source.  The non-vacuity
      # greps make a silently empty feature run fail instead of a green step
      # that ran zero tests.
      #
      # The menu scenarios drive real pointer and keyboard input through a
      # compositor and assert xdg_positioner constraint adjustment, which only
      # Weston 16 implements (13 and 14 return the requested geometry).  The
      # pinned Weston builds the pixman renderer only -- the runner has no EGL
      # screen -- so the renderer is pinned here as well rather than asking for
      # a GL module that the build deliberately omits.
      - name: Run live Wayland menu tests (Weston 16 headless)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          # This step compiles; the daemon-lifecycle source build sets the
          # same switch so a dev build cannot exhaust the runner's disk.
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          unset DISPLAY
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-menu"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          # The job sets CARGO_TERM_COLOR=always; the summary check below reads this
          # log, so nextest writes it without colour escapes.
          LOG="$RUNNER_TEMP/wayland-menu.log"
          weston --backend=headless-backend.so --renderer=pixman \
                 --socket=wayland-menu --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do [ -S "$XDG_RUNTIME_DIR/wayland-menu" ] && break; sleep 0.1; done
          test -S "$XDG_RUNTIME_DIR/wayland-menu"
          if ! WAYLAND_DISPLAY=wayland-menu \
               cargo nextest run -p neomacs-display-runtime \
                 --features wayland-live-tests --test-threads 1 --color never \
                 -E 'test(linux_wayland_native_menu_smoke) or test(linux_wayland_native_menu_tooltip_smoke) or test(linux_wayland_native_menu_replacement_stress) or test(linux_wayland_deferred_menu_replacement_stress)' \
                 >"$LOG" 2>&1; then
            cat "$LOG"; exit 1
          fi
          grep -Eq 'Summary \[[^]]*\] 4 tests run: 4 passed' "$LOG" || { cat "$LOG"; exit 1; }

      # Weston 16 does not implement xdg-toplevel-icon-v1; labwc 0.9.7 does,
      # and setup-labwc.sh provisions exactly that compositor.
      - name: Run live xdg-toplevel-icon test (labwc headless)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          # This step compiles; the daemon-lifecycle source build sets the
          # same switch so a dev build cannot exhaust the runner's disk.
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          unset DISPLAY
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-icon"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          LOG="$RUNNER_TEMP/wayland-icon.log"
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 \
            labwc >"$RUNNER_TEMP/labwc.log" 2>&1 &
          labwc_pid=$!
          trap 'kill "$labwc_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break; sleep 0.1; done
          test -S "$XDG_RUNTIME_DIR/wayland-0"
          if ! WAYLAND_DISPLAY=wayland-0 \
               cargo nextest run -p neomacs-display-runtime \
                 --features wayland-live-tests --test-threads 1 --color never \
                 -E 'test(private_wayland_compositor_accepts_native_toplevel_icon)' \
                 >"$LOG" 2>&1; then
            cat "$LOG"; exit 1
          fi
          grep -Eq 'Summary \[[^]]*\] 1 test run: 1 passed' "$LOG" || { cat "$LOG"; exit 1; }

      - name: Upload GUI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neomacs-gui-tests-linux-${{ github.run_id }}
          path: |
            target/neomacs-gui-tests
            tmp/neomacs-gui-tests
          if-no-files-found: ignore
          retention-days: 14

  # The default Linux production runtime omits `webview` (Cargo.toml's
  # production capabilities keep the WPE/WKWebView layer off by default), so
  # the two oversized-xwidget page-composition regressions have no xwidget
  # backend in the GUI job above and skip there by an explicit runtime probe.
  # This job is the place they RUN: it builds the same workspace from source
  # with `--features webview` inside the pinned Nix dev shell (the flake's
  # nix-wpe-webkit cache supplies WebKit WPE 2.52.x) and drives both tests
  # with NEOMACS_GUI_TEST_WEBVIEW=1, including the deterministic magenta WPE
  # pixel proof. Verified locally against a webview fresh-build: both pass
  # in ~4.05 s each (2026-11-18, WPE WebKit 2.52.3). The same WPE shell runs
  # `cargo nextest run -p neomacs-webview --features webview --lib`: the
  # Linux create/load/destroy regression is compiled only with that feature,
  # and the test sets G_DEBUG=fatal-criticals itself.
  neomacs-xwidget-webview-gui:
    name: xwidget webview page composition (linux x86_64, X11)
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'neomacs-xwidget-webview-gui') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_GUI_TEST_BACKEND: x11
      NEOMACS_GUI_TEST_BINARY: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_GUI_TEST_WEBVIEW: "1"
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror
      - name: Install Linux ecosystem dependencies
        run: scripts/ci/setup-linux.sh ecosystem
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-xwidget-webview-gui
          # Nix WPE shell. A shared key with the host release jobs restored
          # this PKG_CONFIG into their target and broke the packaged runtime.
          cache-shared-key: linux-x86_64-release-nix-wpe
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - name: Set up Nix for the pinned WPE WebKit toolchain
        uses: ./.github/actions/setup-nix
      - name: Build the webview runtime
        run: |
          nix develop --accept-flake-config --command bash -c "
            set -euo pipefail
            cd \"${GITHUB_WORKSPACE:-$PWD}\"
            CC=gcc CXX=g++ cargo xtask fresh-build --release --features webview
          "
      - name: Run the xwidget page-composition regression
        run: |
          nix develop --accept-flake-config --command bash -c "
            set -euo pipefail
            cd \"${GITHUB_WORKSPACE:-$PWD}\"
            cargo nextest run -p neomacs-gui-tests \
              -E 'test(~oversized_xwidget_) or test(~static_xwidget_)' \
              --no-fail-fast
          "
      - name: Run neomacs-webview lib tests with the webview feature
        if: ${{ !cancelled() }}
        run: |
          nix develop --accept-flake-config --command bash -c "
            set -euo pipefail
            cd \"${GITHUB_WORKSPACE:-$PWD}\"
            CC=gcc CXX=g++ cargo nextest run -p neomacs-webview --features webview --lib
          "

      # Failure-only. A green run keeps no screenshots. The directory holds
      # the linux-x11 stderr, stdout, json, and png from the GUI harness.
      - name: Upload xwidget GUI artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xwidget-webview-linux-x11-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/neomacs-gui-tests/linux-x11/
          if-no-files-found: warn
          retention-days: 3

  doom-install-compatibility:
    name: doom install compatibility (linux x86_64)
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all') && (needs.neomacs-test-runtime.result == 'success') }}
    needs: neomacs-test-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps
      - *download_test_runtime
      - *unpack_test_runtime

      - name: Install unmodified Doom with Neomacs
        run: ./scripts/test-doom-install.sh

  # A separate job rather than a second matrix arm, because the darwin side
  # shares nothing with Linux beyond the script itself. The shared Linux
  # artifact is linux-x86_64 by construction and a Linux binary cannot run on
  # darwin, and neomacs-macos-test-build's darwin runtime is an LTO-off
  # harness build, so this arm compiles the shipping-profile runtime it
  # tests. A matrix would also force it to `needs:
  # neomacs-test-runtime` -- waiting up to 150 minutes on a Linux artifact it
  # never reads, for no ordering benefit.
  doom-install-compatibility-macos:
    name: doom install compatibility (macos aarch64)
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'doom-install-compatibility-macos') }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      # Restore the macOS release cache neomacs-macos-test-build saves: same
      # workspace, release profile and target, both running fresh-build.
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: doom-install-macos
          # Restore-only.  neomacs-macos-test-build is the ONE saver of the
          # `macos-aarch64-release-ws` entry, so two jobs never race different
          # contents under the key.  This job builds the shipping profile (LTO
          # on), whose artifacts the saver's LTO-off build does not share; a
          # second saver would only let whichever job finished first decide
          # what the entry holds.
          cache-shared-key: macos-aarch64-release-ws
          cache-workspace-crates: "true"
          cache-save-if: "false"
          target: aarch64-apple-darwin

      - name: Build the runtime this job installs Doom into
        run: cargo xtask fresh-build --release

      - name: Install unmodified Doom with Neomacs
        run: ./scripts/test-doom-install.sh

  # Standalone Loom models are not workspace members: each has its own
  # Cargo.toml and Cargo.lock. Three live under tests/ (ctrace-slot-loom,
  # p74-cell-loom, pentry-keeper-loom); the rest live under crates/.
  # scripts/ci/run-loom-models.sh globs both homes, prints the list, and fails
  # closed if fewer than its floor are found. Push, pull_request and
  # workflow_dispatch run every crate once, at preemption bound 2, in one job.
  # The Sunday 05:17 UTC schedule is bound 3, one job per discovered crate:
  # one p1rv test took 2788s, so a shared 180-minute job cannot cover a
  # second crate of that size. Each Sunday job has a 360-minute timeout.
  loom-models:
    name: standalone loom models bound 2 (linux x86_64)
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'all' || github.event.inputs.job == 'loom-models') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      BOUND: "2"
    steps:
      - *checkout
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-loom-models-linux-x86_64
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - name: Run standalone loom models
        run: bash scripts/ci/run-loom-models.sh

  loom-models-discover:
    name: list standalone loom models
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      crates: ${{ steps.list.outputs.crates }}
    steps:
      - *checkout
      - id: list
        name: Discover loom crates
        run: |
          crates=$(bash scripts/ci/run-loom-models.sh --list)
          {
            echo "crates<<EOF"
            echo "$crates"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  loom-models-bound3:
    name: loom bound 3 ${{ matrix.crate }}
    needs: loom-models-discover
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.loom-models-discover.outputs.crates) }}
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      BOUND: "3"
    steps:
      - *checkout
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-loom-models-b3-${{ strategy.job-index }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - name: Run one loom model at bound 3
        run: bash scripts/ci/run-loom-models.sh --crate "${{ matrix.crate }}"

  # A red packaged runtime skips every job that needs it, and those jobs
  # never appear on the run page. This job names the gated suites that did
  # not run. !cancelled() still runs when a dependency failed or was
  # skipped, and it does not run after cancel-in-progress kills the run.
  # always() would mark every superseded run red. It fails on push, pull
  # request, and job=all when one of them was skipped or cancelled. A
  # single-job dispatch fails only for the suite that input names.
  # neomacs-display-tests is the gated suite that can be selected alone.
  # The weekly schedule excludes these suites with its own if, so a skip
  # there is not a dependency failure.
  suite-skip-summary:
    name: gated suite skip summary
    if: ${{ !cancelled() }}
    needs:
      - neovm-core-tests
      - neovm-oracle-tests
      - neomacs-tui-tests
      - neomacs-melpa-tests
      - neomacs-display-tests
      - neomacs-prefix-face-tui-parity
      - neomacs-gui-tests
      - doom-install-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a gated suite did not run
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_JOB: ${{ github.event.inputs.job }}
          R_CORE: ${{ needs.neovm-core-tests.result }}
          R_ORACLE: ${{ needs.neovm-oracle-tests.result }}
          R_TUI: ${{ needs.neomacs-tui-tests.result }}
          R_MELPA: ${{ needs.neomacs-melpa-tests.result }}
          R_DISPLAY: ${{ needs.neomacs-display-tests.result }}
          R_PREFIX: ${{ needs.neomacs-prefix-face-tui-parity.result }}
          R_GUI: ${{ needs.neomacs-gui-tests.result }}
          R_DOOM: ${{ needs.doom-install-compatibility.result }}
        run: |
          set -euo pipefail
          single_dispatch=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_JOB" != "all" ]; then
            single_dispatch=1
          fi
          missing=0
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Gated suite results"
              echo
              echo "| suite | result | expected |"
              echo "| --- | --- | --- |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          set -- \
            "neovm-core-tests ${R_CORE}" \
            "neovm-oracle-tests ${R_ORACLE}" \
            "neomacs-tui-tests ${R_TUI}" \
            "neomacs-melpa-tests ${R_MELPA}" \
            "neomacs-display-tests ${R_DISPLAY}" \
            "neomacs-prefix-face-tui-parity ${R_PREFIX}" \
            "neomacs-gui-tests ${R_GUI}" \
            "doom-install-compatibility ${R_DOOM}"
          for entry in "$@"; do
            name="${entry%% *}"
            result="${entry#* }"
            expected=yes
            if [ "$EVENT_NAME" = "schedule" ]; then
              expected=no
            elif [ "$single_dispatch" -eq 1 ] && [ "$DISPATCH_JOB" != "$name" ]; then
              expected=no
            fi
            echo "suite ${name}: result=${result} expected=${expected}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "| ${name} | ${result} | ${expected} |" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$expected" = "yes" ] && { [ "$result" = "skipped" ] || [ "$result" = "cancelled" ]; }; then
              echo "DID NOT RUN: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "gated suites did not run because a dependency failed"
            exit 1
          fi
          echo "every expected gated suite ran"
