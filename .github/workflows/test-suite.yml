name: test suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  neomacs-workspace-test-archive:
    name: workspace test archive (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Test files are merged into one binary per crate (see
      # docs/building.md), so this job links a few dozen executables instead
      # of one per test file. Linking still dominates: every binary statically
      # links neovm-core and Cranelift. mold links them faster than lld at the
      # same 4-core/16 GB budget, rustc and links share the runner's cores
      # (binaries carry no debuginfo, which keeps concurrent link RSS well
      # below 16 GB), and test code uses relaxed codegen-units — the
      # perf-critical neomacs runtime ships from the separate test-runtime
      # job, never from these harness binaries.
      # If this OOMs on a hosted runner, halve CARGO_BUILD_JOBS before
      # ever re-serializing the linker. Halved on 2026-10-25: with the merged
      # per-crate test binaries and mold, two consecutive runs (e314bf315b,
      # 7a2607a224) were killed (exit 143) during the final links, 13-19
      # minutes in, with no compiler error.
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &prepare_workspace_tmp
        name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR/nextest"
      - uses: ./.github/actions/install-build-deps
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # Test harnesses build with LTO off, codegen-units 16, and
          # mold; keep this dependency cache separate from the normal
          # release cache.
          cache-key: ci-workspace-archive-linux-x86_64
          cache-shared-key: linux-x86_64-archive-release
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      # The final test-binary links exhaust the runner's 16 GB of RAM: on
      # 88247db382 the resource sampler below showed MemAvailable falling from
      # 4 GB to 60 MB during the links while disk stayed at 106 GB free, and the
      # runner then shut down (exit 143) -- the same failure as e314bf315b,
      # 7a2607a224 and e3f23e2adb. Freeing the unused SDKs keeps disk headroom;
      # a 16 GB swap file absorbs the link peak so mold and two jobs stay.
      - name: Free runner disk and add swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /swapfile-archive
          sudo chmod 600 /swapfile-archive
          sudo mkswap /swapfile-archive
          sudo swapon /swapfile-archive
          df -h /
          free -m

      - name: Build and archive workspace tests
        # Build test binaries only for the packages the archive consumers run.
        # The excluded crates are dependencies, so their libraries are still
        # compiled; their own test harnesses are not linked into the archive.
        # A background sampler records available memory, swap and disk every
        # 30 s, so a runner shutdown during the links shows which one ran out.
        run: |
          ( while sleep 30; do
              echo "resources $(date -u +%T) mem_avail_kB=$(awk '/MemAvailable/ {print $2}' /proc/meminfo) swap_free_kB=$(awk '/SwapFree/ {print $2}' /proc/meminfo) disk_avail_kB=$(df --output=avail -k / | tail -1 | tr -d ' ')"
            done ) &
          cargo nextest archive \
            --release \
            --workspace \
            --exclude neomacs \
            --exclude neomacs-allocator \
            --exclude neomacs-diagnostics \
            --exclude neomacs-font-materializer \
            --exclude neomacs-infra \
            --exclude neomacs-parity-reference \
            --exclude neomacs-perf \
            --exclude neomacs-test-env \
            --exclude neomacs-test-fonts \
            --exclude neomacs-test-oracle \
            --exclude neomacs-terminfo \
            --exclude neomacs-video \
            --exclude neomacs-video-model \
            --exclude neomacs-webview \
            --exclude neovm-host-abi \
            --exclude neovm-worker \
            --exclude xtask \
            --archive-file neomacs-workspace-tests.tar.zst

      - name: Upload workspace test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neomacs-workspace-tests-nextest-archive-linux-x86_64
          path: neomacs-workspace-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

  neomacs-daemon-lifecycle:
    name: daemon lifecycle (linux, matching debug runtime)
    needs: gnu-emacs-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/daemon-lifecycle
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-daemon-lifecycle-linux
          cache-shared-key: linux-debug-daemon-lifecycle
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - name: Set up pinned GNU Emacs client for interoperability
        uses: ./.github/actions/setup-gnu-emacs
      - name: Require the installed GNU client
        run: |
          test -x /opt/gnu-emacs-oracle/bin/emacsclient
          /opt/gnu-emacs-oracle/bin/emacsclient --version
      - name: Run all lifecycle cases serially
        env:
          NEOMACS_GNU_EMACSCLIENT: /opt/gnu-emacs-oracle/bin/emacsclient
        run: cargo nextest run --locked -p neomacs --test daemon_lifecycle

  neomacs-melpa-direct-windows-tests:
    name: MELPA direct adapter Job Object contracts (windows x86_64)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - *checkout

      - name: Prepare workspace temp directory
        shell: pwsh
        run: |
          $taskTmp = Join-Path $env:GITHUB_WORKSPACE 'tmp'
          New-Item -ItemType Directory -Force -Path $taskTmp | Out-Null
          "TMPDIR=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$taskTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # Same workspace, dev profile, and native x86_64 target as the build
          # gate's windows-msvc-x86_64 check job.  Sharing its dependency
          # cache keeps one copy of that graph in the shared 10 GiB store
          # instead of two.
          cache-key: ci-windows-direct-adapter-x86_64
          cache-shared-key: windows-msvc-x86_64-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true

      - name: Run native Windows direct adapter contracts
        run: >-
          cargo nextest run
          -p neomacs-melpa-tests
          -E 'test(/direct_windows_/)'
          --success-output immediate
          --no-fail-fast

  neovm-core-tests:
    if: ${{ github.event_name != 'schedule' }}
    # The core shards spawn GNU directly in their parity tests, so they need
    # the pinned oracle. Depending on the warming job also means they restore
    # its cached build instead of compiling Emacs twenty times in parallel.
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: core

  # The Darwin arm of the same suite.  A separate job, not a matrix arm,
  # because it shares nothing with Linux beyond the test sources: the runtime
  # and test binaries are compiled on the Mac, and the oracle is a
  # window-system-less GNU built by the recipe's Darwin profile
  # (setup-gnu-emacs-macos).  It runs the neovm-core package and then the
  # host-hermetic oracle-parity families -- the org/divergence/file/process
  # selection of package neovm-oracle-tests whose expectations hold on both
  # hosts after the macOS-keyed fixes -- in Verify mode, so those
  # expectations are proven in CI and not only on a developer's Mac.  The
  # unfiltered package still carries Linux-keyed lib expectation families
  # (cus_start_platform, defvar_*, fontset, file acl, trigonometry, ...);
  # making those host-hermetic is a separate expectation project, and this
  # job states its boundary rather than skipping them silently.  The
  # selection is unsharded because a macOS runner has three cores; the job
  # keeps its 150-minute timeout and the measured wall time is recorded in
  # the commit that added the second suite.  The GNU build itself is warmed
  # by the separate `gnu-emacs-oracle-macos` job (below), so a cancelled test
  # job cannot lose it.
  neovm-core-tests-macos:
    name: neovm-core tests (macos aarch64)
    if: ${{ github.event_name != 'schedule' }}
    needs: [gnu-emacs-oracle-macos]
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      # Build the pinned GNU once per (mirror commit, recipe hash); the smoke
      # step inside fails the job if the cache produced the wrong oracle.
      - name: Set up the pinned GNU Emacs oracle
        id: oracle
        uses: ./.github/actions/setup-gnu-emacs-macos

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-neovm-core-tests-macos
          # The `-ws` generation marks the workspace-crate cache.  rust-cache's
          # key does NOT include `cache-workspace-crates` (only the shared key,
          # platform, toolchain and lock hash), and it skips saving when the
          # key is already up to date.  Without a new key, a pre-existing
          # `macos-aarch64-release` entry (saved without workspace crates)
          # would be restored and the improved save silently skipped.
          cache-shared-key: macos-aarch64-release-ws
          # fresh-build and the test targets recompile the workspace's own
          # crates on every commit, which is ~33 min of the job on a 3-core
          # runner.  The release-profile inputs are stable enough to cache
          # them; the Doom job restores/saves the same shared entry and
          # enables this too, so the two jobs never race different contents
          # under one key.
          cache-workspace-crates: "true"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
          target: aarch64-apple-darwin

      # The job is a file so a lane can run exactly this on a Mac:
      # scripts/ci/run-neovm-core-macos-job.sh.  It fails on a missing or
      # unpinned oracle, proves the nil-`text-quoting-style` locale cases
      # against it, and runs the suite with the attested resolver pointed at
      # the same binary.
      - name: Run the macOS neovm-core parity job
        run: |
          scripts/ci/run-neovm-core-macos-job.sh \
            "${{ steps.oracle.outputs.emacs }}" \
            "${{ steps.oracle.outputs.manifest }}" \
            "${{ steps.oracle.outputs.version }}" \
            "${{ steps.oracle.outputs.commit }}"

      # The host-hermetic oracle-parity families, on the Darwin runner
      # against the same attested GNU and the runtime `fresh-build` just
      # produced.  Verify mode runs the local GNU for every case and compares
      # it with the checked-in expectation, then requires Neomacs to match
      # that same live GNU: the live-comparison cases that Snapshot mode can
      # only check against a recorded value execute here, and a macOS-keyed
      # expectation is proven in CI rather than only on a lane's Mac.
      #
      # The -E selection is the set proven host-hermetic end to end on the
      # macmini (9652/9652 in Verify).  The rest of the package's lib
      # expectations are still GNU/Linux-keyed (cus_start_platform,
      # defvar_*, fontset, ...); running them here would be red for reasons a
      # workflow change cannot fix, so they stay on the Linux shards until
      # their families get the same macOS-keyed treatment.
      - name: Run the macOS oracle-parity families
        if: ${{ !cancelled() }}
        env:
          # The identity pins the canonical oracle environment gives GNU on
          # Linux.  GNU prefers $NAME over the passwd GECOS (src/editfns.c:
          # 128-134), and a macOS runner's account full name is exactly the
          # leak the org author expectations pin out.  Scoped to this step so
          # cargo and Homebrew keep the runner's own identity.
          NAME: ""
          USER: exec
          LOGNAME: exec
          HOSTNAME: oracle-host
          EMAIL: exec@oracle-host
          NEOVM_FORCE_ORACLE_PATH: ${{ steps.oracle.outputs.emacs }}
          NEOVM_ORACLE_MODE: verify
          NEOVM_BINARY_PATH: ${{ github.workspace }}/target/release/neomacs
          NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
          NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
          NEOVM_LIBFAKETIME_SO: ${{ steps.oracle.outputs.libfaketime }}
        run: >-
          cargo nextest run -p neovm-oracle-tests --test oracle --lib
          -E 'test(/org_mode/) | test(/orgexport_/) | test(~process_attributes) | test(/oracle_harness/) | test(/system_info/) | test(/user_env_load_locale_state/) | test(/misc_strict_edge_semantics/) | test(/case_428/) | test(/case_444/) | test(/file_name_runtime/) | test(/file_remote_tramp/) | test(/file_ops_deep/) | test(/float_operations_comprehensive/) | test(/member_alist_semantics/) | test(/jit_flonum_semantics/) | test(/conversion_format_semantics/) | test(/merge_ordered_lists_semantics/) | test(/oracle_command_line_max_length_is_derived_from_this_editors_stack_rlimit/) | test(/file::attributes_strict_edge_semantics/) | test(/load_history_semantics/) | test(/load_suffixes_semantics/) | test(/name_case_insensitive_strict_edge_semantics/) | test(/snarf_documentation_last_writer/) | test(/^trigonometry::/) | test(/^platform_host_semantics::/) | test(/^compare::case_table::/) | test(/^oracle_divergence::divergence::coding_process::/) | test(/^oracle_divergence_combo_complex::divergence_combo_complex::case_083::/) | test(/^oracle_combination::combination::signal_processing_advanced::/) | test(/^file::acl_strict_edge_semantics::/) | test(/^inotify_public_semantics::/) | test(/^oracle_divergence::divergence::process_async_extra_runtime::/) | test(/^oracle_divergence::divergence::unicode_normalization::/) | test(/^process::wait_semantics::/) | test(/^string::comparison_comprehensive::/)'
          --no-fail-fast

  # The compile-fail contracts build only with the `contract-fixtures`
  # feature because each runner compiles separate trybuild fixture crates,
  # which does not fit a nextest per-test watchdog; the default suites and the
  # shard matrix therefore never run them, so this standalone job is their
  # home. It needs the workspace checkout, not the nextest archive, and it
  # stays out of the shard matrix: this is gate-wt.sh's compile-contracts
  # step with plain cargo test.
  compile-contracts:
    name: compile contracts (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          # Same workspace, dev profile, and x86_64 target as the build gate's
          # check job: its dependency graph IS `linux-x86_64-dev`.  A private
          # key made a second ~1.6 GiB copy of it in the shared 10 GiB store
          # for a job that runs on every main push.
          cache-key: ci-compile-contracts-linux-x86_64
          cache-shared-key: linux-x86_64-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # trybuild always invokes `cargo --offline` on a scratch project that
      # copies this workspace's Cargo.lock and [patch.crates-io] table. The
      # eval-exec forks in that table (cosmic-text first) are git checkouts a
      # fresh runner does not have, so their sources must be fetched into
      # CARGO_HOME before any contract runner starts. This job uses the rustup
      # toolchain from rust-toolchain.toml, whose components are rustfmt,
      # clippy and llvm-tools -- no rust-src. That is the gate rule: a
      # toolchain with rust-src produces false trybuild diagnostic mismatches.
      - name: Fetch locked crates for trybuild's offline builds
        run: cargo fetch --locked

      # The runners are compiled only with the `contract-fixtures` feature
      # (41eaff923a moved them off #[ignore]). Without it the four test
      # targets build empty and `cargo test` reports 0 passed, so the job
      # also counts the runners that actually ran: p0s3 1, p1rv 3,
      # thread_safety 9 (its own, sole-owner, p2ht, pentry, nmjit N1,
      # three host-effect tests and intern-shared) and chartable_write 1,
      # plus one nested nmjit runner: 15 passed in the summary. Every runner lives in
      # these test targets: the job never builds the opt-level-2 lib unit-test
      # binary, and no runner hides in the `core` binary, which no contract
      # job builds with the feature.
      - name: Run the compile-fail contracts
        run: |
          set -o pipefail
          {
            # --no-fail-fast: one failing runner must not hide the others' goldens
            # (2026-10-29: a red p1rv runner hid 4 stale thread_safety goldens).
            env -u TRYBUILD cargo test -p neovm-core --features contract-fixtures --no-fail-fast \
              --test p0s3_contracts --test p1rv_contracts \
              --test thread_safety_contracts --test chartable_write_contracts
          } 2>&1 | tee "$RUNNER_TEMP/contracts.log"
          ran=$(grep -oE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/contracts.log" \
            | awk '{s += $4} END {print s + 0}')
          echo "compile-fail contract runners passed: $ran"
          test "$ran" -ge 15

  # The same contracts on the arm64 macOS toolchain. rustc on aarch64-apple-darwin
  # orders and caps its E0277/E0599 notes differently, so the suite keeps
  # arm64_macos overlays of the context and generic goldens. Until 2026-10-31 no
  # job compiled them: the Linux job cannot, and the macOS parity job builds
  # without `contract-fixtures`, so the overlays drifted for weeks (the Mac
  # bless rewrote 9 of them). This job is their gate.
  compile-contracts-macos:
    name: compile contracts (macos aarch64)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-compile-contracts-macos-aarch64
          cache-shared-key: macos-aarch64-dev
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          target: aarch64-apple-darwin

      - name: Fetch locked crates for trybuild's offline builds
        run: cargo fetch --locked

      - name: Run the compile-fail contracts
        run: |
          set -o pipefail
          {
            env -u TRYBUILD cargo test -p neovm-core --features contract-fixtures --no-fail-fast \
              --test p0s3_contracts --test p1rv_contracts \
              --test thread_safety_contracts --test chartable_write_contracts
          } 2>&1 | tee "$RUNNER_TEMP/contracts.log"
          ran=$(grep -oE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/contracts.log" \
            | awk '{s += $4} END {print s + 0}')
          echo "compile-fail contract runners passed: $ran"
          test "$ran" -ge 15

  gnu-emacs-oracle:
    name: GNU Emacs oracle (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout

      # Warm the per-commit cache of the pinned GNU reference once, while the
      # runtime and test archives build, so the tui shards and the MELPA and
      # GUI parity jobs each restore one cached build instead of compiling
      # Emacs twenty-odd times in parallel on a cache miss.
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror

      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs

  gnu-emacs-oracle-macos:
    name: GNU Emacs oracle (macos aarch64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - *checkout

      # Warm the cache entry once per (GNU commit, recipe profile, runner
      # image, recipe hash), from a job of its own: the build is attested and
      # saved before any test job starts, so a test job that is red or
      # restarted cannot lose it.  On a cache hit this job is a restore plus
      # the smoke check (seconds); on a miss it compiles the pinned GNU with
      # the Darwin recipe.  The measured miss time at the runner's 3-way
      # parallelism is recorded in the commit that added this job; the warm
      # budget is 60 minutes, well above it.  A push can still cancel this
      # whole run while that build is in flight, so
      # .github/workflows/macos-oracle-cache.yml warms the same entry from a
      # schedule or workflow_dispatch that push cancellations cannot
      # interrupt; this job only keeps one run self-sufficient while that
      # schedule is cold.
      - name: Set up GNU Emacs oracle (macOS)
        uses: ./.github/actions/setup-gnu-emacs-macos

  neomacs-test-runtime:
    name: Packaged Neomacs Runtime (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-shared-runtime-linux-x86_64
          cache-shared-key: linux-x86_64-release
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build fresh release runtime
        run: cargo xtask fresh-build --release

      - name: Smoke the pdump relocating fallback (NEOVM_PDUMP_NO_FIXED_MAP)
        run: |
          # The planned-base hit path skips relocation validation wholesale;
          # this keeps the delta-apply fallback (and its bounds checks) green
          # forever. A green lane on purpose — the standing-red display jobs
          # would hide a fallback regression.
          NEOVM_PDUMP_NO_FIXED_MAP=1 target/release/neomacs --batch -Q --eval '(kill-emacs 0)'

      - name: Run upstream GNU SQLite ERT suite
        run: >-
          target/release/neomacs
          --batch -Q
          -l test/src/sqlite-tests.el
          -f ert-run-tests-batch-and-exit

      - name: Run process output and timer fairness ERT suite
        run: >-
          target/release/neomacs
          --batch -Q
          -l test/neomacs/process-timer-fairness-test.el
          -f ert-run-tests-batch-and-exit

      - name: Run unchanged upstream GNU file-notify ERT suite
        env:
          REMOTE_TEMPORARY_FILE_DIRECTORY: /dev/null
        run: |
          mkdir -p "$PWD/target/file-notify-ert-tmp"
          TMPDIR="$PWD/target/file-notify-ert-tmp" \
            target/release/neomacs --batch -Q \
              -l test/lisp/filenotify-tests.el \
              -f ert-run-tests-batch-and-exit

      # The standing detector for the missing-GC-root class (DIVERGENCES.md
      # 161/162). This collector is precise, so a Lisp value that rides Rust
      # control flow is invisible to trace_roots unless it was rooted
      # deliberately -- and such a bug is invisible to an ordinary green suite:
      # the whole 38k-pin oracle suite was green on BOTH sides of 161's
      # use-after-free. NEOVM_GC_STRESS=1 collects at every allocation-bearing
      # safe point, which turns "sometimes" into "always".
      - name: GC-stress the shipped runtime
        run: cargo xtask gc-stress

      # Exercise install.sh end-to-end against a release-shaped tree built
      # from THIS commit (file:// download base), so the curl|bash path --
      # download, checksum, versioned install, symlink chain, runtime-root
      # resolution with no environment variables -- is proven before any
      # release publishes it.
      #
      # BOTH tarball shapes are staged, because install.sh has a branch for
      # each and a release that only exercises one of them ships the other
      # untested: the current layout, whose dump sits in the archlib
      # (libexec/neomacs/<version>/<triple>, GNU's archlibdir), and the
      # pre-0.0.16 layout, whose dump sits in bin/ -- which --tag still has to
      # be able to install.
      - name: Verify install.sh against a staged release tree
        run: |
          set -eux
          triple=x86_64-unknown-linux-gnu
          crate_version="$(
            awk '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0}
                 s && /^version[[:space:]]*=/{gsub(/^version[[:space:]]*=[[:space:]]*"/,"");gsub(/".*$/,"");print;exit}' \
              Cargo.toml
          )"
          archlib="libexec/neomacs/$crate_version/$triple"

          stage_release() {
            local version="$1" layout="$2"
            local stage_root="$TMPDIR/install-release-$layout"
            local staged="$stage_root/v$version"
            local pkg_parent="$stage_root/pkg"
            local pkg="$pkg_parent/neomacs-$version-$triple"
            rm -rf "$stage_root"
            mkdir -p "$staged" "$pkg/bin" "$pkg/share/neomacs"
            cp target/release/neomacs target/release/neomacsclient "$pkg/bin/"
            if [ "$layout" = archlib ]; then
              mkdir -p "$pkg/$archlib"
              cp target/release/neomacs.pdump "$pkg/$archlib/neomacs.pdump"
            else
              cp target/release/neomacs.pdump "$pkg/bin/neomacs.pdump"
            fi
            cp -r lisp etc "$pkg/share/neomacs/"
            tar czf "$staged/neomacs-$version-$triple.tar.gz" \
              -C "$pkg_parent" "neomacs-$version-$triple"
            ( cd "$staged" && sha256sum "neomacs-$version-$triple.tar.gz" > SHA256SUMS )
            local prefix="$stage_root/prefix"
            NEOMACS_DOWNLOAD_BASE="file://$stage_root" \
              sh install.sh --tag "v$version" --prefix "$prefix"
            test -x "$prefix/bin/neomacs"
            test "$(readlink "$prefix/share/neomacs/current")" = "versions/$version"
            test "$(readlink "$prefix/bin/neomacs")" = "../share/neomacs/current/bin/neomacs"
            local exe ver_dir
            exe="$(readlink -f "$prefix/bin/neomacs")"
            ver_dir="$(dirname "$(dirname "$exe")")"
            if [ "$layout" = archlib ]; then
              test -f "$ver_dir/$archlib/neomacs.pdump"
              test ! -f "$(dirname "$exe")/neomacs.pdump"
              # exec-directory is PATH_EXEC (GNU src/callproc.c:1961), so the
              # installed tree has to answer with its own archlib.
              env -u NEOMACS_RUNTIME_ROOT -u EMACSPATH \
                "$prefix/bin/neomacs" --batch \
                --eval "(princ exec-directory)" | grep -Fx "$ver_dir/$archlib/"
            else
              test -f "$(dirname "$exe")/neomacs.pdump"
            fi
            test -d "$ver_dir/share/neomacs/lisp"
            env -u NEOMACS_RUNTIME_ROOT \
              "$prefix/bin/neomacs" --batch --eval '(princ (emacs-version))'
          }

          stage_release citest archlib
          stage_release citestlegacy legacy

      - name: Package shared test runtime
        run: |
          test -x target/release/neomacs
          test -f target/release/neomacs.pdump
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el
          test -d etc/charsets
          tar czf neomacs-test-runtime-linux-x86_64.tar.gz \
            target/release/neomacs \
            target/release/neomacs.pdump \
            lisp \
            etc

      - name: Upload shared test runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neomacs-test-runtime-linux-x86_64
          path: neomacs-test-runtime-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  neovm-oracle-tests:
    if: ${{ github.event_name != 'schedule' }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: oracle

  neomacs-tui-tests:
    if: ${{ github.event_name != 'schedule' }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    uses: ./.github/workflows/nextest-shards.yml
    with:
      suite: tui

  neomacs-melpa-tests:
    # The batch entry expands to four identically named jobs, one per hash
    # partition (see the matrix comment); the matrix's `partition` value is
    # what identifies a shard in the UI.  Do not suffix this name: CI
    # watchers key per-job baselines on it (tmp/v10x/ci/ci-watch.sh), and a
    # renamed job would lose its baseline.
    name: MELPA ${{ matrix.suite }} compatibility and GNU parity (linux x86_64)
    if: ${{ github.event_name != 'schedule' }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Select by package and test name, never by binary id: the binary
          # layout is an implementation detail (see docs/building.md). The
          # interactive package-TUI corpus moved to neomacs-tui-tests in
          # commit c9a3c0ed81 and runs in the tui shards, so there is no
          # melpa_tui target here.
          #
          # The batch corpus is ~951 tests, and each one drives a real GNU
          # and a real Neomacs process; on a 4-vCPU runner it needs 18-28
          # minutes of wall time by itself, so job setup (5.6-8.5 minutes,
          # including the oracle restore/build) left no margin inside the
          # 30-minute timeout -- three consecutive runs were cancelled at
          # the timeout (run 40740145396 reached only 816/951 before being
          # killed at 30.5 minutes).  Partition the corpus across four
          # runners: nextest's hash partition is disjoint, exhaustive and
          # deterministic (a test always lands in the same shard), so every
          # shard finishes well inside the timeout and a failure is still
          # attributable to one shard.  The GUI corpus is a single short
          # job and runs whole.
          - suite: batch
            partition: "hash:1/4"
            filter: package(neomacs-melpa-test-support) or (package(neomacs-melpa-tests) and not test(~gui_parity_tests::))
          - suite: batch
            partition: "hash:2/4"
            filter: package(neomacs-melpa-test-support) or (package(neomacs-melpa-tests) and not test(~gui_parity_tests::))
          - suite: batch
            partition: "hash:3/4"
            filter: package(neomacs-melpa-test-support) or (package(neomacs-melpa-tests) and not test(~gui_parity_tests::))
          - suite: batch
            partition: "hash:4/4"
            filter: package(neomacs-melpa-test-support) or (package(neomacs-melpa-tests) and not test(~gui_parity_tests::))
          - suite: gui
            partition: "hash:1/1"
            filter: package(neomacs-melpa-tests) and test(~gui_parity_tests::)
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEXTEST_FILTER: ${{ matrix.filter }}
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
      NEOMACS_MELPA_ORACLE_EMACS: /opt/gnu-emacs-oracle/bin/emacs
      NEOMACS_GUI_TEST_BACKEND: x11
      NEOMACS_GUI_TEST_BINARY: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_GUI_TEST_GNU_EMACS: /opt/gnu-emacs-oracle/bin/emacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Restore pinned MELPA source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/melpa/source-package-cache
            target/melpa/source-build-tools
          # Content-addressed by pin revision and tool revision; the pin set
          # hash decides when to roll the key, and restore-keys keeps the
          # still-matching entries usable when one pin moves.
          key: melpa-source-packages-${{ hashFiles('crates/neomacs-infra/src/packages/melpa-package-lock.tsv') }}
          restore-keys: |
            melpa-source-packages-
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror
      - name: Install Linux ecosystem dependencies
        run: scripts/ci/setup-linux.sh ecosystem
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-melpa-${{ matrix.suite }}
          # Runs prebuilt binaries out of the downloaded nextest archive and
          # never invokes rustc, so a Cargo build cache here can never be read
          # back.  Measured: these entries were ~246 MiB each and carried the
          # SAME content hash as each other, in a 10 GiB store whose overflow
          # was evicting the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - &download_test_runtime
        name: Download shared test runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neomacs-test-runtime-linux-x86_64
          path: .

      - &unpack_test_runtime
        name: Unpack shared test runtime
        run: |
          tar xzf neomacs-test-runtime-linux-x86_64.tar.gz
          chmod +x target/release/neomacs
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el

      - &download_workspace_test_archive
        name: Download workspace test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neomacs-workspace-tests-nextest-archive-linux-x86_64
          path: .

      - name: Install Nix for exact MELPA test runtimes
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      # After the MELPA Nix install so the action reuses that Nix instead of
      # provisioning its own.
      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs

      - name: Run deterministic package ecosystem compatibility tests
        run: |
          # Every batch test drives a real GNU Emacs and a real Neomacs (and
          # whatever helpers the package needs) for up to a few minutes, so
          # nextest's default one-test-per-core scheduling oversubscribes a
          # 4-vCPU runner: the 2026-10-29 run lost corfu to a RestartProbe
          # timeout, apheleia to a 255 restart, and multi_term to a signal
          # race, while the same tests pass on a quiet host.  Two at a time
          # keeps each editor's processes scheduled; the observed shard wall
          # times (4-9.5 min at four threads) stay inside the 30-minute
          # timeout with the halved width.
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E "$NEXTEST_FILTER" \
            --partition "${{ matrix.partition }}" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --test-threads 2 \
            --success-output immediate \
            --no-fail-fast

  neomacs-display-tests:
    name: display stack tests (linux x86_64)
    if: ${{ github.event_name != 'schedule' }}
    # The layout-engine tests bootstrap GNU Lisp through neovm-core, which
    # reads the workspace's lisp/ tree.  The checkout has the tracked sources
    # but not the generated ones (lisp/international/charscript.el,
    # charprop.el) -- those come from `cargo xtask fresh-build --release` in
    # the shared-runtime job, exactly as they do for every nextest shard.
    # Without this artifact 24 display tests die in bootstrap with a
    # `file-missing` signal.
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_BINARY_PATH: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
      NEXTEST_FILTER: "package(neomacs-display-protocol)|package(neomacs-display-runtime)|package(neomacs-layout-engine)|package(neomacs-renderer-wgpu)"
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps
      # The font tests resolve their families through the system fontconfig;
      # the build profile installs no fonts, so 18 CJK tests degraded to the
      # primary font's .notdef advance (8.428711 px for every CJK scalar).
      - name: Install display test fonts
        run: scripts/ci/setup-linux.sh fonts
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-display-tests
          # Runs prebuilt binaries out of the downloaded nextest archive and
          # never invokes rustc, so a Cargo build cache here can never be read
          # back.  Measured: these entries were ~246 MiB each and carried the
          # SAME content hash as each other, in a 10 GiB store whose overflow
          # was evicting the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      - name: Run display stack tests
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E "$NEXTEST_FILTER" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast

  neomacs-prefix-face-tui-parity:
    name: GNU prefix face TUI parity (linux x86_64)
    if: ${{ github.event_name != 'schedule' }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_TUI_NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror
      - name: Install GNU Emacs oracle dependencies
        run: scripts/ci/setup-linux.sh oracle
      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs
      - name: Set up test runner
        uses: ./.github/actions/setup-rust
        with:
          # This job executes the archived test binary against the shared
          # fresh-build runtime and never invokes rustc.
          cache: "false"
          cache-key: ci-prefix-face-tui-parity
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      - name: Compare buffer-remapped prefix faces with GNU Emacs
        env:
          # Record the cast for triage but do not pace the graded run; see
          # crates/neomacs-tui-tests/src/lib.rs ("CI records without pacing").
          NEOMACS_TUI_RECORD: on
          NEOMACS_TUI_RECORD_DELAY_MS: "0"
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E 'package(neomacs-tui-tests) and test(~line_and_wrap_prefix_named_face_remapping_match_gnu)' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast

      - name: Upload prefix-face TUI recordings
        if: always()
        uses: ./.github/actions/upload-tui-recordings
        with:
          artifact-name: neomacs-prefix-face-tui-recordings-${{ github.run_id }}

  neomacs-gui-tests:
    name: real GUI tests (linux x86_64, X11 + Wayland)
    if: ${{ github.event_name != 'schedule' }}
    needs: [neomacs-test-runtime, neomacs-workspace-test-archive, gnu-emacs-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_GUI_TEST_BACKEND: x11
      NEOMACS_GUI_TEST_BINARY: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_GUI_TEST_GNU_EMACS: /opt/gnu-emacs-oracle/bin/emacs
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - name: Configure fast APT mirror
        uses: ./.github/actions/configure-apt-mirror
      - name: Install Linux ecosystem dependencies
        run: scripts/ci/setup-linux.sh ecosystem
      - name: Set up the Weston test compositor
        run: bash scripts/ci/setup-weston.sh
      # labwc 0.9+ is the only provisioned compositor that advertises
      # xdg-toplevel-icon-v1; setup-labwc.sh installs 0.9.7 from the
      # flake-locked nixpkgs revision (cache.nixos.org substitutes it, so no
      # wlroots build happens on the runner).
      - name: Set up Nix for the labwc test compositor
        uses: ./.github/actions/setup-nix
      - name: Set up the labwc test compositor
        run: bash scripts/ci/setup-labwc.sh
      - name: Set up GNU Emacs oracle
        uses: ./.github/actions/setup-gnu-emacs
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-real-gui-tests
          # The archive passes run prebuilt binaries; only the two
          # feature-gated live compositor steps compile (the
          # neomacs-display-runtime test target), and that cold build is
          # cheaper than re-adding a cache whose entries were ~246 MiB each,
          # carried the SAME content hash as each other, and overflowed the
          # 10 GiB store until it evicted the release caches.
          cache: "false"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-nextest: true
      - *download_test_runtime
      - *unpack_test_runtime
      - *download_workspace_test_archive

      - name: Prepare pinned GUI package fixtures
        run: bash scripts/ci/setup-gui-test-packages.sh

      # The standalone Native display contract workflow is disabled. Keep its
      # display-runtime scroll-input coverage in automatic CI by running it
      # from the same archive; native_display itself is already part of
      # package(neomacs-gui-tests).
      #
      # Two passes over the same archive.  The native-menu scenarios drive
      # real pointer and keyboard input through a compositor and the
      # presentation-latency cases assert input-to-present budgets: both are
      # measurements of a live compositor, and a sibling test sharing the
      # runner's four cores invalidates them (input injected into a menu that
      # has not finished its first frame is dropped; a software rasterizer
      # competing with a dozen of its siblings misses the 120 Hz budget).
      # The live desktop-font stages have the same shape: they wait for the
      # GSettings change to reach the editor and fail the stage if it has not
      # arrived when the 20-second budget expires (measured at 22 s under
      # load ~40, d4d009ae90).  On 2026-10-29 four siblings on four cores
      # pushed every desktop_font_startup/updates stage, including GNU's own
      # `gnu_*` variants, to the deadline.  Run them, and the display
      # scroll-input units, one at a time, ahead of the bulk pass.
      - name: Run serialized input and presentation-budget scenarios
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            -E '(package(neomacs-gui-tests) and (test(~native_menus::) or test(~continuous_120hz_) or test(~presents_while_command_is_stalled) or test(~presents_resolved_destination_while_command_is_stalled) or test(~presents_pixels_while_evaluator_is_stalled) or test(~have_confirmed_input_latency) or test(~resize_presentation::) or test(~desktop_font_startup::) or test(~desktop_font_updates::))) or (package(neomacs-display-runtime) and test(scroll_input))' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --test-threads 1 \
            --no-fail-fast

      - name: Run real GUI tests
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run \
            --archive-file neomacs-workspace-tests.tar.zst \
            --extract-to "$TMPDIR/nextest" \
            --extract-overwrite \
            -E 'package(neomacs-gui-tests) and not (test(~native_menus::) or test(~continuous_120hz_) or test(~presents_while_command_is_stalled) or test(~presents_resolved_destination_while_command_is_stalled) or test(~presents_pixels_while_evaluator_is_stalled) or test(~have_confirmed_input_latency) or test(~resize_presentation::) or test(~desktop_font_startup::) or test(~desktop_font_updates::))' \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --test-threads 4 \
            --no-fail-fast

      # Feature-gated live compositor tests are not in the hermetic workspace
      # archive (the archive builds with default features), so these two steps
      # build the display-runtime test target from source.  The non-vacuity
      # greps make a silently empty feature run fail instead of a green step
      # that ran zero tests.
      #
      # The menu scenarios drive real pointer and keyboard input through a
      # compositor and assert xdg_positioner constraint adjustment, which only
      # Weston 16 implements (13 and 14 return the requested geometry).  The
      # pinned Weston builds the pixman renderer only -- the runner has no EGL
      # screen -- so the renderer is pinned here as well rather than asking for
      # a GL module that the build deliberately omits.
      - name: Run live Wayland menu tests (Weston 16 headless)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          # This step compiles; the daemon-lifecycle source build sets the
          # same switch so a dev build cannot exhaust the runner's disk.
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          unset DISPLAY
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-menu"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          LOG="$RUNNER_TEMP/wayland-menu.log"
          weston --backend=headless-backend.so --renderer=pixman \
                 --socket=wayland-menu --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do [ -S "$XDG_RUNTIME_DIR/wayland-menu" ] && break; sleep 0.1; done
          test -S "$XDG_RUNTIME_DIR/wayland-menu"
          if ! WAYLAND_DISPLAY=wayland-menu \
               cargo nextest run -p neomacs-display-runtime \
                 --features wayland-live-tests --test-threads 1 \
                 -E 'test(linux_wayland_native_menu_smoke) or test(linux_wayland_native_menu_tooltip_smoke) or test(linux_wayland_native_menu_replacement_stress) or test(linux_wayland_deferred_menu_replacement_stress)' \
                 >"$LOG" 2>&1; then
            cat "$LOG"; exit 1
          fi
          grep -Eq 'Summary \[[^]]*\] 4 tests run: 4 passed' "$LOG"

      # Weston 16 does not implement xdg-toplevel-icon-v1; labwc 0.9.7 does,
      # and setup-labwc.sh provisions exactly that compositor.
      - name: Run live xdg-toplevel-icon test (labwc headless)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          # This step compiles; the daemon-lifecycle source build sets the
          # same switch so a dev build cannot exhaust the runner's disk.
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          unset DISPLAY
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-icon"
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          LOG="$RUNNER_TEMP/wayland-icon.log"
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 \
            labwc >"$RUNNER_TEMP/labwc.log" 2>&1 &
          labwc_pid=$!
          trap 'kill "$labwc_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break; sleep 0.1; done
          test -S "$XDG_RUNTIME_DIR/wayland-0"
          if ! WAYLAND_DISPLAY=wayland-0 \
               cargo nextest run -p neomacs-display-runtime \
                 --features wayland-live-tests --test-threads 1 \
                 -E 'test(private_wayland_compositor_accepts_native_toplevel_icon)' \
                 >"$LOG" 2>&1; then
            cat "$LOG"; exit 1
          fi
          grep -Eq 'Summary \[[^]]*\] 1 test run: 1 passed' "$LOG"

      - name: Upload GUI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neomacs-gui-tests-linux-${{ github.run_id }}
          path: |
            target/neomacs-gui-tests
            tmp/neomacs-gui-tests
          if-no-files-found: ignore
          retention-days: 14

  doom-install-compatibility:
    name: doom install compatibility (linux x86_64)
    if: ${{ github.event_name != 'schedule' }}
    needs: neomacs-test-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps
      - *download_test_runtime
      - *unpack_test_runtime

      - name: Install unmodified Doom with Neomacs
        run: ./scripts/test-doom-install.sh

  # A separate job rather than a second matrix arm, because the darwin side
  # shares nothing with Linux beyond the script itself. There is no packaged
  # darwin runtime to restore: the shared artifact is linux-x86_64 by
  # construction and a Linux binary cannot run on darwin, so this arm compiles
  # what it tests. A matrix would also force it to `needs:
  # neomacs-test-runtime` -- waiting up to 150 minutes on a Linux artifact it
  # never reads, for no ordering benefit.
  doom-install-compatibility-macos:
    name: doom install compatibility (macos aarch64)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_BIN: ${{ github.workspace }}/target/release/neomacs
      NEOMACS_RUNTIME_ROOT: ${{ github.workspace }}
    steps:
      - *checkout
      - *prepare_workspace_tmp
      - uses: ./.github/actions/install-build-deps

      # Share the macOS release cache with the neovm-core macOS job: same
      # workspace, release profile and target, both running fresh-build.  Save
      # only on main so PRs do not write a multi-GB PR-scoped copy.
      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: doom-install-macos
          # Must match the neovm-core macOS job: both restore and save the ONE
          # `macos-aarch64-release-ws` entry, and whatever rust-cache saves
          # under this key must include the workspace crates in both jobs or
          # the first saver would pin the shared entry to the slower shape.
          cache-shared-key: macos-aarch64-release-ws
          cache-workspace-crates: "true"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          target: aarch64-apple-darwin

      - name: Build the runtime this job installs Doom into
        run: cargo xtask fresh-build --release

      - name: Install unmodified Doom with Neomacs
        run: ./scripts/test-doom-install.sh
