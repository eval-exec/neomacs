name: nix smoke

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "crates/xtask/**"
      - ".github/actions/setup-nix/**"
      - ".github/workflows/nix-smoke.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "crates/xtask/**"
      - ".github/actions/setup-nix/**"
      - ".github/workflows/nix-smoke.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-eval:
    name: flake contract evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Evaluate every advertised flake contract
        run: >-
          nix flake check --all-systems --no-build --accept-flake-config
          --option allow-import-from-derivation false

  nix-smoke:
    name: installed package and Home Manager contracts
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Build and run installed-package contracts
        timeout-minutes: 120
        run: >-
          nix build --print-build-logs --accept-flake-config
          .#checks.x86_64-linux.installed-package-contract
          .#checks.x86_64-linux.minimal-installed-package-contract
          .#checks.x86_64-linux.home-manager-contract
