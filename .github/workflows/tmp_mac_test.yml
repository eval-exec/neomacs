name: tmp macOS fresh build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-build:
    name: cargo xtask fresh-build --release
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUST_LOG: info
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies (brew)
        run: brew install pkg-config

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-aarch64
          target: aarch64-apple-darwin

      - name: Run fresh build
        run: cargo xtask fresh-build --release

      - name: Dynamic module suffixes (#193)
        run: |
          set -euo pipefail
          # GNU on darwin: MODULES_SUFFIX=.dylib with MODULES_SECONDARY_SUFFIX=.so,
          # so `load' must both FIND and dlopen a module built as `NAME.so'
          # (emacs-libvterm writes exactly that). Assert the Lisp-visible
          # contract, then prove a `.so' is actually located through
          # `get-load-suffixes'. The Elisp goes through a quoted heredoc and
          # `-l': its backquote-quote apostrophes (`require', `locate-file')
          # would close a single-quoted `--eval' argument mid-script.
          script="$(mktemp)"
          cat >"$script" <<'ELISP'
            (let* ((dir (make-temp-file "neomacs-module-suffix" t))
                   (built (expand-file-name "fake-module.so" dir)))
              (with-temp-file built (insert "not a real module"))
              (princ (format "module-file-suffix=%S\nload-suffixes=%S\ndynamic-library-suffixes=%S\nlocated=%S\n"
                             module-file-suffix load-suffixes dynamic-library-suffixes
                             (locate-file "fake-module" (list dir) (get-load-suffixes))))
              (unless (equal module-file-suffix ".dylib")
                (error "module-file-suffix should be .dylib on darwin"))
              (unless (equal load-suffixes (list ".so" ".dylib" ".elc" ".el"))
                (error "load-suffixes should carry the secondary .so first"))
              (unless (equal dynamic-library-suffixes (list ".dylib" ".so"))
                (error "dynamic-library-suffixes should list both suffixes"))
              (unless (equal (locate-file "fake-module" (list dir) (get-load-suffixes)) built)
                (error "a module built as .so must be found on darwin"))
              ;; The call the reporter actually makes (neomacs#193): `require`
              ;; searches its own suffix list, so assert THAT, not just
              ;; `locate-file`. A real module cannot be dlopened here, so failing
              ;; to LOAD is fine -- failing to FIND it is the bug.
              (add-to-list (quote load-path) dir)
              (let ((found nil))
                (condition-case err (require (quote fake-module) nil t)
                  (error (setq found t)))
                (princ (format "require-reached-the-file=%S\n" found))
                (unless found
                  (error "`require' must find a module built as NAME.so on darwin"))))
          ELISP
          ./target/release/neomacs -Q --batch -l "$script"

      - name: GUI smoke (launch, frame snapshot, PNG readback)
        run: |
          set -x
          mkdir -p gui-artifacts
          export NEOMACS_GUI_FRAME_SNAPSHOT_JSON="$PWD/gui-artifacts/snapshot.json"
          export NEOMACS_GUI_FRAME_SNAPSHOT_TXT="$PWD/gui-artifacts/snapshot.txt"
          export NEOMACS_GUI_STATE_JSON="$PWD/gui-artifacts/gui-state.json"
          export NEOMACS_DEBUG_FIRST_FRAME_READBACK=1
          export NEOMACS_DEBUG_SURFACE_READBACK=1
          export NEOMACS_DEBUG_SURFACE_READBACK_PNG="$PWD/gui-artifacts/frame.png"
          export RUST_BACKTRACE=1
          # The fixture self-terminates after ~2s (run-at-time kill-emacs);
          # background + watchdog guards against a wgpu-init hang.
          ./target/release/neomacs -Q -l crates/neomacs-gui-tests/fixtures/startup-smoke.el \
            > gui-artifacts/neomacs.log 2>&1 &
          PID=$!
          for _ in $(seq 1 60); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done
          kill "$PID" 2>/dev/null || true
          echo "=== artifacts ==="; ls -la gui-artifacts/ || true
          echo "=== last of neomacs.log ==="; tail -60 gui-artifacts/neomacs.log || true
          if [ -s gui-artifacts/snapshot.json ]; then
            echo "SNAPSHOT OK ($(wc -c < gui-artifacts/snapshot.json) bytes)"
          else
            echo "NO FRAME SNAPSHOT PRODUCED — GUI did not render"; exit 1
          fi

      - name: Upload GUI smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-gui-smoke
          path: gui-artifacts/
          if-no-files-found: warn
