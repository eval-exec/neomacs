name: neomacs performance suite

on:
  workflow_dispatch:
    inputs:
      baseline_editor:
        description: Absolute path to the immutable GNU Emacs or Neomacs baseline
        required: true
        type: string
      cpu:
        description: Isolated logical CPU assigned to editor processes
        required: true
        default: "0"
        type: string
      governor:
        description: Required scaling governor for the selected CPU
        required: true
        default: performance
        type: string
      samples:
        description: Interleaved samples per editor and scenario
        required: true
        default: "9"
        type: string
      previous_suite:
        description: Optional path to the prior suite.json on the runner
        required: false
        type: string
  schedule:
    - cron: "23 4 * * 2"

concurrency:
  group: neomacs-perf-controlled-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  standard:
    name: Standard suite on controlled Linux host
    runs-on: [self-hosted, linux, x64, neomacs-perf]
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      PERF_BASELINE: ${{ inputs.baseline_editor || vars.NEOMACS_PERF_BASELINE_EDITOR }}
      PERF_CPU: ${{ inputs.cpu || vars.NEOMACS_PERF_CPU }}
      PERF_GOVERNOR: ${{ inputs.governor || vars.NEOMACS_PERF_GOVERNOR }}
      PERF_SAMPLES: ${{ inputs.samples || vars.NEOMACS_PERF_SAMPLES || '9' }}
      PERF_PREVIOUS_SUITE: ${{ inputs.previous_suite || vars.NEOMACS_PERF_PREVIOUS_SUITE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify controlled-runner contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PERF_BASELINE"
          test -x "$PERF_BASELINE"
          test -n "$PERF_CPU"
          test -n "$PERF_GOVERNOR"
          command -v perf
          command -v taskset
          command -v weston
          command -v Xwayland

      - name: Set up Rust tooling
        uses: ./.github/actions/setup-rust
        with:
          cache-key: neomacs-perf-controlled-linux-x86_64
          cache-shared-key: linux-x86_64-release
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build candidate
        run: cargo xtask fresh-build --release

      - name: Run startup counters and thresholded standard suite
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask perf compare startup \
            --baseline-editor "$PERF_BASELINE" \
            --candidate-editor target/release/neomacs \
            --samples "$PERF_SAMPLES" \
            --iterations 1 \
            --cpu "$PERF_CPU" \
            --require-governor "$PERF_GOVERNOR" \
            --hardware-counters \
            --counter-scope whole-process
          args=(
            standard
            --baseline-editor "$PERF_BASELINE"
            --candidate-editor target/release/neomacs
            --samples "$PERF_SAMPLES"
            --cpu "$PERF_CPU"
            --require-governor "$PERF_GOVERNOR"
            --hardware-counters
            --counter-scope edit-loop
          )
          if [ -n "$PERF_PREVIOUS_SUITE" ]; then
            args+=(--previous-suite "$PERF_PREVIOUS_SUITE")
          fi
          cargo xtask perf suite "${args[@]}"

      - name: Upload immutable performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neomacs-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/perf/
            tmp/perf-comparisons/
            tmp/perf-suites/
          if-no-files-found: warn
          retention-days: 90
