name: Dispatch-only 120 Hz scroll cohort

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scroll120-cohort-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: CI release runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p "$TMPDIR"
      - uses: ./.github/actions/install-build-deps
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-shared-runtime-linux-x86_64
          cache-shared-key: linux-x86_64-release
          cache-save-if: "false"
      # Same product recipe and runtime archive as test-suite.yml, without
      # that workflow's unrelated ERT/package-install probes.
      - name: Build fresh CI release runtime
        run: cargo xtask fresh-build --release
      - name: Package runtime
        run: |
          test -x target/release/neomacs
          test -f target/release/neomacs.pdump
          test -f lisp/international/charscript.el
          test -f lisp/international/charprop.el
          tar czf scroll120-runtime.tar.gz \
            target/release/neomacs target/release/neomacs.pdump lisp etc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scroll120-runtime
          path: scroll120-runtime.tar.gz
          if-no-files-found: error
          retention-days: 3

  harness:
    name: CI GUI nextest archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p "$TMPDIR"
      - uses: ./.github/actions/install-build-deps
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-workspace-archive-linux-x86_64
          cache-shared-key: linux-x86_64-archive-release
          cache-save-if: "false"
          install-nextest: true
      - name: Free runner disk and add swap (same archive build envelope)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /swapfile-archive
          sudo chmod 600 /swapfile-archive
          sudo mkswap /swapfile-archive
          sudo swapon /swapfile-archive
          df -h /
          free -m
      # The GUI target has the same archive codegen as the workspace archive;
      # building unrelated test executables buys no evidence for this cohort.
      - name: Archive GUI target
        run: >-
          cargo nextest archive --locked --release
          -p neomacs-gui-tests --test gui
          --archive-file scroll120-gui.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scroll120-gui
          path: scroll120-gui.tar.zst
          if-no-files-found: error
          retention-days: 3

  cohort:
    name: Five plain/rich pairs with stage attribution
    needs: [runtime, harness]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TMPDIR: ${{ github.workspace }}/tmp
      NEOMACS_GUI_TEST_BACKEND: x11
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: "4"
      NEOMACS_GUI_SWAY_RENDERER: pixman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p "$TMPDIR"
      - uses: ./.github/actions/configure-apt-mirror
      # Same ecosystem/font provisioning as the real-GUI job. These scenarios
      # launch their own headless Sway; Weston/labwc are not used by this path.
      - name: Install CI GUI ecosystem and perf
        run: |
          scripts/ci/setup-linux.sh ecosystem
          if ! sudo apt-get install -y --no-install-recommends \
            linux-tools-common linux-tools-generic binutils; then
            echo '::warning::Optional capture package provisioning failed; measurements will still run'
          fi
          # The hosted Azure kernel may not have a matching -tools package in APT.
          # Use the provisioned portable perf directly, as in the local capture.
          # Ubuntu's per-kernel perf entries are symlinks into linux-tools-<version>.
          mapfile -t perf_bins < <(find -L /usr/lib/linux-tools -type f -name perf | sort -V)
          printf 'Portable perf candidates (%s):\n' "${#perf_bins[@]}"
          printf '  %s\n' "${perf_bins[@]}"
          if [[ ${#perf_bins[@]} -eq 0 ]]; then
            echo '::warning::No portable perf found; capture errors will be recorded per measurement'
            if ! ls -la /usr/lib/linux-tools*; then
              echo 'No Linux tools directories installed'
            fi
            perf_bin=perf
          else
            perf_bin=${perf_bins[-1]}
          fi
          uname -r
          if ! "$perf_bin" version; then
            echo '::warning::perf version probe failed; measurements will still run'
          fi
          if ! sudo sysctl kernel.perf_event_paranoid=1; then
            echo '::warning::Could not set perf_event_paranoid; readiness will record actual access'
          fi
          if ! "$perf_bin" stat -e task-clock -- true; then
            echo '::warning::Optional perf stat probe failed; measurements will still run'
          fi
          # Shallow FP chains only; never copy/unwind 16 KiB user stacks per switch.
          if ! sudo sysctl kernel.perf_event_max_stack=16; then
            echo '::warning::Cannot cap scheduler callchain depth; captured cells will refuse capture'
          fi
          echo "SCROLL120_PERF=$perf_bin" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
          cache-key: ci-scroll120-cohort-runner
          install-nextest: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scroll120-runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scroll120-gui
      - name: Unpack frozen runtime and GUI archive
        run: |
          mkdir -p "$TMPDIR/nextest"
          tar xzf scroll120-runtime.tar.gz
          cargo nextest list --archive-file scroll120-gui.tar.zst \
            --extract-to "$TMPDIR/nextest" --workspace-remap "$GITHUB_WORKSPACE" \
            --message-format json > "$TMPDIR/scroll120-list.json"
          sha256sum scroll120-runtime.tar.gz scroll120-gui.tar.zst \
            target/release/neomacs target/release/neomacs.pdump > "$TMPDIR/scroll120-sha256.txt"
      - name: Capture exactly five plain/rich pairs (existing assertions)
        run: |
          python3 - <<'PY'
          import collections
          import contextlib
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import select
          import shutil
          import signal
          import statistics
          import struct
          import subprocess
          import time

          W = Path.cwd()
          O = W / 'tmp/scroll120-cohort'
          O.mkdir(exist_ok=False)
          B = W / 'target/release/neomacs'
          extracted = W / 'tmp/nextest'
          binaries = [p for p in extracted.rglob('gui-*')
                      if re.fullmatch(r'gui-[0-9a-f]+', p.name) and os.access(p, os.X_OK)]
          assert len(binaries) == 1, binaries
          H = binaries[0]
          PERF = os.environ.get('SCROLL120_PERF', 'perf')
          PLAN = [('plain', 1), ('rich', 1), ('rich', 2), ('plain', 2),
                  ('plain', 3), ('rich', 3), ('rich', 4), ('plain', 4),
                  ('plain', 5), ('rich', 5)]
          result = {
              'source': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'],
              'product_sha256': hashlib.sha256(B.read_bytes()).hexdigest(),
              'harness_sha256': hashlib.sha256(H.read_bytes()).hexdigest(),
              'affinity': sorted(os.sched_getaffinity(0)),
              'protocol': 'Exactly five alternating plain/rich pairs, no retries; existing assertions unchanged. '
                          'Editor-PID-tree scheduler capture with shallow frame-pointer callchains on pairs 2 and 4; '
                          'pairs 1, 3 and 5 have capture OFF; no CPU sampling or DWARF. '
                          'Existing presentation logs; diagnostic timings, not a renderer budget.',
              'cells': [],
          }

          def save():
              (O / 'result.json').write_text(json.dumps(result, indent=2) + '\n')


          def clock_pair():
              return {'wall_ns': time.time_ns(), 'monotonic_ns': time.monotonic_ns()}


          def median(values):
              return statistics.median(values) if values else None


          def descendant(pid, ancestor):
              while pid > 1:
                  if pid == ancestor:
                      return True
                  try:
                      # The comm field can contain spaces or parentheses.
                      pid = int(Path(f'/proc/{pid}/stat').read_text().rsplit(')', 1)[1].split()[1])
                  except (FileNotFoundError, ProcessLookupError, PermissionError):
                      return False
              return False


          HEADER = re.compile(r'^\s*(.*?)\s+(\d+)/(\d+)\s+(\d+)\.(\d+):\s+(.*)$')
          FRAME = re.compile(r'^\s*[a-f0-9]+\s+(.+?)\s+\(([^()]*)\)\s*$')


          def analyze(row, report, log_path, perf_path, scheduler, tids):
              samples = []
              switches = collections.defaultdict(list)
              names = {}
              current = None
              stream_context = perf_path.open() if perf_path.exists() else contextlib.nullcontext([])
              with stream_context as stream:
                  for line in stream:
                      match = HEADER.match(line)
                      if match:
                          if current is not None:
                              samples.append(current)
                              current = None
                          comm, pid, tid, sec, frac, event = match.groups()
                          tid = int(tid)
                          ns = int(sec) * 10**9 + int(frac.ljust(9, '0'))
                          names[tid] = comm
                          if event.startswith('cpu-clock:u:'):
                              current = {'comm': comm, 'pid': int(pid), 'tid': tid, 'time_ns': ns, 'stack': []}
                          elif event.startswith('PERF_RECORD_SWITCH'):
                              switches[tid].append((ns, ' IN' in event))
                      elif current is not None:
                          frame = FRAME.match(line)
                          if frame:
                              current['stack'].append(frame.groups())
                          elif not line.strip():
                              samples.append(current)
                              current = None
              if current is not None:
                  samples.append(current)
              # CPU data is system-wide: restrict sample ownership using the recorded process identity.
              samples = [s for s in samples if s['pid'] == row.get('editor_pid')]
              names = {tid: thread['comm'] for tid, thread in tids.items()}
              # PID-scoped context metadata covers IN/OUT without sampling unrelated tasks.
              # Tracepoint-only prev/next events are incomplete for a PID attachment.
              switches.clear()
              for event in scheduler:
                  names[event['tid']] = event['comm']
                  if event['payload'].startswith('capture:context_'):
                      tid = int(re.search(r'pid=(\d+)', event['payload'])[1])
                      switches[tid].append((event['time_ns'],
                                            event['payload'].startswith('capture:context_in:')))
              receipts = report['samples']
              def first(s):
                  return min(s[k] for k in ['projected_presented_ns', 'presented_ns']
                             if isinstance(s.get(k), int))
              lo = min(s['received_ns'] for s in receipts)
              hi = max(first(s) for s in receipts)
              active = [s for s in samples if lo <= s['time_ns'] <= hi]
              # Missing optional profiling does not discard the receipt/log stage measurement.
              def role(s):
                  name = names.get(s['tid'], s['comm'])
                  if name.startswith('llvmpipe'):
                      return 'llvmpipe'
                  if name == 'gpu-device':
                      return 'gpu-device'
                  if name.startswith('neomacs-evaluat'):
                      return 'evaluator'
                  if s['tid'] == row.get('editor_pid'):
                      return 'UI'
                  return 'other'
              def on_cpu(tid, start, end):
                  total = 0
                  on = None
                  for ns, inside in switches[tid]:
                      if ns > end:
                          break
                      if inside:
                          on = ns
                      elif on is not None:
                          total += max(0, min(ns, end) - max(on, start))
                          on = None
                  if on is not None:
                      total += max(0, end - max(on, start))
                  return total / 1e6
              offsets = [c['wall_ns'] - c['monotonic_ns']
                         for c in [row['clock_pair_start'], row['clock_pair_end']]]
              assert max(offsets) - min(offsets) < 1_000_000, 'Clock offset moved by >=1ms'
              offset = sum(offsets) // 2
              requests = {}
              confirmed = {}
              for line in log_path.read_text().splitlines():
                  if 'requested native presentation feedback' in line:
                      serial = int(re.search(r'serial: (\d+)', line)[1])
                      stamp = datetime.datetime.fromisoformat(line.split()[0].replace('Z', '+00:00'))
                      requests[serial] = int(stamp.timestamp()) * 10**9 + stamp.microsecond * 1000 - offset
                  elif 'native presentation confirmed' in line:
                      serial = int(re.search(r'serial: (\d+)', line)[1])
                      layout = int(re.search(r'layout: PresentationId\((\d+)\)', line)[1])
                      sec = int(re.search(r'seconds: (\d+)', line)[1])
                      ns = int(re.search(r'nanoseconds: (\d+)', line)[1])
                      confirmed[(layout, sec * 10**9 + ns)] = serial
              evaluator_tids = [tid for tid, name in names.items() if name.startswith('neomacs-evaluat')]
              timeline = []
              for s in sorted(receipts, key=lambda r: first(r) - r['received_ns'], reverse=True)[:24]:
                  start, end = s['received_ns'], first(s)
                  projected = s.get('projected_presented_ns') == end
                  serial = s['projected_submission'] if projected else confirmed.get((s['presentation'], end))
                  request = requests.get(serial)
                  assert request is not None, ('No matching submission', s)
                  timeline.append({
                      'input': s['input'], 'received_ns': start, 'first_presented_ns': end,
                      'first_projected': projected, 'submission': serial,
                      'response_ms': (end - start) / 1e6,
                      'receive_to_request_ms': (request - start) / 1e6,
                      'request_to_present_ms': (end - request) / 1e6,
                      'UI_on_cpu_ms': on_cpu(row['editor_pid'], start, end) if switches.get(row.get('editor_pid')) else None,
                      'evaluator_on_cpu_ms': sum(on_cpu(tid, start, end) for tid in evaluator_tids) if evaluator_tids and all(switches.get(t) for t in evaluator_tids) else None,
                      'sample_roles': dict(collections.Counter(role(x) for x in active
                                                               if start <= x['time_ns'] <= end)),
                  })
              thread_coverage = {}
              for tid, thread in tids.items():
                  thread_coverage[tid] = {'comm': thread['comm'],
                                          'samples': sum(s['tid'] == tid for s in active),
                                          'scheduler_transitions': len(switches[tid])}
              return {
                  'thread_coverage': thread_coverage,
                  'cpu_samples': len(active),
                  'sample_roles': dict(collections.Counter(role(s) for s in active)),
                  'sample_threads': dict(collections.Counter(s['comm'] for s in active)),
                  'GC_samples': sum(any(key in '\n'.join(f[0] for f in s['stack'])
                                       for key in ['gc_collect', 'gc_safe_point', 'gc_mark', 'gc_sweep'])
                                    for s in active),
                  'clock_offset_drift_ns': max(offsets) - min(offsets),
                  'worst_24': timeline,
                  'tail_medians': {key: median([r[key] for r in timeline if r[key] is not None]) for key in
                                   ['response_ms', 'receive_to_request_ms', 'request_to_present_ms',
                                    'UI_on_cpu_ms', 'evaluator_on_cpu_ms']},
              }


          def capture_error(row, component, error):
              row.setdefault('capture_errors', []).append({'component': component, 'error': repr(error)})
              row['capture_error'] = '; '.join(f"{e['component']}: {e['error']}" for e in row['capture_errors'])


          def has_measurement(row):
              return isinstance(row.get('report', {}).get('p95_response_ms'), (int, float))


          class CleanupFailure(RuntimeError):
              """Do not advance to another scenario when an owned process may still be alive."""


          class OwnedProcesses:
              def __init__(self):
                  self.handles = {}
                  self.roots = set()

              def __enter__(self):
                  return self

              def add(self, pid, ancestor):
                  if pid in self.handles:
                      if not select.select([self.handles[pid]], [], [], 0)[0]:
                          return
                      os.close(self.handles.pop(pid))
                  fd = os.pidfd_open(pid)
                  # Open the stable handle before checking ancestry. A ready pidfd means the
                  # checked /proc PID might already name a replacement; never adopt that handle.
                  if not descendant(pid, ancestor) or select.select([fd], [], [], 0)[0]:
                      os.close(fd)
                      raise ProcessLookupError('Descendant exited or changed before adoption')
                  self.handles[pid] = fd
                  if pid == ancestor:
                      self.roots.add(pid)

              def __exit__(self, *_):
                  try:
                      for root in self.roots:
                          if root not in self.handles or select.select([self.handles[root]], [], [], 0)[0]:
                              continue
                          for proc in Path('/proc').iterdir():
                              if proc.name.isdigit() and descendant(int(proc.name), root):
                                  try:
                                      self.add(int(proc.name), root)
                                  except ProcessLookupError:
                                      pass
                      remaining = {pid: fd for pid, fd in self.handles.items()
                                   if not select.select([fd], [], [], 0)[0]}
                      for sig in [signal.SIGTERM, signal.SIGKILL]:
                          for fd in remaining.values():
                              try:
                                  signal.pidfd_send_signal(fd, sig)
                              except ProcessLookupError:
                                  pass
                          deadline = time.monotonic() + 5
                          while remaining and time.monotonic() < deadline:
                              ready, _, _ = select.select(list(remaining.values()), [], [], .05)
                              remaining = {pid: fd for pid, fd in remaining.items() if fd not in ready}
                          if not remaining:
                              break
                      if remaining:
                          raise CleanupFailure(f'Owned descendants did not exit: {sorted(remaining)}')
                  finally:
                      for fd in self.handles.values():
                          os.close(fd)
                      self.handles.clear()


          class Recorder:
              """Own one bounded recorder and its readiness/cleanup resources."""
              def __init__(self, directory, name, events, editor_pid):
                  self.directory, self.name, self.events = directory, name, events
                  self.editor_pid = editor_pid
                  self.process = None
                  self.fds = []
                  self.log = None
                  self.exit = None
                  self.started_ns = None

              def __enter__(self):
                  try:
                      control, ack = [self.directory / f'{self.name}.{suffix}'
                                      for suffix in ['control', 'ack']]
                      for path in [control, ack]:
                          os.mkfifo(path)
                      self.fds = [os.open(path, os.O_RDWR | os.O_NONBLOCK) for path in [control, ack]]
                      self.log = (self.directory / f'{self.name}-record.out').open('w')
                      command = ['sudo', '-n', PERF, 'record', '--pid', str(self.editor_pid),
                                 '--clockid', 'mono', '--switch-events', '-m', '256K',
                                 '--call-graph', 'fp', '--user-callchains', '--delay=-1',
                                 '--control', f'fifo:{control},{ack}',
                                 '-o', str(self.directory / f'{self.name}.data'), *self.events]
                      self.log.write(json.dumps(command) + '\n')
                      self.log.flush()
                      self.process = subprocess.Popen(command, stdout=self.log,
                                                      stderr=subprocess.STDOUT, start_new_session=True)
                      os.write(self.fds[0], b'enable\n')
                      deadline = time.monotonic() + 15
                      reply = b''
                      while time.monotonic() < deadline:
                          if self.process.poll() is not None:
                              raise RuntimeError(f'{self.name} recorder exited before readiness: '
                                                 f'{self.process.returncode}')
                          ready, _, _ = select.select([self.fds[1]], [], [], .05)
                          if ready:
                              reply += os.read(self.fds[1], 1024)
                              if b'ack\n' in reply:
                                  self.started_ns = time.monotonic_ns()
                                  self.log.write(f'enabled_ack_monotonic_ns={self.started_ns}\n')
                                  self.log.flush()
                                  return self
                      raise TimeoutError(f'{self.name} recorder did not acknowledge enable')
                  except BaseException:
                      self.__exit__(None, None, None)
                      raise

              def __exit__(self, *_):
                  try:
                      if self.process is not None:
                          if self.process.poll() is None:
                              # This session contains only our sudo/perf child, never another capture.
                              subprocess.run(['sudo', '-n', 'kill', '-INT', '--',
                                              f'-{self.process.pid}'], check=False)
                          try:
                              self.exit = self.process.wait(timeout=30)
                          except subprocess.TimeoutExpired:
                              subprocess.run(['sudo', '-n', 'kill', '-TERM', '--',
                                              f'-{self.process.pid}'], check=False)
                              try:
                                  self.exit = self.process.wait(timeout=10)
                              except subprocess.TimeoutExpired:
                                  subprocess.run(['sudo', '-n', 'kill', '-KILL', '--',
                                                  f'-{self.process.pid}'], check=False)
                                  try:
                                      self.exit = self.process.wait(timeout=10)
                                  except subprocess.TimeoutExpired as error:
                                      raise CleanupFailure('Recorder did not exit') from error
                  finally:
                      for fd in self.fds:
                          os.close(fd)
                      self.fds = []
                      if self.log is not None:
                          self.log.close()
                          self.log = None


          SCHED_EVENTS = ['-e', 'sched:sched_switch', '-e', 'sched:sched_wakeup',
                          '-e', 'sched:sched_wakeup_new', '-c', '1']
          DSO_PATHS = {str(B)}


          def decode(directory, name):
              fields = 'comm,pid,tid,time,event,ip,sym,dso'
              if name == 'sched':
                  fields += ',trace'
              with (directory / f'{name}-script.out').open('w') as log, \
                      (directory / f'{name}-decode.out').open('w') as errors:
                  subprocess.run(['sudo', '-n', PERF, 'script', '-i',
                                  str(directory / f'{name}.data'), '--ns', '--max-stack', '16',
                                  '--show-switch-events', '--show-task-events', '-F', fields],
                                 stdout=log, stderr=errors, check=True)
              # The typed binary record headers expose loss/throttle directly. Avoid the
              # auxiliary ASCII -D reader that failed on the hosted perf 7.0.14 tool.
              subprocess.run(['sudo', '-n', 'chmod', 'a+r', str(directory / f'{name}.data')], check=True)
              integrity = capture_integrity(directory / f'{name}.data')
              (directory / f'{name}-integrity.json').write_text(json.dumps(integrity, indent=2) + '\n')
              return integrity['flagged_records']


          def capture_integrity(path):
              """Validate the uncompressed x86_64 perf stream without the ASCII raw dumper."""
              counts = collections.Counter()
              flagged = []
              with path.open('rb') as stream:
                  header = stream.read(56)
                  assert len(header) == 56 and header[:8] == b'PERFILE2', 'Unsupported perf file header'
                  offset, size = struct.unpack_from('<QQ', header, 40)
                  end = offset + size
                  assert offset >= 56 and size > 0 and end <= path.stat().st_size, 'Truncated perf data region'
                  while offset < end:
                      stream.seek(offset)
                      record_type, misc, record_size = struct.unpack('<IHH', stream.read(8))
                      assert record_size >= 8 and offset + record_size <= end, 'Invalid perf record boundary'
                      # No -z is used by either recorder. Do not silently skip compressed samples.
                      assert record_type != 81, 'Unexpected PERF_RECORD_COMPRESSED'
                      counts[record_type] += 1
                      if record_type in [2, 5, 6, 13]:
                          # perf_event.h: LOST, THROTTLE, UNTHROTTLE, LOST_SAMPLES.
                          flagged.append({'offset': offset, 'type': record_type, 'misc': misc,
                                          'size': record_size,
                                          'payload_hex': stream.read(record_size - 8).hex()})
                      offset += record_size
              assert offset == end and counts[9] > 0, 'No complete PERF_RECORD_SAMPLE stream'
              return {'record_counts': dict(counts), 'flagged_records': flagged,
                      'data_bytes': size, 'data_end': end}


          def normalize_scheduler_payload(payload):
              """Canonicalize traceevent's printed form and explicit key/value fixtures once."""
              kind, body = payload.split(': ', 1)
              if kind not in ['sched:sched_switch', 'sched:sched_wakeup', 'sched:sched_wakeup_new']:
                  raise ValueError(f'Unexpected scheduler event: {kind}')
              if kind == 'sched:sched_switch':
                  if 'prev_pid=' in body:
                      prev = int(re.search(r'prev_pid=(\d+)', body)[1])
                      nxt = int(re.search(r'next_pid=(\d+)', body)[1])
                      state = re.search(r'prev_state=(\S+)', body)[1]
                  else:
                      match = re.fullmatch(r'.+:(\d+) \[\d+\] (\S+) ==> .+:(\d+) \[\d+\]', body)
                      if not match:
                          raise ValueError(f'Unrecognized sched_switch payload: {body}')
                      prev, state, nxt = match.groups()
                  return f'{kind}: prev_pid={prev} prev_state={state} next_pid={nxt}'
              if re.search(r'\bpid=\d+', body):
                  target = int(re.search(r'\bpid=(\d+)', body)[1])
              else:
                  match = re.fullmatch(r'.+:(\d+) \[\d+\](?: success=\d+)? CPU:\d+', body)
                  if not match:
                      raise ValueError(f'Unrecognized scheduler wakeup payload: {body}')
                  target = int(match[1])
              return f'{kind}: pid={target}'


          def scheduler_events(path):
              events, current = [], None
              for line in path.read_text().splitlines():
                  match = HEADER.match(line)
                  if match:
                      current = None
                      comm, pid, tid, sec, frac, event = match.groups()
                      if event.startswith('sched:'):
                          payload = normalize_scheduler_payload(event)
                      elif event.startswith('PERF_RECORD_SWITCH '):
                          direction = 'in' if event.split()[1] == 'IN' else 'out'
                          payload = f'capture:context_{direction}: pid={tid}'
                      else:
                          continue
                      current = {'comm': comm, 'pid': int(pid), 'tid': int(tid),
                                 'time_ns': int(sec) * 10**9 + int(frac.ljust(9, '0')),
                                 'printed_payload': event, 'payload': payload, 'stack': []}
                      events.append(current)
                  elif current is not None:
                      frame = FRAME.match(line)
                      if frame:
                          current['stack'].append(frame.groups())
              return events


          def inspect_capabilities():
              P = O / 'readiness'
              P.mkdir()
              status = {'perf_event_paranoid': Path('/proc/sys/kernel/perf_event_paranoid').read_text().strip(),
                        'stack_method': 'fp; kernel.perf_event_max_stack=16; no DWARF/CPU sampling',
                        'scheduler_mode': 'capture-unavailable'}
              with (P / 'tracefs.out').open('w') as log:
                  subprocess.run(['sudo', '-n', 'bash', '-c',
                                  'if ! test -r /sys/kernel/tracing/events/sched/sched_switch/id; then '
                                  'mount -t tracefs tracefs /sys/kernel/tracing; fi; '
                                  'cat /sys/kernel/tracing/events/sched/sched_{switch,wakeup,wakeup_new}/id; '
                                  'sysctl kernel.perf_event_max_stack'],
                                 stdout=log, stderr=subprocess.STDOUT, check=True)
              status['recorded_max_stack'] = int(Path('/proc/sys/kernel/perf_event_max_stack').read_text())
              assert status['recorded_max_stack'] <= 16, 'Refuse uncapped scheduler capture'
              probe = subprocess.Popen(['python3', '-c',
                                        'import time; [time.sleep(.01) for _ in range(500)]'])
              try:
                  with Recorder(P, 'sched', SCHED_EVENTS, probe.pid) as sched:
                      time.sleep(.2)
                  assert sched.exit in [0, 130, -2], sched.exit
                  loss = decode(P, 'sched')
                  events = scheduler_events(P / 'sched-script.out')
                  assert events and not loss, ('PID-scoped scheduler probe unusable', loss)
                  status.update(scheduler_mode='editor-pid-tree-fp',
                                context_events=sum(e['payload'].startswith('capture:context_') for e in events),
                                user_switch_chains=sum(any(dso.startswith('/') for _, dso in e['stack'])
                                                       for e in events))
              finally:
                  probe.terminate()
                  probe.wait(timeout=10)
              (O / 'capture-capabilities.json').write_text(json.dumps(status, indent=2) + '\n')
              print('Capture capabilities:', json.dumps(status), flush=True)
              return status


          def discover_editor(test_pid, row):
              # Only until the editor is found, before W100/input. No per-frame maps polling.
              for proc in Path('/proc').iterdir():
                  if not proc.name.isdigit() or not descendant(int(proc.name), test_pid):
                      continue
                  try:
                      argv = (proc / 'cmdline').read_bytes().split(b'\0')
                      if argv and argv[0] == os.fsencode(B):
                          row['editor_pid'] = int(proc.name)
                          return True
                  except (FileNotFoundError, ProcessLookupError, PermissionError):
                      pass
              return False


          def inventory(test_pid, row, output_directory, stream, owner):
              """Timestamp all owned descendant TIDs, not just the initial perf attach snapshot."""
              stamp = clock_pair()
              processes = []
              for proc in Path('/proc').iterdir():
                  if not proc.name.isdigit() or not descendant(int(proc.name), test_pid):
                      continue
                  try:
                      pid = int(proc.name)
                      owner.add(pid, test_pid)
                      argv = (proc / 'cmdline').read_bytes().split(b'\0')
                      if argv and argv[0] == os.fsencode(B):
                          if 'editor_pid' in row:
                              assert row['editor_pid'] == pid, 'Editor identity changed'
                          row['editor_pid'] = pid
                      threads = []
                      for task in (proc / 'task').iterdir():
                          try:
                              fields = (task / 'stat').read_text().rsplit(')', 1)[1].split()
                              threads.append({'tid': int(task.name), 'comm': (task / 'comm').read_text().strip(),
                                              'state': fields[0], 'utime_ticks': int(fields[11]),
                                              'stime_ticks': int(fields[12]), 'start_ticks': int(fields[19]),
                                              'processor': int(fields[36]), 'wchan': (task / 'wchan').read_text()})
                          except (FileNotFoundError, ProcessLookupError, PermissionError):
                              pass
                      maps = (proc / 'maps').read_text()
                      digest = hashlib.sha256(maps.encode()).hexdigest()[:16]
                      maps_file = output_directory / f'maps-{pid}-{digest}.out'
                      if not maps_file.exists():
                          maps_file.write_text(maps)
                      for line in maps.splitlines():
                          fields = line.split(None, 5)
                          if len(fields) == 6 and fields[5].startswith('/'):
                              DSO_PATHS.add(fields[5].removesuffix(' (deleted)'))
                      processes.append({'pid': pid, 'argv': os.fsdecode(b' '.join(argv)),
                                        'maps': maps_file.name, 'threads': threads})
                  except (FileNotFoundError, ProcessLookupError, PermissionError):
                      pass
              stream.write(json.dumps({'clock_pair': stamp, 'processes': processes,
                                       'finished_monotonic_ns': time.monotonic_ns()}) + '\n')
              stream.flush()


          def blocked_ui_intervals(row, events):
              ui = row['editor_pid']
              pending, spans = None, []
              for event in events:
                  payload, ns = event['payload'], event['time_ns']
                  if payload.startswith('capture:context_in:'):
                      target = int(re.search(r'pid=(\d+)', payload)[1])
                      if target == ui and pending is not None:
                          pending['resumed_ns'] = ns
                          pending['off_cpu_ms'] = (ns - pending['switched_out_ns']) / 1e6
                          spans.append(pending)
                          pending = None
                  elif payload.startswith('sched:sched_switch:'):
                      prev = int(re.search(r'prev_pid=(\d+)', payload)[1])
                      nxt = int(re.search(r'next_pid=(\d+)', payload)[1])
                      if nxt == ui and pending is not None:
                          pending['resumed_ns'] = ns
                          pending['off_cpu_ms'] = (ns - pending['switched_out_ns']) / 1e6
                          spans.append(pending)
                          pending = None
                      if prev == ui:
                          pending = {'switched_out_ns': ns,
                                     'prev_state': re.search(r'prev_state=(\S+)', payload)[1],
                                     'switch_out_stack': event['stack'], 'wakeup': None}
                  elif payload.startswith(('sched:sched_wakeup:', 'sched:sched_wakeup_new:')):
                      target = int(re.search(r'\bpid=(\d+)', payload)[1])
                      if target == ui and pending is not None and pending['wakeup'] is None:
                          pending['wakeup'] = {'time_ns': ns, 'waker_pid': event['pid'],
                                               'waker_tid': event['tid'], 'waker_comm': event['comm'],
                                               'payload': payload, 'stack': event['stack']}
              return spans


          def preserve_symbols():
              # Copy after timing; preserve exact loaded paths for offline --symfs symbolization.
              root = O / 'symfs'
              records = []
              for name in sorted(DSO_PATHS):
                  path = Path(name)
                  try:
                      with path.open('rb') as stream:
                          if stream.read(4) != b'\x7fELF':
                              continue
                      target = root / path.relative_to('/')
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(path, target)
                      records.append({'path': name, 'bytes': target.stat().st_size,
                                      'sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
                  except (FileNotFoundError, PermissionError, OSError) as error:
                      records.append({'path': name, 'error': repr(error)})
              (O / 'symbols.json').write_text(json.dumps(records, indent=2) + '\n')
              subprocess.run(['tar', 'czf', str(O / 'symbols.tar.gz'), '-C', str(root), '.'], check=True)
              shutil.rmtree(root)


          save()
          assert len(result['affinity']) == os.cpu_count() == 4, \
              'This protocol requires the complete four-logical-CPU CI runner'
          with (O / 'environment.out').open('w') as log:
              subprocess.run(['bash', '-c', 'uname -a; lscpu; free -m; "$SCROLL120_PERF" version; sway --version; '
                              'dpkg-query -W mesa-vulkan-drivers libllvm20 sway; '
                              'cat /proc/sys/kernel/perf_event_paranoid; env | sort'],
                             stdout=log, stderr=subprocess.STDOUT, check=True)
          try:
              capabilities = inspect_capabilities()
          except Exception as error:
              capabilities = {'scheduler_mode': 'capture-unavailable', 'capture_error': repr(error)}
          result['capture_capabilities'] = capabilities
          save()
          for scene, rep in PLAN:
              C = O / f'{scene}-{rep}'
              C.mkdir()
              target = C / 'artifacts'
              env = os.environ.copy()
              env.update(CARGO_TARGET_DIR=str(target), NEXTEST_WORKSPACE_ROOT=str(W),
                         NEOMACS_RUNTIME_ROOT=str(W), NEOMACS_GUI_TEST_BINARY=str(B),
                         LD_LIBRARY_PATH=str(extracted / 'target/nextest/libdirs/host'),
                         PERF_BUILDID_DIR=str(C / 'perf-buildid'),
                         NEOMACS_GUI_SCROLL_LOG='warn,neomacs_display_runtime::render_thread::bootstrap=info,'
                         'neomacs_display_runtime::presentation_feedback::wayland=debug,'
                         'neomacs_display_runtime::input_scroll=debug,'
                         'neomacs_display_runtime::render_thread::frame_stats=debug')
              for key in ['RUST_LOG', 'NEOMACS_GUI_SCROLL_TIMING_ONLY', 'NEOMACS_GUI_SCROLL_STREAM_INPUTS',
                          'WAYLAND_DEBUG', 'NEOMACS_LAYOUT_STATS_FILE']:
                  env.pop(key, None)
              capture_requested = rep in [2, 4]
              row = {'scene': scene, 'rep': rep, 'clock_pair_start': clock_pair(),
                     'capture': 'ON' if capture_requested else 'OFF', 'cpu_sampling': 'disabled',
                     'scheduler_mode': capabilities['scheduler_mode'] if capture_requested else 'control-off'}
              result['cells'].append(row)
              if capture_requested and 'capture_error' in capabilities:
                  capture_error(row, 'readiness', capabilities['capture_error'])
              test = None
              recorders = []
              disabled = set()
              try:
                  with contextlib.ExitStack() as cleanup, (C / 'test.out').open('w') as log:
                      threads = None
                      try:
                          threads = cleanup.enter_context((C / 'threads.jsonl').open('w'))
                      except Exception as error:
                          capture_error(row, 'inventory file', error)
                          disabled.add('inventory')
                      command = [str(H), '--exact',
                                 f'native_scrolling::continuous_120hz_scroll_in_large_{scene}_buffer',
                                 '--nocapture', '--test-threads', '1']
                      row['capture_enabled_ns'] = {r.name: r.started_ns for r in recorders}
                      row['test_spawn_monotonic_ns'] = time.monotonic_ns()
                      owner = cleanup.enter_context(OwnedProcesses())
                      # Always launch the unchanged harness directly. A tracer cannot own its lifetime.
                      test = subprocess.Popen(command, env=env, stdout=log,
                                              stderr=subprocess.STDOUT, start_new_session=True)
                      owner.add(test.pid, test.pid)
                      deadline = time.monotonic() + 180
                      while test.poll() is None:
                          if 'editor_pid' not in row and discover_editor(test.pid, row):
                              if 'inventory' not in disabled:
                                  try:
                                      inventory(test.pid, row, C, threads, owner)
                                  except Exception as error:
                                      capture_error(row, 'inventory snapshot', error)
                              if capture_requested and row['scheduler_mode'] == 'editor-pid-tree-fp':
                                  try:
                                      recorder = cleanup.enter_context(Recorder(C, 'sched', SCHED_EVENTS,
                                                                                row['editor_pid']))
                                      recorders.append(recorder)
                                      row['capture_enabled_ns']['sched'] = recorder.started_ns
                                  except Exception as error:
                                      capture_error(row, 'PID scheduler attach', error)
                          for recorder in recorders:
                              if recorder.process.poll() is not None and recorder.name not in disabled:
                                  capture_error(row, f'{recorder.name} recorder exited', recorder.process.returncode)
                                  disabled.add(recorder.name)
                          if time.monotonic() >= deadline:
                              raise TimeoutError('Scenario exceeded 180 seconds')
                          time.sleep(.1)
                      row['test_exit'] = test.wait()
                  row['capture_active'] = bool(recorders)
                  row['recorder_exits'] = {r.name: r.exit for r in recorders}
                  for name, code in row['recorder_exits'].items():
                      if code not in [0, 130, -2]:
                          capture_error(row, f'{name} finalization', code)
              except Exception as error:
                  # Measurement timeout/launch/cleanup failures are visible; try to retain any report.
                  if 'test_exit' in row:
                      capture_error(row, 'capture finalization', error)
                  else:
                      row['measurement_error'] = repr(error)
              finally:
                  row['clock_pair_end'] = clock_pair()
                  if test is not None:
                      try:
                          test.wait(timeout=10)
                      except subprocess.TimeoutExpired as error:
                          row['measurement_error'] = repr(error)
                  save()
              try:
                  reports = list(target.rglob('continuous-presentations.json'))
                  assert len(reports) == 1, ('No unique completed measurement report', reports)
                  report = json.loads(reports[0].read_text())
                  row['report'] = {key: value for key, value in report['report'].items()
                                   if not isinstance(value, list)}
                  row['adapter'] = report['editor_adapter']
                  row['compositor'] = report['sway_renderer_request']
                  if capture_requested:
                      enabled = row['capture_enabled_ns'].get('sched')
                      first_input = min(s['received_ns'] for s in report['samples'])
                      row['capture_before_first_input'] = enabled is not None and enabled < first_input
                      if not row['capture_before_first_input']:
                          capture_error(row, 'PID scheduler coverage', 'not enabled before first input')
                  assert 'type=Cpu, backend=Vulkan' in row['adapter'] and 'llvmpipe' in row['adapter'], row
                  assert row['compositor'].strip() == 'pixman', row
                  assert row['report']['received_receipts'] == 480 and row['report']['invalid_clocks'] == 0, row
              except Exception as error:
                  row['measurement_error'] = repr(error)
                  save()
                  print(scene, rep, 'NO MEASUREMENT', repr(error), flush=True)
                  continue
              decoded = set()
              for recorder in recorders:
                  try:
                      loss = decode(C, recorder.name)
                      row.setdefault('loss_or_throttle_records', {})[recorder.name] = loss
                      if loss:
                          capture_error(row, f'{recorder.name} integrity', loss)
                      else:
                          decoded.add(recorder.name)
                  except Exception as error:
                      capture_error(row, f'{recorder.name} decode', error)
              events = []
              if 'sched' in decoded:
                  try:
                      events = scheduler_events(C / 'sched-script.out')
                      for event in events:
                          for _, dso in event['stack']:
                              if dso.startswith('/'):
                                  DSO_PATHS.add(dso)
                  except Exception as error:
                      capture_error(row, 'scheduler payloads', error)
              tids = {}
              try:
                  for line in (C / 'threads.jsonl').read_text().splitlines():
                      for proc in json.loads(line)['processes']:
                          if proc['pid'] == row.get('editor_pid'):
                              for thread in proc['threads']:
                                  tids[thread['tid']] = thread
                  (C / 'thread-identities.json').write_text(json.dumps(tids, indent=2) + '\n')
                  spans = blocked_ui_intervals(row, events) if 'editor_pid' in row else []
                  (C / 'ui-offcpu.json').write_text(json.dumps(spans, indent=2) + '\n')
                  owned_events = [event for event in events if any(int(tid) in tids for tid in
                                  re.findall(r'\b(?:prev_pid|next_pid|pid)=(\d+)', event['payload']))]
                  (C / 'editor-scheduler.json').write_text(json.dumps(owned_events, indent=2) + '\n')
                  row['longest_ui_waits'] = sorted(spans, key=lambda s: s['off_cpu_ms'], reverse=True)[:5]
                  row['ui_user_switch_out_chains'] = sum(any(dso.startswith('/') and '[kernel' not in dso
                                                             for _, dso in s['switch_out_stack']) for s in spans)
                  if row['scheduler_mode'] == 'editor-pid-tree-fp' and not row['ui_user_switch_out_chains']:
                      capture_error(row, 'UI switch-out user chains', 'none recovered')
              except Exception as error:
                  capture_error(row, 'scheduler attribution', error)
              try:
                  # Receipt/log timing is independent of CPU/scheduler capture availability.
                  analysis = analyze(row, report, reports[0].with_name('neomacs.log'),
                                     C / 'sched-script.out' if 'sched' in decoded else C / 'capture-off', events, tids)
                  (C / 'analysis.json').write_text(json.dumps(analysis, indent=2) + '\n')
                  row['analysis'] = analysis
              except Exception as error:
                  row['analysis_error'] = repr(error)
                  capture_error(row, 'stage attribution', error)
              if 'editor_pid' in row:
                  jit_map = Path(f"/tmp/perf-{row['editor_pid']}.map")
                  if jit_map.exists():
                      try:
                          shutil.copy2(jit_map, C / f"jit-perf-{row['editor_pid']}.map.out")
                      except Exception as error:
                          capture_error(row, 'JIT map copy', error)
              save()
              print(scene, rep, json.dumps(row['report']), row.get('capture_error', ''), flush=True)
          try:
              preserve_symbols()
          except Exception as error:
              result['symbol_capture_error'] = repr(error)
              save()

          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## Frozen 120 Hz cohort (3 control pairs, 2 PID-captured pairs; no retries)\n\n')
              summary.write(f"Source `{result['source']}`; product `{result['product_sha256']}`. "
                            'Native test exits/assertions are retained; missing capture never discards p95. '
                            'Stage medians are non-additive statistics. GNU comparison is not performed by this workflow.\n\n')
              for scene in ['plain', 'rich']:
                  baseline = {'plain': 26.116, 'rich': 50.285}[scene]
                  groups = {mode: [r.get('report', {}).get('p95_response_ms')
                                   for r in result['cells'] if r['scene'] == scene and r['capture'] == mode]
                            for mode in ['OFF', 'ON']}
                  summary.write(f"**{scene} capture OFF / ON p95s (ms):** {groups}; "
                                f"run-3 steady reference {baseline} ms.\n\n")
                  cells = [r for r in result['cells'] if r['scene'] == scene]
                  values = [r.get('report', {}).get('p95_response_ms') for r in cells]
                  summary.write(f'**{scene} five p95s (ms):** {values}\n\n')
                  summary.write('| Rep | Capture | Test exit | Response tail median | Receipt→request | Request→present | '
                                'UI CPU | Evaluator CPU | CPU sampling |\n'
                                '|---:|---|---:|---:|---:|---:|---:|---:|---|\n')
                  for r in cells:
                      a = r.get('analysis', {})
                      m = a.get('tail_medians', {})
                      values = [m.get(k) for k in ['response_ms', 'receive_to_request_ms',
                                 'request_to_present_ms', 'UI_on_cpu_ms', 'evaluator_on_cpu_ms']]
                      formatted = ['missing' if v is None else f'{v:.3f}' for v in values]
                      summary.write(f"| {r['rep']} | {r['capture']} | {r.get('test_exit', 'missing')} | " +
                                    ' | '.join(formatted) + ' | disabled |\n')
                      summary.write(f"\nCapture: {r['scheduler_mode']}; UI user switch-out chains: "
                                    f"{r.get('ui_user_switch_out_chains', 'unavailable')}.\n\n")
                      for wait in r.get('longest_ui_waits', []):
                          chain = [symbol for symbol, dso in wait['switch_out_stack'] if dso.startswith('/')]
                          summary.write(f"UI off-CPU {wait['off_cpu_ms']:.3f} ms; "
                                        f"state {wait['prev_state']}; user chain: " +
                                        ' → '.join(chain[:8]) + '\n\n')
                      for key in ['capture_error', 'analysis_error']:
                          if key in r:
                              summary.write(f"\n{scene}-{r['rep']} **{key}:** `{r[key]}`\n\n")
                  summary.write('\n')
          assert hashlib.sha256(B.read_bytes()).hexdigest() == result['product_sha256']
          assert len(result['cells']) == 10
          # Native test exits/assertions stay visible. This diagnostic step fails only for absent measurements.
          raise SystemExit(0 if len(result['cells']) == 10 and all(has_measurement(r)
                                   for r in result['cells']) else 1)
          PY
      - name: Upload receipts, timelines and PID scheduler captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scroll120-cohort-${{ github.run_id }}
          # Explicit regular files only: compositor sockets/locks are not ZIP entries.
          path: |
            tmp/scroll120-cohort/**/*.json
            tmp/scroll120-cohort/**/*.jsonl
            tmp/scroll120-cohort/**/*.out
            tmp/scroll120-cohort/**/*.log
            tmp/scroll120-cohort/**/*.data
            tmp/scroll120-cohort/symbols.tar.gz
            tmp/scroll120-cohort/**/stderr
            tmp/scroll120-cohort/**/stdout
            tmp/scroll120-sha256.txt
            tmp/scroll120-list.json
          if-no-files-found: error
          retention-days: 7
