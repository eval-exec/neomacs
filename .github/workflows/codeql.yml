name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The Actions extractor also analyzes Bash embedded in workflow `run:`
        # steps. CodeQL does not provide a standalone Bash language extractor.
        language:
          - rust
          - actions
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare workspace temp directory
        run: mkdir -p "$TMPDIR"

      # The runner image stopped shipping `zstd`, which the pinned bundle below
      # needs: `tar --zstd ...` dies with "zstd: Cannot exec: No such file or
      # directory" and every Analyze job fails in Initialize CodeQL before a
      # single line is analyzed.
      - name: Ensure zstd can unpack the CodeQL bundle
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          # CodeQL 2.26.4 regresses Rust analysis enough to terminate the hosted runner.
          # Remove this pin after https://github.com/github/codeql/issues/22463 is fixed.
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.3/codeql-bundle-linux64.tar.zst
          languages: ${{ matrix.language }}
          build-mode: none

      # Analysis and upload are separate steps so that a failed upload can be
      # retried without re-running the 15 min Rust analysis. Since
      # 2026-10-31 16:07Z every Rust upload on main has died with "We couldn't
      # respond to your request in time" (the code-scanning SARIF endpoint's
      # 60 s gateway timeout; the same upload took 11 s at 11:09Z and the
      # analysis itself completes normally). The retry cannot use the
      # upload-sarif action: the codeql-action allows one upload per job per
      # category and aborts the second ("only one run of the codeql/analyze or
      # codeql/upload-sarif actions is allowed per job per tool/category", seen
      # on 01cbf77c5b), so the attempts go through the CodeQL CLI the init
      # step installed. The SARIF already carries the category set by analyze.
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-sarif

      - name: Upload SARIF (up to three attempts)
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          SARIF: ${{ runner.temp }}/codeql-sarif/${{ matrix.language }}.sarif
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          ls -l "$(dirname "$SARIF")"
          printf 'sarif bytes=%s gzip=%s\n' "$(stat -c %s "$SARIF")" "$(gzip -c "$SARIF" | wc -c)"
          for attempt in 1 2 3; do
            if printf '%s' "$GH_TOKEN" | "$CODEQL" github upload-results \
                 --repository="$GITHUB_REPOSITORY" --ref="$GITHUB_REF" --commit="$GITHUB_SHA" \
                 --sarif="$SARIF" --github-auth-stdin; then
              echo "upload attempt $attempt succeeded"; exit 0
            fi
            echo "upload attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 120))
          done
          exit 1
