name: Label merge conflicts

on:
  push:
    branches: [main]
  # This event also runs for conflicting fork PRs and can update their labels.
  # No PR checkout or PR-controlled code runs in this workflow.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  # Reconcile if GitHub's mergeability calculation outlasts a run's retries.
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: merge-conflict-labels
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Reconcile conflict labels on open pull requests
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          dirtyLabel: merge-conflict
          retryAfter: '15'
          retryMax: '10'
