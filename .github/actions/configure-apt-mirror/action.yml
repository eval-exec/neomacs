name: Configure fast APT mirror
description: >-
  Speed-test Ubuntu mirrors and select a fast one before apt runs. GitHub's
  Ubuntu images put azure.archive.ubuntu.com first; it is occasionally
  throttled hard enough to turn a ~30 s dependency install into 14 minutes.
  Runs only on Linux; a failed probe leaves the configured mirror in place.

runs:
  using: 'composite'
  steps:
    - name: Configure fast APT mirror
      if: runner.os == 'Linux'
      uses: vegardit/fast-apt-mirror.sh@806c59276adfff2df420124ad5e4587f018c358a # 1.4.5
      with:
        # Fewer/shorter probes than the action defaults: the shard matrix runs
        # this in 60 jobs per CI run. A 512 KiB sample with a 2 s ceiling still
        # rejects the ~80 KiB/s mirror that caused the 14-minute install.
        healthchecks: "10"
        speedtests: "5"
        sample-size: "512"
        sample-time: "2"
