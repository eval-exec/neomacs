name: 'Set up GNU Emacs oracle'
description: >-
  Install the GNU Emacs that every GNU-vs-Neomacs comparison runs against:
  the parity reference pinned in parity-reference.toml, built from that exact
  emacs-mirror commit. Nothing else will do. The version string is NOT an
  identity -- two builds of 31.1 with different configure flags are different
  oracles -- so this compiles the pinned commit with the pinned configuration
  and then asserts that configuration at the smoke step.

  The window system is load-bearing, which is the failure this action was
  rewritten for. A TTY-only build (--without-x) lacks 107 window-system mouse
  bindings that the GTK3 reference has -- <header-line> <touchscreen-end>,
  <left-fringe> <wheel-down>, <left-margin> <mouse-4> and the rest. Those are
  long keys, so they push a describe-bindings block's max key end-column into
  a wider bucket in describe-map--align-section, and every row in that block
  is then padded one tab-width (8 columns) differently. That single difference
  accounted for 706 differing rows in one test, and all 20 tui shards were red
  on every run because of it.

  nix-emacs-ci publishes no pretests and purcell/setup-emacs ships a minimal
  no-window-system build, so the reference is compiled here from source and
  cached by commit; a dedicated test-suite.yml job warms that cache before the shards
  that spawn GNU start, and a cache hit costs one restore.

  The recipe itself -- source fetch, autogen, the configure line, make,
  install, and the pinned Tree-sitter runtime built into the prefix -- is
  scripts/ci/build-gnu-oracle.sh, and the assertions are
  scripts/ci/check-gnu-oracle.sh.  The local NixOS shell
  (nix/gnu-oracle-shell.nix) runs the same two files, so a local oracle is
  the CI oracle by construction; this action only wires them into CI and
  caches the result.

inputs:
  cache-version:
    description: >-
      Bump when the configure flags, dependency lists, or build script change.
      Comment and description edits must not invalidate the cached oracle.
    required: false
    default: "2"

runs:
  using: 'composite'
  steps:
    - name: Read the pinned GNU reference
      id: pin
      shell: bash
      run: |
        # The action names no version of its own: parity-reference.toml is
        # the single record of which GNU the parity numbers are about, and a
        # re-pin there (cargo run -p xtask -- pin-reference) moves CI with it.
        set -euo pipefail
        pin="$GITHUB_WORKSPACE/parity-reference.toml"
        version="$(sed -n 's/^emacs_version = "\(.*\)"$/\1/p' "$pin")"
        commit="$(sed -n 's/^mirror_commit = "\(.*\)"$/\1/p' "$pin")"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
          echo "parity-reference.toml does not pin emacs_version and mirror_commit" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        # actions/cache restores as the runner user, and /opt is root's.
        sudo mkdir -p /opt/gnu-emacs-oracle
        sudo chown "$(id -u):$(id -g)" /opt/gnu-emacs-oracle

    - name: Restore the cached oracle build
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/gnu-emacs-oracle
        # Keyed on the GNU commit and an explicit version. Bump cache-version
        # when the configure flags, dependency lists, or build script change;
        # do not invalidate the 60 MB entry for a comment edit.
        key: gnu-emacs-oracle-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.commit }}-v${{ inputs.cache-version }}

    - name: Install the oracle's runtime dependencies
      shell: bash
      run: |
        # Needed on a cache HIT too: the cached oracle links libgtk-3.so.0,
        # so a job that restores it without GTK present has an Emacs that
        # cannot start. The action owns this list rather than
        # scripts/ci/setup-linux.sh because three of its callers use the
        # `ecosystem` profile, which carries no GTK at all.
        #
        # The X/GTK development files are also load-bearing for the BUILD:
        # configure enables X11/GTK3 only when pkg-config finds them, and
        # without them it still SUCCEEDS -- producing a TTY-only Emacs, which
        # is a different oracle (107 window-system mouse bindings short, and
        # those long keys shift every describe-bindings block one tab-width
        # wider). The smoke step below asserts the features.
        set -euo pipefail
        sudo apt-get update
        # Tree-sitter is deliberately absent: build-gnu-oracle.sh builds the
        # pinned 0.26.11 runtime into the oracle prefix itself, configure
        # finds that .pc first, and the installed executable resolves
        # libtree-sitter through its prefix RUNPATH.  A system runtime would
        # be an older ABI (Ubuntu 24.04 ships 0.20, ABI 13) that rejects the
        # ABI-15 grammars, and check-gnu-oracle.sh fails if the oracle loads
        # one.
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev \
          libx11-dev libxpm-dev libxext-dev libxinerama-dev libxi-dev libxrandr-dev \
          libdbus-1-dev dbus-daemon \
          libgnutls28-dev libxml2-dev libgmp-dev libncurses-dev \
          libcairo2-dev libharfbuzz-dev libfreetype-dev libfontconfig-dev \
          libpng-dev libjpeg-dev libgif-dev libtiff-dev libwebp-dev \
          librsvg2-dev liblcms2-dev zlib1g-dev

    - name: Install the oracle's build-only dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Only a cache miss compiles GNU. These tools are not needed to RUN
        # the cached tree, so keep them off the hit path.
        set -euo pipefail
        # curl fetches the pinned Tree-sitter tarball; patchelf bakes the
        # prefix RUNPATH into the installed executables.
        sudo apt-get install -y --no-install-recommends \
          autoconf texinfo make gcc pkg-config git curl patchelf

    - name: Build GNU Emacs from the pinned commit
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        EMACS_COMMIT: ${{ steps.pin.outputs.commit }}
      run: |
        # The recipe -- source commit fetch, autogen, the configure line,
        # make, install -- lives in scripts/ci/build-gnu-oracle.sh.  The local
        # NixOS shell (nix/gnu-oracle-shell.nix) runs the same file, so a
        # local oracle is the CI oracle by construction and the configure
        # flags have exactly one definition.
        #
        # The cache key carries inputs.cache-version, not a hash of this file
        # or the script; bump cache-version when the recipe changes (the
        # input's description says so), so a comment edit does not throw away
        # the 60 MB cache.
        set -euo pipefail
        # Runtime libraries are installed above; the build tools were
        # installed by the miss-only step immediately before this one, so a
        # cache hit installs neither.
        EMACS_ORACLE_WORKDIR="$RUNNER_TEMP" \
          "$GITHUB_WORKSPACE/scripts/ci/build-gnu-oracle.sh" \
          "$EMACS_COMMIT" /opt/gnu-emacs-oracle

    - name: Put the oracle on PATH and prove it is the pinned build
      shell: bash
      env:
        EMACS_VERSION: ${{ steps.pin.outputs.version }}
        EMACS_COMMIT: ${{ steps.pin.outputs.commit }}
      run: |
        # A divergence is only meaningful against a known GNU *configuration*,
        # so this fails at the environment seam rather than inside an oracle
        # test.  The assertions are shared with the local NixOS build -- both
        # run scripts/ci/check-gnu-oracle.sh, so there is no second copy to
        # drift.  See that file for what each assertion catches.
        set -euo pipefail
        echo "/opt/gnu-emacs-oracle/bin" >> "$GITHUB_PATH"
        "$GITHUB_WORKSPACE/scripts/ci/check-gnu-oracle.sh" \
          /opt/gnu-emacs-oracle/bin/emacs \
          "$EMACS_VERSION" \
          /opt/gnu-emacs-oracle/share/gnu-emacs-oracle/build-manifest \
          "$EMACS_COMMIT"
