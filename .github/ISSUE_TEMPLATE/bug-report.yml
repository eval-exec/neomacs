name: Bug Report
description: Report a bug in neomacs
title: "[Bug]: "
labels:
  - bug
  # Every new report starts unread; a maintainer replaces this with the
  # `status:` that matches what triage found.
  # Quoted: a bare `status: needs-triage` in a sequence is a YAML mapping, not
  # the label name.
  - 'status: needs-triage'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug.

        Before submitting, please collect build/runtime diagnostics.

        1. Run the exact Neomacs executable that showed the bug with `--version`:
           ```bash
           neomacs --version
           ```
           If it is not on `PATH`, use its full path, for example
           `./target/release/neomacs --version`. Paste **every line** of the
           output into **Neomacs --version output** below.
        2. Reproduce with verbose logs:
           ```bash
           RUST_LOG=debug NEOMACS_LOG=info ./target/release/neomacs 2>&1 | tee neomacs-debug.log
           ```
        3. In **Extra context**, upload `neomacs-debug.log` (or paste key excerpts).

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What is wrong?
      placeholder: Describe the observed behavior.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact, minimal steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: false

  - type: textarea
    id: build_info
    attributes:
      label: Neomacs --version output
      description: Paste every line printed by the exact Neomacs executable that showed the bug.
      placeholder: Paste the complete output of `neomacs --version` here.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where the bug happens. A maintainer applies the matching `platform:` label.
      options:
        - Linux (X11)
        - Linux (Wayland)
        - Linux (terminal only, no window system)
        - macOS
        - Windows
        - Android
        - WebAssembly
        - Other (not listed above)
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Install source
      description: Where the executable you ran came from. Which build it is decides whether a fix is already in it.
      options:
        - Prebuilt release asset (downloaded from Releases)
        - Built from source (`cargo xtask fresh-build --release`)
        - Built from source, some other way
        - Distribution / package manager
        - Not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: |
        Add screenshots, videos, bisect results, related issues, and the DEBUG log collected above.
    validations:
      required: false
