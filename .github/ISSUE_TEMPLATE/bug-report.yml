name: Bug Report
description: Report a bug in neomacs
title: "[Bug]: "
labels:
  - bug
  # Every new report starts unread; a maintainer replaces this with the
  # `status:` that matches what triage found.
  # Quoted: a bare `status: needs-triage` in a sequence is a YAML mapping, not
  # the label name.
  - 'status: needs-triage'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug.

        Before submitting, please collect build/runtime diagnostics.

        1. Run the exact Neomacs executable that showed the bug with `--version`:
           ```bash
           neomacs --version
           ```
           If it is not on `PATH`, use its full path, for example
           `./target/release/neomacs --version`. Paste **every line** of the
           output into **Neomacs --version output** below.
        2. For **display, rendering, or cursor-position bugs**, launch with
           cursor-geometry telemetry enabled and capture a single debug bundle
           while the bug is visible:
           ```bash
           NEOMACS_DEBUG_DISPLAY_DUMP=neomacs-display-debug.json \
             RUST_LOG=warn,neomacs::cursor_geometry=debug \
             ./target/release/neomacs
           ```
           Then trigger either **Help -> Dump Display Debug State** (from the
           menu bar — captures immediately without activating the minibuffer) or
           `M-x neomacs-dump-display-state` to write `neomacs-display-debug.json`
           (contains the `neomacs::cursor_geometry` log, frame snapshot, and
           last-presented render state). You can also run `M-x neomacs-dump-display-state`
           in an already-running session to enable `neomacs::cursor_geometry`
           capture on the fly.
        3. To collect general runtime logs without Cranelift JIT noise, run:
           ```bash
           NEOMACS_LOG_FILE=neomacs-debug.log \
             RUST_LOG=info,cranelift_codegen=off,cranelift_frontend=off,cranelift_jit=off,regalloc2=off \
             ./target/release/neomacs
           ```
        4. In **Extra context**, upload `neomacs-display-debug.json` and/or
           `neomacs-debug.log` (or paste key excerpts).

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What is wrong?
      placeholder: Describe the observed behavior.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact, minimal steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: false

  - type: textarea
    id: build_info
    attributes:
      label: Neomacs --version output
      description: Paste every line printed by the exact Neomacs executable that showed the bug.
      placeholder: Paste the complete output of `neomacs --version` here.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where the bug happens. A maintainer applies the matching `platform:` label.
      options:
        - Linux (X11)
        - Linux (Wayland)
        - Linux (terminal only, no window system)
        - macOS
        - Windows
        - Android
        - WebAssembly
        - Other (not listed above)
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Install source
      description: Where the executable you ran came from. Which build it is decides whether a fix is already in it.
      options:
        - Prebuilt release asset (downloaded from Releases)
        - Built from source (`cargo xtask fresh-build --release`)
        - Built from source, some other way
        - Distribution / package manager
        - Not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: |
        Add screenshots, videos, bisect results, related issues, and the DEBUG log collected above.
    validations:
      required: false
