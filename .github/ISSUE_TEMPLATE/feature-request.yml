name: Feature Request
description: Suggest a new feature or improvement for neomacs
title: "[Feature]: "
labels:
  - enhancement
  # Same starting point as a bug report: unread until triaged.
  # Quoted: a bare `status: needs-triage` in a sequence is a YAML mapping, not
  # the label name.
  - 'status: needs-triage'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal.
        Please describe the user problem first, then your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem or limitation are you trying to solve?
      placeholder: Describe the pain point and who is affected.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should neomacs do?
      placeholder: Describe behavior, UX, and expected outcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other options did you evaluate?
      placeholder: Workarounds, rejected ideas, or tradeoffs.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How important is this? Who benefits?
      placeholder: Scope, priority, and any compatibility concerns.
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: If this only matters on some platforms, say which. A maintainer applies the matching `platform:` label.
      options:
        - Applies everywhere
        - Linux (X11)
        - Linux (Wayland)
        - Linux (terminal only, no window system)
        - macOS
        - Windows
        - Android
        - WebAssembly
        - Other (not listed above)
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Links, screenshots, mockups, references, related issues/PRs.
    validations:
      required: false
