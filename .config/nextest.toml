nextest-version = "0.9.137"
experimental = ["wrapper-scripts", "setup-scripts"]

# Memory-limited wrapper: each test process gets an 8GB virtual address space limit.
# Uses prlimit (RLIMIT_AS) so allocation failures produce a Rust abort with
# backtrace instead of a silent SIGKILL from cgroup OOM killer.
[scripts.wrapper.memory-limit]
command = 'prlimit --as=8589934592 --'

# Compile-contract drivers spawn compiler workers, not Lisp/VM test threads.
# Keep the same address-space bound without reserving 128MiB for each worker.
[scripts.wrapper.compiler-memory-limit]
command = 'env -u RUST_MIN_STACK prlimit --as=8589934592 --'

[scripts.setup.melpa-infra-preflight]
command = { command-line = "scripts/melpa-infra-preflight.sh", relative-to = "workspace-root" }
slow-timeout = { period = "60s", terminate-after = 1 }
capture-stdout = true
capture-stderr = true

[profile.default]
# The P11 thread soak (tests/core.rs -> thread_soak.rs, test `thread_soak::soak`) is a driver, not a
# unit test: it spawns the soak's staged editor binary on scenario rows inside a sandbox wrapper, pinned
# to a CPU set, and every one of those defaults (SOAK_BIN, SOAK_ROWS, SOAK_SANDBOX, SOAK_CPUS) names
# the soak machine's own untracked paths. It is run on purpose with --ignore-default-filter (see the
# module docs), never by a default `cargo nextest run`. The filter below belongs here: the
# [[profile.default.scripts]] filter further down only chooses which tests get the memory-limit
# wrapper and does not exclude anything from the run, which is how the soak ran in CI core shard 06
# and the macOS core job on 2026-11-01 and failed at once with "sandbox wrapper missing at
# tmp/v10x/sandbox-run.sh (SOAK_SANDBOX)".
default-filter = 'not (package(neovm-core) and test(=thread_soak::soak))'
test-threads = 24

# Many tests use the bootstrap evaluator (which loads 122 .el files)
# even without "bootstrap" in their name. On a clean tree, the first
# bootstrap-heavy test may legitimately create the shared pdump cache,
# mirroring GNU's bootstrap-emacs/bootstrap-emacs.pdmp build step. That cold
# path can exceed 300s in debug builds, so keep the watchdog above the cold
# bootstrap time while still catching real hangs.
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "0s" }

# Apply memory limit to all tests EXCEPT the real GUI smoke and child-frame
# animation cases: those spawn a full GUI neomacs (wgpu + Vulkan software
# rasterizer), and llvmpipe's virtual address-space reservations depend on the
# ambient driver closure (nextest's LD_LIBRARY_PATH can select a mesa whose
# per-thread VA reservations blow an 8GB RLIMIT_AS, failing pthread_create
# with EAGAIN). The guardrail exists for unit-test allocation backtraces,
# not for constraining a spawned production GUI stack. Both files are now
# modules of the gui binary, so match their module prefixes instead of the
# former per-file binary IDs.
#
# The thread soak is the same case one level deeper: it drives a spawned
# production editor with up to 300 Lisp threads, and their stacks are virtual
# address-space reservations. Under the 8GB RLIMIT_AS the editor's baseline VA
# plus 300 thread stacks crosses the cap and pthread_create fails with EAGAIN
# (measured: RLIMIT_AS 8589934592, RLIMIT_NPROC 384632, child RSS ~7MB, cgroup
# max/oom events 0 — P11 soak finding). The editor also needs the real
# environment a shipped editor has, so the soak runs outside this guardrail;
# its own per-scenario SANDBOX_MEM_GB budget bounds RSS instead.
[[profile.default.scripts]]
filter = 'not test(/compile_contracts$/) and not (package(neomacs-gui-tests) and (test(~real_gui_smoke::) or test(~child_frame_animation::))) and not (package(neovm-core) and test(=thread_soak::soak))'
# `prlimit` is a Linux util-linux executable, not a generic Unix interface.
# macOS is cfg(unix) too, but has no `prlimit`; selecting by the actual host OS
# keeps hosted native tests executable instead of failing before test startup.
platform = { host = "cfg(target_os = \"linux\")" }
run-wrapper = 'memory-limit'

[[profile.default.scripts]]
filter = 'test(/compile_contracts$/)'
platform = { host = "cfg(target_os = \"linux\")" }
run-wrapper = 'compiler-memory-limit'

# Start both editor adapters once before package parity cases are dispatched.
# Harness contract tests use fake runtimes, and source-lock tests only parse
# embedded manifests, so both remain independent of a release Neomacs build.
[[profile.default.scripts]]
filter = 'package(neomacs-melpa-tests) and not (test(~parity_tests::harness_contract::) or test(~source_lock::tests::))'
platform = { host = "cfg(unix)" }
setup = 'melpa-infra-preflight'

# The interactive package-TUI suites (moved out of the MELPA jobs) provision
# pinned packages and boot editor pairs; give them the same preflight.
[[profile.default.scripts]]
filter = 'test(~package_tui::)'
platform = { host = "cfg(unix)" }
setup = 'melpa-infra-preflight'

# Minimax oracle cases intentionally evaluate game trees in both Neomacs
# and GNU Emacs.  The exhaustive tic-tac-toe forms can legitimately exceed
# the package-wide 60s watchdog during a full parallel run, so run this
# small test family without parallel CPU contention while keeping the
# per-test watchdog tight enough to catch real hangs.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and test(minimax)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1 }

# A few oracle families are legitimately heavy rather than hung: the
# ucs-normalize cases load the full Unicode normalization tables in BOTH
# Neomacs and GNU, and the exhaustive proptest comparisons run many forms per
# test. Individually they finish well within 120s; the tight 60s package
# watchdog only trips them through CPU contention in a fully parallel run. Give
# them the same 120s ceiling as minimax (matched first, so it wins over the
# general oracle override below). If one still exceeds 120s, that is a real
# performance regression to investigate, not a watchdog to widen further.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and (test(ucs_normalize) or test(oracle_prop_compare_mixed_int_float) or test(oracle_prop_consp_atom_listp))'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1 }

# The full regex sweep evaluates roughly 54k generated cases in 180 release
# Neomacs subprocesses. It is now part of the default suite, so isolate it from
# CPU contention and give it enough time to finish while retaining a bounded
# watchdog.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and test(regex_parity_proptest_full)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1 }

# The two expanded-cache replay tests each run TWO full partial bootstraps (the
# replay is the point: the second load must reproduce the first), source-loading
# 73 and 82 loadup files respectively with no compiled or pdumped shortcut.
# Measured on an otherwise idle machine: 134s (oclosure) and 144s (nadvice);
# 220s for the same nadvice test with other builds running. They are heavy, not
# hung, and the profile-wide 600s watchdog trips on them only under parallel
# build load.
#
# More than half of each run is one file: lisp/ldefs-boot.el costs 45-68s per
# bootstrap. That file is 1.6MB with 1369 non-ASCII bytes, so SCHARS != SBYTES
# and LispString's byte<->char conversion fast path is off; the loader then pays
# an O(n) scan from string start per top-level form, which is quadratic over the
# file. A profile of the nadvice test attributes ~48% of all cycles to
# `count_lead_bytes` under those conversions. Confirmed by scaling: an all-ASCII
# synthetic autoload file loads linearly (1000 to 8000 forms, 0.026s -> 0.121s
# release) while the same file with one non-ASCII char per form goes superlinear
# (0.034s -> 0.917s). Fixing that in the loader is an engine change, tracked
# separately -- it would speed up every bootstrap-heavy test, not just these two.
#
# Widen the watchdog for these two rather than reserving the whole machine with
# threads-required: the contention comes from processes outside nextest's
# control, and serializing two ~140s tests would add minutes of otherwise-idle
# time to every full run. 1200s keeps a bounded watchdog with room over the
# worst observed 220s. If one exceeds 1200s, that is a real regression.
[[profile.default.overrides]]
filter = 'package(neovm-core) and (test(expanded_cache_replay_preserves_nadvice_eval_and_compile_helpers) or test(expanded_cache_replay_preserves_oclosure_define_class_registration))'
slow-timeout = { period = "1200s", terminate-after = 1 }

# Each inlined_call_semantics test runs the full engine matrix: both GNU and
# Neomacs evaluate every ~40 env row, so one test is ~80 subprocess runs.
# Measured alone they take 17-23s; a fully parallel oracle run starves them
# past the 60s single-form watchdog (four of them timed out in a 12-thread run
# on a loaded machine, then all passed in isolation).  They are heavy, not
# hung: run them without parallel contention and keep the 120s ceiling of the
# other heavy oracle families.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and test(inlined_call_semantics::)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1 }

# A handful of subprocess probes are timing sensitive rather than divergent:
# `process_attributes_running_child` reads `process-running-child-p' while a
# 0.2s child is alive, `quit_process_sentinel_message' waits (a bounded
# `accept-process-output' budget) for a SIGQUIT sentinel to fire, and the
# process-filter/coding probes below read output a child writes immediately
# after start (`accept-process-output` returns as soon as any bytes arrive, so
# a starved run can observe a partial or empty buffer). A fully parallel run
# can steal enough scheduling latency to miss the window. Run them isolated
# (adequate latency), like the heavy families, rather than reshaping the
# probes (a longer-lived child would hold the process pipe open and block the
# eval).
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and (test(process_attributes_running_child) or test(quit_process_sentinel_message) or test(div_cx45_process_env_coding_narrow_output_filter_hash_mega) or test(div_cx428_process_filter_insert) or test(proc_decode_search_replace) or test(div_cx33_process_kill_query_off_then_kill_buffer) or test(div_core_divergence_surface_process_attributes_running_child_combo) or test(divergence_process_output_to_buffer))'
threads-required = "num-test-threads"

# The generative window-tree property replays whole operation SEQUENCES in both
# engines, so one "test" is hundreds of paired subprocess runs — the 60s
# single-form budget below does not apply. Listed first so it wins over the
# package-wide rule. Scale with NEOVM_WINDOW_PROP_CASES.
[[profile.default.overrides]]
filter = 'test(oracle_prop_window_tree_survives_random_operation_sequences)'
slow-timeout = { period = "1800s", terminate-after = 1 }

# Native grammar cases provision pinned repositories and compile shared
# libraries before running two editor probes. Match the cold package fixture
# budget, ahead of the snapshot-oracle timeout below.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and test(~treesit_grammar_loading::)'
slow-timeout = { period = "960s", terminate-after = 1 }

# Oracle tests compare neomacs against GNU Emacs — single-form hangs
# should be caught quickly instead of wasting 10 minutes.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests)'
slow-timeout = { period = "60s", terminate-after = 1 }

# Package ecosystem tests launch full editor subprocesses. Package-cache
# preparation uses a cross-process lock, so these tests can use the profile's
# normal parallel scheduling. The harness gives each editor its own timeout and
# phase-specific diagnostics; Nextest's watchdog remains wider so those
# diagnostics arrive first.
[[profile.default.overrides]]
filter = 'package(neomacs-melpa-tests)'
slow-timeout = { period = "960s", terminate-after = 1 }

# Native backend tests contain their own bounded event waits and must also
# prove that worker shutdown cannot deadlock after an assertion failure.
[[profile.default.overrides]]
filter = 'package(neovm-core) and test(native_runtime_test)'
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "0s" }

# These tests own the live desktop through one helper. Do not interleave them
# with other tests in this nextest invocation (including other GUI tests in the
# merged gui binary).
[[profile.default.overrides]]
filter = 'package(neomacs-gui-tests) and test(~macos_native_menus::)'
platform = { host = 'cfg(target_os = "macos")' }
threads-required = "num-test-threads"

# The interactive package-TUI suites pair a GNU Emacs and a Neomacs in PTYs and
# drive them by screen state, so every pair needs CPU to keep its own deadlines.
# At the default budget a family run starts all thirteen pairs at once, and pairs
# then miss those deadlines while waiting their turn: over three uncapped family
# runs, leuven's readiness marker and helm-gitignore's HTTP-failure screen each
# timed out once, while both pass alone, repeatedly.  Reserve four threads per
# test so a few pairs run at a time.  The suites are I/O-bound, so this costs no
# wall clock -- capped family runs took 59.6s and 61.4s against 60.7s and 64.0s
# uncapped, both 13/13.
[[profile.default.overrides]]
filter = 'test(~package_tui::)'
threads-required = 4

# Every daemon-lifecycle case is wall-clock sensitive: a readiness deadline,
# a startup-lock wait, or a reply budget measured against real daemon and
# client processes on the live socket/pty surface.  Run at the default budget
# the whole suite missed those deadlines at once -- 29 of 33 cases failed at a
# uniform 60s, all passing serially and in isolation on the same machine.  Run
# it one case at a time.  This costs one bootstrap, not one per case: the
# fixture provisions the shared runtime image itself (neomacs-infra), and
# every later case reuses it.
# The daemon lifecycle binary is the only neomacs-package test binary whose
# tests sit at the crate root; the merged integration binary and the lib put
# every test behind a module, so their names contain "::". Select the
# root-level cases without naming the binary, which is absent from the
# workspace test archive (that package's test harnesses are not consumed
# there) and would make a binary_id filter fail in shard invocations.
[[profile.default.overrides]]
filter = 'package(neomacs) and not test(~::)'
threads-required = "num-test-threads"

# Executable lookup failures use a minimal evaluator and local fixtures. No
# child should start; catch a blocked host lookup promptly, with the case name
# emitted through tracing rather than consuming the bootstrap-wide watchdog.
[[profile.default.overrides]]
filter = 'package(neovm-core) and test(=emacs_core::process::tests::call_process_program_resolution_errors_match_gnu_report_file_error)'
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "0s" }
