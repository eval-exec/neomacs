nextest-version = "0.9.137"
experimental = ["wrapper-scripts", "setup-scripts"]

# Memory-limited wrapper: each test process gets an 8GB virtual address space limit.
# Uses prlimit (RLIMIT_AS) so allocation failures produce a Rust abort with
# backtrace instead of a silent SIGKILL from cgroup OOM killer.
[scripts.wrapper.memory-limit]
command = 'prlimit --as=8589934592 --'

[scripts.setup.melpa-infra-preflight]
command = { command-line = "scripts/melpa-infra-preflight.sh", relative-to = "workspace-root" }
slow-timeout = { period = "60s", terminate-after = 1 }
capture-stdout = true
capture-stderr = true

[profile.default]
test-threads = 24

# Many tests use the bootstrap evaluator (which loads 122 .el files)
# even without "bootstrap" in their name. On a clean tree, the first
# bootstrap-heavy test may legitimately create the shared pdump cache,
# mirroring GNU's bootstrap-emacs/bootstrap-emacs.pdmp build step. That cold
# path can exceed 300s in debug builds, so keep the watchdog above the cold
# bootstrap time while still catching real hangs.
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "0s" }

# Apply memory limit to all tests EXCEPT the real GUI smoke: that test
# spawns a full GUI neomacs (wgpu + Vulkan software rasterizer), and
# llvmpipe's virtual address-space reservations depend on the ambient
# driver closure (nextest's LD_LIBRARY_PATH can select a mesa whose
# per-thread VA reservations blow an 8GB RLIMIT_AS, failing pthread_create
# with EAGAIN). The guardrail exists for unit-test allocation backtraces,
# not for constraining a spawned production GUI stack.
[[profile.default.scripts]]
filter = 'not binary_id(neomacs-gui-tests::real_gui_smoke)'
# `prlimit` is a Linux util-linux executable, not a generic Unix interface.
# macOS is cfg(unix) too, but has no `prlimit`; selecting by the actual host OS
# keeps hosted native tests executable instead of failing before test startup.
platform = { host = "cfg(target_os = \"linux\")" }
run-wrapper = 'memory-limit'

# Start both editor adapters once before package parity cases are dispatched.
# Harness contract tests use fake runtimes, and source-lock tests only parse
# embedded manifests, so both remain independent of a release Neomacs build.
[[profile.default.scripts]]
filter = 'package(neomacs-melpa-tests) and not (test(~parity_tests::harness_contract::) or test(~source_lock::tests::))'
platform = { host = "cfg(unix)" }
setup = 'melpa-infra-preflight'

# The interactive package-TUI suites (moved out of the MELPA jobs) provision
# pinned packages and boot editor pairs; give them the same preflight.
[[profile.default.scripts]]
filter = 'test(~package_tui::)'
platform = { host = "cfg(unix)" }
setup = 'melpa-infra-preflight'

# Minimax oracle cases intentionally evaluate game trees in both Neomacs
# and GNU Emacs.  The exhaustive tic-tac-toe forms can legitimately exceed
# the package-wide 60s watchdog during a full parallel run, so run this
# small test family without parallel CPU contention while keeping the
# per-test watchdog tight enough to catch real hangs.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and test(minimax)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1 }

# A few oracle families are legitimately heavy rather than hung: the
# ucs-normalize cases load the full Unicode normalization tables in BOTH
# Neomacs and GNU, and the exhaustive proptest comparisons run many forms per
# test. Individually they finish well within 120s; the tight 60s package
# watchdog only trips them through CPU contention in a fully parallel run. Give
# them the same 120s ceiling as minimax (matched first, so it wins over the
# general oracle override below). If one still exceeds 120s, that is a real
# performance regression to investigate, not a watchdog to widen further.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and (test(ucs_normalize) or test(oracle_prop_compare_mixed_int_float) or test(oracle_prop_consp_atom_listp))'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1 }

# The full regex sweep evaluates roughly 54k generated cases in 180 release
# Neomacs subprocesses. It is now part of the default suite, so isolate it from
# CPU contention and give it enough time to finish while retaining a bounded
# watchdog.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and test(regex_parity_proptest_full)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 1 }

# The two expanded-cache replay tests each run TWO full partial bootstraps (the
# replay is the point: the second load must reproduce the first), source-loading
# 73 and 82 loadup files respectively with no compiled or pdumped shortcut.
# Measured on an otherwise idle machine: 134s (oclosure) and 144s (nadvice);
# 220s for the same nadvice test with other builds running. They are heavy, not
# hung, and the profile-wide 600s watchdog trips on them only under parallel
# build load.
#
# More than half of each run is one file: lisp/ldefs-boot.el costs 45-68s per
# bootstrap. That file is 1.6MB with 1369 non-ASCII bytes, so SCHARS != SBYTES
# and LispString's byte<->char conversion fast path is off; the loader then pays
# an O(n) scan from string start per top-level form, which is quadratic over the
# file. A profile of the nadvice test attributes ~48% of all cycles to
# `count_lead_bytes` under those conversions. Confirmed by scaling: an all-ASCII
# synthetic autoload file loads linearly (1000 to 8000 forms, 0.026s -> 0.121s
# release) while the same file with one non-ASCII char per form goes superlinear
# (0.034s -> 0.917s). Fixing that in the loader is an engine change, tracked
# separately -- it would speed up every bootstrap-heavy test, not just these two.
#
# Widen the watchdog for these two rather than reserving the whole machine with
# threads-required: the contention comes from processes outside nextest's
# control, and serializing two ~140s tests would add minutes of otherwise-idle
# time to every full run. 1200s keeps a bounded watchdog with room over the
# worst observed 220s. If one exceeds 1200s, that is a real regression.
[[profile.default.overrides]]
filter = 'package(neovm-core) and (test(expanded_cache_replay_preserves_nadvice_eval_and_compile_helpers) or test(expanded_cache_replay_preserves_oclosure_define_class_registration))'
slow-timeout = { period = "1200s", terminate-after = 1 }

# A couple of subprocess probes are timing sensitive rather than divergent:
# `process_attributes_running_child` reads `process-running-child-p' while a
# 0.2s child is alive, and `quit_process_sentinel_message' waits (a bounded
# `accept-process-output' budget) for a SIGQUIT sentinel to fire. A fully
# parallel run can steal enough scheduling latency to miss the window. Run them
# isolated (adequate latency), like the heavy families, rather than reshaping
# the probes (a longer-lived child would hold the process pipe open and block
# the eval).
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests) and (test(process_attributes_running_child) or test(quit_process_sentinel_message))'
threads-required = "num-test-threads"

# The generative window-tree property replays whole operation SEQUENCES in both
# engines, so one "test" is hundreds of paired subprocess runs — the 60s
# single-form budget below does not apply. Listed first so it wins over the
# package-wide rule. Scale with NEOVM_WINDOW_PROP_CASES.
[[profile.default.overrides]]
filter = 'test(oracle_prop_window_tree_survives_random_operation_sequences)'
slow-timeout = { period = "1800s", terminate-after = 1 }

# Oracle tests compare neomacs against GNU Emacs — single-form hangs
# should be caught quickly instead of wasting 10 minutes.
[[profile.default.overrides]]
filter = 'package(neovm-oracle-tests)'
slow-timeout = { period = "60s", terminate-after = 1 }

# Package ecosystem tests launch full editor subprocesses. Package-cache
# preparation uses a cross-process lock, so these tests can use the profile's
# normal parallel scheduling. The live canary has its own per-process timeout
# in the harness; Nextest's watchdog remains slightly wider so the harness can
# emit phase-specific diagnostics first.
[[profile.default.overrides]]
filter = 'package(neomacs-melpa-tests)'
slow-timeout = { period = "960s", terminate-after = 1 }

# Native backend tests contain their own bounded event waits and must also
# prove that worker shutdown cannot deadlock after an assertion failure.
[[profile.default.overrides]]
filter = 'package(neovm-core) and test(native_runtime_test)'
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "0s" }

# These tests own the live desktop through one helper. Do not interleave them
# with other tests in this nextest invocation (including other GUI binaries).
[[profile.default.overrides]]
filter = 'binary_id(neomacs-gui-tests::macos_native_menus)'
platform = { host = 'cfg(target_os = "macos")' }
threads-required = "num-test-threads"
