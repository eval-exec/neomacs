[package]
name = "neovm-text"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Text processing layer extracted from neovm-core"

[features]
# neovm-value/sqlite is a forward, not a default: value's old default
# features supplied it to this crate's default graph, and the sibling
# edges now disable defaults.
default = ["jit", "neovm-value/sqlite"]
jit = ["neovm-value/jit", "neovm-edit/jit"]
perf-probes = []
# TEST-SUPPORT-DESIGN rev 2 rule 5/7: the consumer above value forwards the
# provider's feature and gates the variant matches it introduces.
test-support = ["neovm-value/test-support", "neovm-edit/test-support", "dep:visibility"]

[dependencies]
neovm-value = { path = "../neovm-value", default-features = false }
neovm-edit = { path = "../neovm-edit", default-features = false }
bitflags.workspace = true
encoding_rs.workspace = true
enumflags2.workspace = true
flate2.workspace = true
htmlize.workspace = true
itoa.workspace = true
libc.workspace = true
memchr.workspace = true
neomacs-display-protocol.workspace = true
num_enum.workspace = true
quick-xml.workspace = true
regex-automata.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
static_assertions.workspace = true
strum.workspace = true
thiserror.workspace = true
tl.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
unicode-general-category.workspace = true
visibility = { version = "0.1.1", optional = true }

[dev-dependencies]
# Enables the value provider's test-support surface for text's own test build
# (downward only; never a product feature).
neovm-value = { path = "../neovm-value", default-features = false, features = ["test-support", "test-thread-fallback-heap"] }
neovm-edit = { path = "../neovm-edit", default-features = false, features = ["test-support"] }

[lints.rust]
# Split-wave class guard (LEAD 11:5xZ): deny accidental self-recursion.
unconditional_recursion = "deny"
