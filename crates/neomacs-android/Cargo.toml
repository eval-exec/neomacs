[package]
name = "neomacs-android"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Android application adapter for Neomacs"

[lib]
name = "neomacs_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
neomacs-app.workspace = true
neovm-core.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
neomacs-display-protocol.workspace = true
neomacs-layout-engine.workspace = true
neomacs-wgpu-runtime.workspace = true
pollster.workspace = true
winit = { workspace = true, features = ["android-game-activity"] }

[lints]
workspace = true
