[package]
name = "neomacs-terminfo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned terminal capability snapshots and numeric expansion"
links = "neomacs_terminfo"
autotests = false

[dependencies]
regex.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { workspace = true, features = ["termios"] }

[build-dependencies]
pkg-config.workspace = true

[dev-dependencies]
static_assertions.workspace = true
neomacs-infra.workspace = true
tempfile.workspace = true
rustix = { workspace = true, features = ["pty", "termios"] }

[lints]
workspace = true

# Every file in tests/ is a module of this one binary.
[[test]]
name = "terminfo"
path = "tests/terminfo.rs"
