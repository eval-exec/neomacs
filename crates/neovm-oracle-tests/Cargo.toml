[package]
name = "neovm-oracle-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Oracle-backed Elisp parity tests for NeoVM"

# Every file in tests/ is a module of the ONE oracle test binary rooted at
# tests/oracle.rs. Each former per-file binary statically linked neovm-core and
# Cranelift again; nextest executes each test in its own process regardless of
# how many binaries contain them.
autotests = false

[[test]]
name = "oracle"
path = "tests/oracle.rs"

[dependencies]
colored.workspace = true
expect-test.workspace = true
libc.workspace = true
neomacs-infra.workspace = true
neomacs-parity-reference.workspace = true
neomacs-test-oracle.workspace = true
neomacs-test-env.workspace = true
proptest.workspace = true
tempfile.workspace = true
tracing.workspace = true

[lints.rust]
# Split-wave class guard (LEAD 11:5xZ): the 2026-11-04 eval split left
# EditHost::sync_window_positions delegating to itself; make that class of
# accidental self-recursion a hard error in every target of the crate.
unconditional_recursion = "deny"
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[dev-dependencies]
neomacs-melpa-test-support.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
