[package]
name = "neovm-system"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host system services (files, processes, time, IPC) extracted from neovm-core"

[features]
default = ["jit", "sqlite"]
jit = ["neovm-value/jit", "neovm-edit/jit", "neovm-text/jit", "neovm-eval/jit"]
sqlite = ["dep:rusqlite", "neovm-value/sqlite", "neovm-eval/sqlite"]
# Static-link the bundled libdbus instead of pkg-config `dbus-1` (the
# detection in build.rs turns this into cfg(neomacs_have_dbus)).
dbus-vendored = ["dbus/vendored", "neovm-eval/dbus-vendored", "neovm-value/dbus-vendored"]
# Test-only helpers (P1 post-split test-support pass).  Reachable only from a
# dev edge; never in default or a product feature.
test-support = ["neovm-value/test-support", "neovm-text/test-support", "neovm-eval/test-support", "dep:visibility"]

[dependencies]
# B3 TEST-SUPPORT-VIS: pub only in the test-support build; product visibility
# is unchanged (peer-signed mechanism V1-V6).
visibility = { version = "0.1.1", optional = true }
neovm-value = { path = "../neovm-value", default-features = false }
neovm-edit = { path = "../neovm-edit", default-features = false }
neovm-text = { path = "../neovm-text", default-features = false }
neovm-eval = { path = "../neovm-eval", default-features = false }
base64.workspace = true
crossbeam-channel.workspace = true
dns-lookup.workspace = true
errno.workspace = true
libc.workspace = true
libloading.workspace = true
malachite.workspace = true
network-interface.workspace = true
num_enum.workspace = true
os_pipe.workspace = true
polling.workspace = true
portable-pty.workspace = true
regex.workspace = true
rusqlite = { workspace = true, optional = true }
rustc-hash.workspace = true
rustix.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
socket2.workspace = true
static_assertions.workspace = true
strum.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
webpki-roots.workspace = true
windows-sys.workspace = true
x509-parser.workspace = true

# GNU's configure probes `dbus-1 >= 1.0` (`configure.ac:3919-3944`) and simply
# sets `HAVE_DBUS=no` when it is missing, so dbusbind is absent rather than
# fatal.  `libdbus-sys` has no such mode: with no `dbus-1.pc` its build script
# `panic!()`s, which made every macOS build fail.  Stock macOS ships no
# `dbus-1.pc` -- CI's macos-latest included -- so the dependency itself has to
# be absent there.  Every Rust module that names `dbus` is already behind
# `cfg(neomacs_have_dbus)` (dbusbind/mod.rs), so macOS takes the same
# `--without-dbus` configuration its GNU counterpart takes (and the one CI's
# oracle is built with: `.github/actions/setup-gnu-emacs/action.yml:121`).
# Stage 6 moved the transport here with the dependency; this gate is the
# neovm-core/Cargo.toml rule moved with it.
#
# Keep this rule in step with `detect_dbus`'s macOS guard in
# build_support/host_cfg.rs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus = { version = "0.9", default-features = false }

[build-dependencies]
# dbus-1 detection for the moved dbusbind transport (see build.rs).
pkg-config.workspace = true

[dev-dependencies]
# Downward test-only edge: the crate's own tests use the value-level helpers
# through src/test_utils.rs.  Not a product dependency.
neovm-value = { path = "../neovm-value", default-features = false, features = ["test-support", "test-thread-fallback-heap"] }
# The re-homed process/wait tests name eval's test-support surface (wait gates,
# process-state metadata).  Downward, test-only.
neovm-eval = { path = "../neovm-eval", default-features = false, features = ["test-support"] }
# The A' gate on fence-routed items is cfg(any(test, feature = "test-support"));
# the optional `visibility` dependency is tied to the test-support feature, so
# this dev-dependency makes the attribute macro resolvable in this crate's own
# cfg(test) build too (same as neovm-eval and neovm-display).
visibility = "0.1.1"

[lints.rust]
# Split-wave class guard (LEAD 11:5xZ): deny accidental self-recursion.
unconditional_recursion = "deny"
