[package]
name = "neovm-edit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Editor and buffer storage extracted from neovm-core"

[features]
default = ["jit"]
test-support = ["neovm-value/test-support"]
display-stop-validate = []
jit = ["neovm-value/jit"]
# Numeric redisplay policy injection for dependent fixtures (stage-4 W5/E13:
# the evaluator re-exports the guard, so the feature must reach this crate).
redisplay-test-policy = []
test-support = ["neovm-value/test-support", "dep:visibility"]

[dependencies]
neovm-value = { path = "../neovm-value" }
libc.workspace = true
malachite.workspace = true
memchr.workspace = true
num_enum.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
static_assertions.workspace = true
strum.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tracing.workspace = true
visibility = { version = "0.1.1", optional = true }

[dev-dependencies]
neovm-value = { path = "../neovm-value", features = ["test-support"] }
