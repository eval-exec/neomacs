[package]
name = "neomacs-display-wire"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NDP/1 display service: messages, codec and FrameSync over the Neomacs display protocol"

[features]
default = []
# The golden corpus, frame builders and the canonical materialized encoding,
# for this crate's tests and the layout engine's parity corpus.
testing = []

[dependencies]
# Workspace: the protocol vocabulary and its identity leaf only
# (scripts/ci/check-crate-graph.py).
neomacs-display-protocol.workspace = true
neovm-display-identity.workspace = true
serde.workspace = true
# DESIGN §6.9: bincode 2 `standard()`. Without `derive`, so no package is
# added to Cargo.lock.
bincode = { version = "=2.0.1", default-features = false, features = ["std", "serde"] }
sha2.workspace = true
flate2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
neomacs-display-wire = { path = ".", features = ["testing"] }
# Only for the test that the two lane enums agree; the crate itself never
# depends on the session layer (normal dependencies, check-crate-graph.py).
neomacs-session.workspace = true
expect-test.workspace = true
proptest.workspace = true
strum.workspace = true

[lints]
workspace = true

[[test]]
name = "wire"
path = "tests/wire.rs"
