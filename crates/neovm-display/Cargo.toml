[package]
name = "neovm-display"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Display, window, face and image layer extracted from neovm-core"

[features]
default = ["jit"]
jit = ["neovm-value/jit", "neovm-edit/jit", "neovm-text/jit", "neovm-eval/jit"]
sound = ["dep:rodio"]
redisplay-test-policy = ["neovm-eval/redisplay-test-policy"]
display-stop-validate = ["neovm-edit/display-stop-validate"]
gc-memory-telemetry = []
# Test-only support surface: enabled only by a dev-dependency of a crate ABOVE
# neovm-display, never by a product profile.
test-support = ["neovm-value/test-support"]

[dependencies]
rodio = { version = "0.20", optional = true }
neovm-value = { path = "../neovm-value" }
neovm-edit = { path = "../neovm-edit" }
neovm-text = { path = "../neovm-text" }
neovm-eval = { path = "../neovm-eval" }
enum-map.workspace = true
neomacs-display-protocol.workspace = true
neomacs-video-model.workspace = true
num_enum.workspace = true
regex.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
static_assertions.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Downward-only: shared value test helpers for this crate's own unit tests
# (dependency crates never have cfg(test), so the provider feature is enabled
# only by this dev edge, exactly like neovm-eval).
neovm-value = { path = "../neovm-value", features = ["test-support"] }
# Consumer gate: value's test-support widens CacheRootScan::Snapshot, so the
# text regex arm that matches it must be compiled in the same test graph.
neovm-text = { path = "../neovm-text", features = ["test-support"] }
