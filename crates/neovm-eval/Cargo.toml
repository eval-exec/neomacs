[package]
name = "neovm-eval"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Evaluator and Lisp runtime extracted from neovm-core"

[features]
default = ["jit"]
# Test-only support surface: enabled only by a dev-dependency of a crate
# ABOVE neovm-eval (core), never by a product profile.  TEST-SUPPORT-VIS
# (B3, peer ruling 02:2xZ): named items keep their production visibility and
# gain `visibility::make(pub)` only in this build; the provider features
# forward downward so the whole lower graph is in the same test mode.
test-support = ["neovm-value/test-support", "neovm-text/test-support", "neovm-edit/test-support", "dep:visibility"]
contract-fixtures = []
desktop-font-settings = []
gc-memory-telemetry = []
jit = ["neovm-value/jit", "neovm-edit/jit", "neovm-text/jit"]
perf-probes = []
redisplay-test-policy = ["neovm-edit/redisplay-test-policy"]
sqlite = []
vm-profile = []

[dependencies]
# B3 TEST-SUPPORT-VIS: pub only in the test-support build; product visibility
# is unchanged.  Test-provider defs are annotated by exact rustc def span.
visibility = { version = "0.1.1", optional = true }
neovm-value = { path = "../neovm-value" }
neovm-edit = { path = "../neovm-edit" }
neovm-text = { path = "../neovm-text" }
bitflags.workspace = true
bytemuck.workspace = true
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-jit.workspace = true
cranelift-module.workspace = true
cranelift-native.workspace = true
cranelift-object.workspace = true
crossbeam-channel.workspace = true
encoding_rs.workspace = true
enum-map.workspace = true
enumflags2.workspace = true
errno.workspace = true
fs4.workspace = true
hashbrown.workspace = true
hostname.workspace = true
inotify.workspace = true
keysymdefs.workspace = true
libc.workspace = true
libloading.workspace = true
malachite.workspace = true
memchr.workspace = true
memmap2.workspace = true
native-regex.workspace = true
neomacs-display-protocol.workspace = true
num_enum.workspace = true
object = { version = "0.39", default-features = false, features = ["read", "std"] }
polling.workspace = true
rustc-hash.workspace = true
rustix.workspace = true
serde.workspace = true
sha1.workspace = true
sha2.workspace = true
smallvec.workspace = true
stacker.workspace = true
static_assertions.workspace = true
strum.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true
unicode_names2.workspace = true
whoami = "2.1.2"
md-5.workspace = true
os_pipe.workspace = true
portable-pty.workspace = true
rustls.workspace = true
socket2.workspace = true
neomacs-video-model.workspace = true
windows-sys.workspace = true
[dev-dependencies]
# Downward-only: shared value test helpers for this crate's own unit tests.
neovm-value = { path = "../neovm-value", features = ["test-support"] }
# value's test-support exposes CacheRootScan::Snapshot, so text must compile
# its matching arm in the same test build (A1 consumer gate, downward only).
neovm-text = { path = "../neovm-text", features = ["test-support"] }
