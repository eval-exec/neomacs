[package]
name = "neomacs-melpa-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
# Both frozen and live packages are installed through the editor's own
# `package-install`; Rust only orchestrates isolated processes and verifies
# pinned fixture checksums.
neomacs-test-oracle.workspace = true
neomacs-melpa-test-support.workspace = true
fs4.workspace = true
sha2.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects"] }

[dev-dependencies]
expect-test.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
neomacs-gui-tests.workspace = true

[target.'cfg(unix)'.dev-dependencies]
neomacs-tui-tests.workspace = true
