<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Process-local empty catalog; never changes the user's installed fonts. -->
<fontconfig>
  <!-- An explicit directory also prevents fontdb's empty-config fallback
       from scanning the standard system font directories. -->
  <dir prefix="relative">intentionally-missing-font-directory</dir>
</fontconfig>
