[package]
name = "neomacs-gui-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# This crate exists only for its integration tests and shared GUI test harness.
# It drives Neomacs native GUI runs through deterministic text/PNG artifacts
# instead of relying on manual window inspection.
#
# Every file in tests/ is a module of the ONE gui test binary rooted at
# tests/gui.rs, except native_display, which the native display contract
# selects with --test. Each former per-file binary linked the display stack
# again; nextest runs every test in its own process.
autotests = false

[[test]]
name = "gui"
path = "tests/gui.rs"

[[test]]
name = "native_display"
path = "tests/native_display.rs"

# The fixture mock has no unit tests; skip linking an empty test harness.
[[bin]]
name = "neomacs-telega-fixture-mock"
path = "src/bin/neomacs-telega-fixture-mock.rs"
test = false

[dependencies]
getrandom.workspace = true
neomacs-infra.workspace = true
image.workspace = true
serde_json = "1"
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
neomacs-test-fonts.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
strum.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
neomacs-melpa-test-support.workspace = true
rustix.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
