# The Doom Emacs fixture the config-environment tests mount.
#
# `repo` and `revision` are the pinned provenance of the tree GNU Emacs
# bootstraps during materialization.  The initial pin records the checkout
# this fixture was first validated against: doomemacs/core at v2.2.1.
# Re-pin by editing this file; materialization keys its cache on the
# revision, so a new revision rebuilds rather than reuses.
#
# Package pins record the identity of the package builds the GNU bootstrap
# produced (the SHA-256 of the sealed fixture's PACKAGES record).  The
# packages come from live archives and are only reproducible as a record,
# so this digest is what `open` checks: a rebuild that silently pulled
# different versions refuses to mount, and re-pinning is its own
# ceremony — never a side effect of a materialization.
#
# The straight record lists each repo at the commit its recipe pins
# (PACKAGES schema = 2): that commit is host-independent, while the
# per-Emacs build cache the identity once anchored is host-local output.
# A record from the retired build-cache schema fails to parse, so a
# fixture sealed against it must be re-materialized, not re-pinned.
#
# The pin is host-scoped because the package set is: Doom's recipes install
# OS-specific packages, so a macOS bootstrap cannot match a Linux digest.
# `packages =` is the Linux pin (the historical key); other hosts use
# `packages_<os>` (`packages_macos`, `packages_windows`).  A host with no
# line of its own is unpinned — `infra status` reports it, and
# `infra pin-packages doom` records the host it ran on.
#
# RE-BASELINING LOG
#   2026-09-24  Pin the straight package builds: 17 repos, anchored by
#               the build-31.1 cache digest, from the sealed fixture.
#   2026-11-20  Retire the build-cache anchor (schema 1): that digest is
#               host-local output, and two CI materializations of one
#               runner image diverged (runs 44759918099 and 44770027130:
#               e6259315 vs 662e2eec). The identity is now the per-repo
#               HEAD commits (PACKAGES schema = 2), which straight pins
#               independently of the host Emacs build. Fixtures sealed
#               under schema 1 fail closed and re-materialize.
#   2026-11-20  schema-2 re-pin: one digest on both hosts, 559f4f68.
#               The pin ceremony ran on a fresh linux-gtk3
#               materialization (pinned oracle) and on a fresh macos-ns
#               materialization on macmini (pinned oracle); both sealed
#               the same 17-repo commit list, so `packages` and
#               `packages_macos` agree. A fresh CI materialization must
#               reproduce this digest for the run to be green.
#   2026-11-20  general a48768f85a655fe77b5f45c2880b420da1b1b9c3 and
#               nerd-icons d7742c5e8fba5d601633dd46f4cd7b34928f1185 are
#               already pinned in this Doom revision. straight checks
#               those commits out. The sync log says "checked out"
#               because the pin table is keyed by the local repo
#               (general.el, nerd-icons.el) and the log looks up the
#               package name. Linux bootstraps the same revision, so
#               those two are not a separate Linux float.

repo = "https://github.com/doomemacs/core"
revision = "8a301d98d0d6d1aa7c54a8f8df48de7b2c886b2e"
packages = "559f4f68c22947cf4aed9468a56c24c3fb152f895f155d294efde532d4234674"
packages_macos = "559f4f68c22947cf4aed9468a56c24c3fb152f895f155d294efde532d4234674"
