[package]
name = "neomacs-layout-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust layout engine crate for Neomacs"
autotests = false

[features]
# Explicit forwards for what neovm-core's dependency edges used to bring in
# through their enabled defaults.  Kept as features so --no-default-features
# stays a real no-jit build.
default = ["jit", "sqlite"]
jit = ["neovm-core/jit"]
sqlite = ["neovm-core/sqlite"]
# Performance probes (the GUI layout benchmark family).  Measurement tools,
# not correctness tests: compiled out of the default suite and kept building by
# the build-gate's opt-in feature check.
perf-probes = []
neo-term = ["neomacs-display-protocol/neo-term"]
# Numeric fixture policy propagation in unit/dependent-crate tests only.
redisplay-test-policy = ["neovm-core/redisplay-test-policy"]
freetype-bundled = [
    "freetype-rs/bundled",
    "neomacs-font-materializer/freetype-bundled",
]

[dependencies]
thiserror.workspace = true
static_assertions.workspace = true
enum-map.workspace = true
memchr.workspace = true
rustc-hash.workspace = true
neomacs-display-protocol = { workspace = true }
neomacs-font-materializer.workspace = true
neovm-core.workspace = true
cosmic-text.workspace = true
fontdb.workspace = true
tracing.workspace = true
once_cell.workspace = true
ttf-parser.workspace = true
unicode-script.workspace = true
strum.workspace = true
num_enum.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig.workspace = true
yeslogic-fontconfig-sys.workspace = true
# The Fontconfig adapter uses FreeType for GNU-compatible metric probes and
# legacy fixed-bitmap materialization. macOS obtains both font identity and
# metrics from CoreText and must not link FreeType.
freetype-rs = { version = "0.38.0" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-text.workspace = true

[target.'cfg(windows)'.dependencies]
dwrote.workspace = true
sys-locale.workspace = true
winapi.workspace = true
wio.workspace = true

[dev-dependencies]
neomacs-test-fonts.workspace = true
neovm-core = { workspace = true, features = ["jit", "redisplay-test-policy"] }
# The Rows-lifetime fixtures pin their GC mode through value's signed per-heap
# test fence; this downward dev edge enables that test surface only for tests.
neovm-value = { workspace = true, features = ["test-support"] }
# value's test-support exposes CacheRootScan::Snapshot, so text must compile
# its matching arm in the same test build (A1 consumer gate, downward only).
neovm-text = { path = "../neovm-text", default-features = false, features = ["test-support"] }
serde_json.workspace = true
tracing-test.workspace = true

[lints]
workspace = true

# Every file in tests/ is a module of this one binary.
[[test]]
name = "layout"
path = "tests/layout.rs"
