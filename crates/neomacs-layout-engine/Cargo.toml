[package]
name = "neomacs-layout-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust layout engine crate for Neomacs"

[features]
default = []
neo-term = ["neomacs-display-protocol/neo-term"]
freetype-bundled = [
    "freetype-rs/bundled",
    "neomacs-font-materializer/freetype-bundled",
]

[dependencies]
memchr.workspace = true
rustc-hash.workspace = true
neomacs-display-protocol = { workspace = true }
neomacs-font-materializer.workspace = true
neovm-core.workspace = true
cosmic-text.workspace = true
fontdb.workspace = true
tracing.workspace = true
once_cell.workspace = true
ttf-parser.workspace = true
unicode-script.workspace = true
strum.workspace = true
num_enum.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig.workspace = true
yeslogic-fontconfig-sys.workspace = true
# The Fontconfig adapter uses FreeType for GNU-compatible metric probes and
# legacy fixed-bitmap materialization. macOS obtains both font identity and
# metrics from CoreText and must not link FreeType.
freetype-rs = { version = "0.38.0" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-text.workspace = true

[target.'cfg(windows)'.dependencies]
dwrote.workspace = true
sys-locale.workspace = true
winapi.workspace = true
wio.workspace = true

[target.'cfg(any(target_os = "android", target_family = "wasm"))'.dependencies]
epaint_default_fonts.workspace = true

[dev-dependencies]
epaint_default_fonts.workspace = true
neomacs-test-fonts.workspace = true
tracing-test.workspace = true

[lints]
workspace = true
