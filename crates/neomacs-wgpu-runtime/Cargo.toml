[package]
name = "neomacs-wgpu-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable wgpu surface lifecycle for Neomacs frontends"

[dependencies]
neomacs-app.workspace = true
neomacs-display-protocol.workspace = true
neomacs-renderer-wgpu.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
winit = { workspace = true, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-game-activity"] }

[lints]
workspace = true
