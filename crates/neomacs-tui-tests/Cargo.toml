[package]
name = "neomacs-tui-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# This crate exists only for its integration tests.
# `src/lib.rs` provides the shared test harness (TuiSession, screen
# diffing, key translation). Every file in `tests/` is a module of the
# ONE `tui` test binary (rooted at `tests/tui.rs`): each used to be its
# own binary, which meant 37 separate static links of neovm-core and
# Cranelift for zero benefit — nextest executes every test in its own
# process regardless of how many binaries contain them.
autotests = false

[[test]]
name = "tui"
path = "tests/tui.rs"

[target.'cfg(unix)'.dependencies]
vt100 = "0.16"
pty-process = "0.5"
libc = { workspace = true }
tempfile.workspace = true
neomacs-display-protocol.workspace = true
serde_json.workspace = true
