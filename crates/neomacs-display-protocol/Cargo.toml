[package]
name = "neomacs-display-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared display protocol types for Neomacs layout/render/runtime"

[features]
default = []
neo-term = []

[dependencies]
neovm-display-identity.workspace = true
static_assertions.workspace = true
rustc-hash.workspace = true
bitflags.workspace = true
num_enum.workspace = true
serde.workspace = true
nutype.workspace = true
serde_json = "1"
strum.workspace = true
tracing.workspace = true

[dev-dependencies]
# The NDP/1 codec (DESIGN §6.9). Without `derive`, so no package is added:
# bincode and unty are already in Cargo.lock.
bincode = { version = "=2.0.1", default-features = false, features = ["std", "serde"] }
neomacs-infra.workspace = true
proptest.workspace = true

[lints]
workspace = true
