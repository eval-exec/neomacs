[package]
name = "neomacs-display-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust runtime display engine for Neomacs"

[dependencies]
# Text rendering - Pure Rust stack
cosmic-text.workspace = true
rustc-hash.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true

# Vulkan for DMA-BUF import (Linux WebView integration)
ash.workspace = true

# Winit + wgpu backend (always enabled)
winit.workspace = true
wgpu.workspace = true
wgpu-hal.workspace = true
raw-window-handle.workspace = true
arboard.workspace = true
bytemuck.workspace = true
pollster.workspace = true

# Image decoding (async)
image.workspace = true

# SVG rendering (pure Rust, no C deps)
resvg.workspace = true

# Utilities
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bitflags.workspace = true
cfg-if.workspace = true

# Thread communication
crossbeam-channel.workspace = true

# Cross-platform TTY terminal I/O
crossterm = "0.29"

# FFI / system
libc.workspace = true

# NeoVM Elisp evaluator
neomacs-app.workspace = true
neovm-core.workspace = true
neomacs-display-protocol.workspace = true
neomacs-video-model.workspace = true
neomacs-layout-engine.workspace = true
neomacs-renderer-wgpu.workspace = true
neomacs-video = { workspace = true, optional = true }
neomacs-webview.workspace = true

# Terminal emulation (neo-term)
rio-vt = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# Native video remains opt-in at this crate boundary. Linux production builds
# enable it through neomacs's `cargo xtask fresh-build` pipeline.
default = ["neo-term"]
tty-backend = []
# Cross-platform native GPU-resident video
video = [
    "dep:neomacs-video",
    "neomacs-renderer-wgpu/video",
]
video-dmabuf = [
    "video",
    "neomacs-renderer-wgpu/video-dmabuf",
]
# Cross-platform embedded WebView integration
webview = [
    "neomacs-webview/webview",
    "neomacs-renderer-wgpu/webview",
]
# GPU-accelerated terminal emulator
neo-term = [
    "dep:rio-vt",
    "parking_lot",
    "portable-pty",
    "neomacs-display-protocol/neo-term",
    "neomacs-layout-engine/neo-term",
]

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
winit = { workspace = true, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
smithay-clipboard.workspace = true
x11-dl.workspace = true
rustix.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[lints]
workspace = true
