        </div>
        </div>
        <p id="browser-status" role="status">Loading Neomacs…</p>
        <div id="browser-lifecycle" role="progressbar" aria-label="Editor startup"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="browser-lifecycle-bar"></div>
        </div>
        <div
          id="browser-progress"
          role="progressbar"
          aria-label="Editor download"
          aria-valuemin="0"
          aria-valuemax="100"
          hidden
        >
          <span id="browser-progress-label"></span>
          <div id="browser-progress-track"><div id="browser-progress-bar"></div></div>
        </div>
        <ol id="browser-startup-log" aria-label="Startup checklist"></ol>
        <button type="button" id="browser-splash-details">details</button>
      </section>
      <textarea
        id="browser-text-input"
        aria-label="Neomacs text input"
        autocapitalize="off"
        autocomplete="off"
        spellcheck="false"
        tabindex="0"
      ></textarea>
    </main>
    <script type="module">
      const status = document.querySelector("#browser-status");
      const history = document.querySelector("#browser-startup-log");
      const progressLabel = document.querySelector("#browser-progress-label");
      const started = performance.now();
      const phaseStarts = new Map();
      let currentPhaseLabel = "Starting";
      // One quiet line under the bar: the active phase and, while bytes
      // flow, the measure from the (visually hidden) progress label.
      function renderBootStatus() {
        if (["ready", "failed", "stopped"].includes(status.dataset.state)) return;
        const measure = progressLabel.textContent;
        status.textContent = measure
          ? `${currentPhaseLabel} — ${measure}`
          : `${currentPhaseLabel}…`;
      }
      new MutationObserver(renderBootStatus).observe(progressLabel, {
        childList: true, characterData: true, subtree: true,
      });
      const phases = [
        ["page", "Load webpage"], ["release", "Resolve release"],
        ["frontend-modules", "Load styles and frontend modules"],
        ["frontend-download", "Download editor frontend"],
        ["frontend-init", "Compile and initialize frontend"],
        ["worker-start", "Start editor worker"],
        ["worker-download", "Download editor and runtime assets"],
        ["storage", "Open persistent storage"],
        ["worker-compile", "Compile editor worker"],
        ["worker-probe", "Check worker suspend/resume"],
        ["packages", "Download and verify landing-page packages"],
        ["verify-image", "Verify runtime image"],
        ["verify-resources", "Verify runtime resources"],
        ["unpack", "Unpack and mount Lisp runtime"],
        ["restore", "Restore editor heap"],
        ["mounts", "Mount home and temporary storage"],
        ["configure", "Configure editor frame and fonts"],
        ["lisp", "Configure browser Lisp startup"],
        ["first-frame", "Start session and present first editor frame"],
      ];
      const rows = new Map(phases.map(([id, label]) => {
        const row = document.createElement("li");
        row.dataset.phase = id;
        row.dataset.state = "pending";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.disabled = true;
        checkbox.setAttribute("aria-label", label);
        const text = document.createElement("span");
        text.className = "phase-label";
        text.textContent = label;
        const state = document.createElement("small");
        state.textContent = "Pending";
        const heading = document.createElement("div");
        heading.className = "phase-heading";
        heading.append(checkbox, text, state);
        const details = document.createElement("ul");
        details.className = "phase-details";
        row.append(heading, details);
        history.append(row);
        return [id, row];
      }));
      // One bar for the whole boot.  Download phases carry the real time
      // cost and interpolate by bytes; compute phases creep so the bar
      // never stalls or moves backwards.
      const lifecycleWeights = new Map([
        ["page", 0.005], ["release", 0.01], ["frontend-modules", 0.01],
        ["frontend-download", 0.12], ["frontend-init", 0.015],
        ["worker-start", 0.01], ["worker-download", 0.58], ["storage", 0.005],
        ["worker-compile", 0.02], ["worker-probe", 0.005], ["packages", 0.05],
        ["verify-image", 0.02], ["verify-resources", 0.015], ["unpack", 0.03],
        ["restore", 0.04], ["mounts", 0.005], ["configure", 0.01],
        ["lisp", 0.02], ["first-frame", 0.01],
      ]);
      const lifecycleBar = document.querySelector("#browser-lifecycle-bar");
      const lifecycleMeter = document.querySelector("#browser-lifecycle");
      let lifecycleShown = 0;
      let lifecycleTarget = 0;
      function lifecycleProgress() {
        let done = 0, activeWeight = 0, activeFraction = 0.35;
        for (const [id, weight] of lifecycleWeights) {
          const row = rows.get(id);
          if (!row) continue;
          if (row.dataset.state === "done") done += weight;
          else if (row.dataset.state === "active") {
            activeWeight = weight;
            const measure = /([\d.]+)\s*\/\s*([\d.]+)\s*MiB/.exec(progressLabel.textContent);
            if (measure) {
              activeFraction = Math.min(1, Number(measure[1]) / Math.max(1e-6, Number(measure[2])));
            } else {
              const began = phaseStarts.get(id);
              const elapsed = began === undefined ? 0 : (performance.now() - began) / 1000;
              activeFraction = Math.min(0.9, 0.3 + elapsed / 8);
            }
          }
        }
        const target = done + activeWeight * activeFraction;
        lifecycleTarget = Math.max(lifecycleTarget, Math.min(target, 0.995));
      }
      setInterval(lifecycleProgress, 120);

      // Render on every frame with exponential easing toward the target:
      // the bar glides continuously instead of stepping with each phase
      // completion or progress burst.  Byte-true fidelity is not the goal;
      // calm forward motion is.
      let lastFrame = performance.now();
      function renderLifecycle(now) {
        const dt = Math.min(0.25, (now - lastFrame) / 1000);
        lastFrame = now;
        const approaching = lifecycleTarget - lifecycleShown;
        // Ease toward the target, but never faster than a steady glide:
        // large target jumps (a download phase completing) must flow, not
        // lurch.  The bar is hidden at ready, so the final catch-up is not
        // something the user waits for.
        const glide = approaching * (1 - Math.exp(-dt * 3));
        const capped = Math.sign(glide) * Math.min(Math.abs(glide), dt * 0.3);
        lifecycleShown = Math.abs(approaching) > 0.0005
          ? lifecycleShown + capped
          : lifecycleTarget;
        const percent = lifecycleShown * 100;
        lifecycleBar.style.inlineSize = `${percent}%`;
        lifecycleMeter.setAttribute("aria-valuenow", String(Math.round(percent)));
        requestAnimationFrame(renderLifecycle);
      }
      requestAnimationFrame(renderLifecycle);

      function phaseDetail(id, message) {
        if (["ready", "failed", "stopped"].includes(status.dataset.state)) return;
        const row = rows.get(id);
        if (!row || typeof message !== "string") return;
        const line = document.createElement("li");
        line.textContent = `[${((performance.now() - started) / 1000).toFixed(3)}s] ${message}`;
        row.querySelector(".phase-details").append(line);
      }
      function updatePhase(id, state) {
        if (["ready", "failed", "stopped"].includes(status.dataset.state)) return;
        if (!["pending", "active", "done", "failed"].includes(state)) return;
        if (state === "failed" && !id) {
          for (const [key, row] of rows) if (row.dataset.state === "active") updatePhase(key, "failed");
          return;
        }
        const row = rows.get(id);
        if (!row || row.dataset.state === "done" || row.dataset.state === state) return;
        row.dataset.state = state;
        row.querySelector("input").checked = state === "done";
        row.querySelector("input").indeterminate = state === "active";
        row.querySelector("small").textContent = {pending: "Pending", active: "In progress", done: "Done", failed: "Failed"}[state];
        if (state === "active") {
          phaseStarts.set(id, performance.now());
          phaseDetail(id, "Started");
          currentPhaseLabel = row.querySelector(".phase-label").textContent;
          renderBootStatus();
          if (id === "frontend-download" || id === "worker-download" || id === "packages") {
            row.querySelector(".phase-heading").insertBefore(
              document.querySelector("#browser-progress"), row.querySelector("small"));
          }
          row.scrollIntoView({block: "nearest"});
        } else if (state === "done") {
          const began = phaseStarts.get(id);
          phaseDetail(id, began === undefined ? "Completed" : `Completed in ${((performance.now() - began) / 1000).toFixed(3)}s`);
        } else if (state === "failed") phaseDetail(id, "Failed; see error below");
      }
      document.addEventListener("neomacs:startup-phase", event => {
        updatePhase(event.detail?.phase, event.detail?.state);
      });
      document.addEventListener("neomacs:startup-detail", event => {
        phaseDetail(event.detail?.phase, event.detail?.message);
      });
      document.querySelector("#browser-splash-details")?.addEventListener("click", () => {
        const splash = document.querySelector("#browser-startup");
        splash.classList.toggle("browser-splash-diagnostic");
        const open = splash.classList.contains("browser-splash-diagnostic");
        const toggle = document.querySelector("#browser-splash-details");
        toggle.textContent = open ? "hide details" : "details";
        toggle.setAttribute("aria-expanded", String(open));
      });
      updatePhase("page", "done");

      function completeLifecycle() {
        lifecycleTarget = 1;
      }
      const lifecycleFinisher = new MutationObserver(() => {
        if (["ready", "failed", "stopped"].includes(status.dataset.state)) {
          if (status.dataset.state === "ready") completeLifecycle();
          lifecycleFinisher.disconnect();
        }
      });
      lifecycleFinisher.observe(status, { attributes: true, attributeFilter: ["data-state"] });

      function installIcon(url) {
        const link = document.createElement("link");
        link.rel = "icon";
        link.type = "image/svg+xml";
        link.href = new URL(url, document.baseURI).href;
        document.head.append(link);
      }

      function installStylesheet(url) {
        const href = new URL(url, document.baseURI).href;
        return new Promise((resolve, reject) => {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          link.addEventListener("load", resolve, { once: true });
          link.addEventListener(
            "error",
            () => reject(new Error(`failed to load release stylesheet: ${href}`)),
            { once: true },
          );
          document.head.append(link);
        });
      }

      async function loadCurrentRelease() {
        updatePhase("release", "active");
        const response = await fetch("./manifest.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`failed to fetch release manifest: ${response.status}`);
        }
        const manifest = await response.json();
        if (manifest.schema !== 1 || typeof manifest.entry !== "string") {
          throw new Error("unsupported Neomacs browser release manifest");
        }
        phaseDetail("release", `Selected ${manifest.entry}`);

        updatePhase("release", "done");
        updatePhase("frontend-modules", "active");
        if (typeof manifest.favicon === "string") installIcon(manifest.favicon);
        if (typeof manifest.stylesheet === "string") {
          await installStylesheet(manifest.stylesheet);
        }

        await import(new URL(manifest.entry, document.baseURI).href);
      }

      loadCurrentRelease().catch((error) => {
        updatePhase(null, "failed");
        status.dataset.state = "failed";
        status.textContent = `Neomacs failed to start: ${
          error instanceof Error ? error.message : String(error)
        }`;
        console.error(error);
      });
    </script>
  </body>
</html>
