<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Neomacs</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="browser-shell">
      <p id="browser-status" role="status">Loading Neomacs…</p>
      <textarea
        id="browser-text-input"
        aria-label="Neomacs text input"
        autocapitalize="off"
        autocomplete="off"
        spellcheck="false"
        tabindex="0"
      ></textarea>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
