[package]
name = "neovm-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core runtime structures for NeoVM"
# The compat_* suites share one binary (see tests/compat_all.rs); turning
# auto-discovery off makes every remaining integration target explicit below.
autotests = false

[dependencies]
neovm-host-abi.workspace = true
neomacs-display-protocol.workspace = true
neomacs-video-model.workspace = true
enumflags2.workspace = true
bitflags.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
errno.workspace = true
keysymdefs.workspace = true
rustix = { workspace = true, features = ["event", "pipe"] }
fs4.workspace = true
sysinfo.workspace = true
native-regex.workspace = true
regex-automata.workspace = true
memchr.workspace = true
rustc-hash.workspace = true
hashbrown.workspace = true
aes.workspace = true
cbc.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
md-5.workspace = true
getrandom.workspace = true
base64.workspace = true
num_enum.workspace = true
enum-map.workspace = true
typed-index-collections.workspace = true
thiserror.workspace = true
static_assertions.workspace = true
strum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
tracing-appender.workspace = true
stacker.workspace = true
dns-lookup.workspace = true
hostname.workspace = true
network-interface.workspace = true
libloading.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
bytemuck.workspace = true
memmap2.workspace = true
tempfile.workspace = true
polling.workspace = true
socket2.workspace = true
portable-pty.workspace = true
os_pipe.workspace = true
smallvec.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
rustls-pki-types.workspace = true
x509-parser.workspace = true
parking_lot.workspace = true
malachite.workspace = true
itoa.workspace = true
unicode_names2.workspace = true
unicode-general-category.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
rusqlite = { workspace = true, optional = true }
quick-xml.workspace = true
tl.workspace = true
htmlize.workspace = true
rodio = { version = "0.20", optional = true }
# Cranelift JIT backend — optional, enabled by the `jit` feature. The workspace
# owns this API-coupled release train so its crates can only move together.
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
# AOT object emission (R1c): emit a relocatable `.o` via Cranelift's ObjectModule
# and parse/inspect the bytes using the same `object` release as Cranelift.
# Both dependencies are optional, enabled by `jit`.
cranelift-object = { workspace = true, optional = true }
# AOT caches inspect symbol tables; they do not decode compressed sections.
object = { version = "0.39", default-features = false, features = ["read", "std"], optional = true }
# Host-ISA builder for the AOT ObjectModule (is_pic=true). Already in the lock
# transitively via cranelift-jit; made a direct dep so `jit/aot.rs` can call
# `cranelift_native::builder()`.
cranelift-native = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
whoami = "2.1.2"
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
inotify.workspace = true

# GNU's configure probes `dbus-1 >= 1.0` (`configure.ac:3919-3944`) and simply
# sets `HAVE_DBUS=no` when it is missing, so dbusbind is absent rather than
# fatal.  `libdbus-sys` has no such mode: with no `dbus-1.pc` its build script
# `panic!()`s, which made every macOS build fail.  Stock macOS ships no
# `dbus-1.pc` -- CI's macos-latest included, which is what turned `doom install
# compatibility (macos aarch64)` red -- so the dependency itself has to be
# absent there.  Every Rust use is already behind `cfg(neomacs_have_dbus)`, so
# macOS takes the same `--without-dbus` configuration its GNU counterpart takes
# (and the one CI's oracle is built with:
# `.github/actions/setup-gnu-emacs/action.yml:121`).
#
# Keep this rule in step with `detect_dbus`'s macOS guard in `build.rs`.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus = { version = "0.9", default-features = false }

[features]
default = ["jit", "sqlite"]
# Diagnostic inventory walks and JSONL records; absent from ordinary builds.
gc-memory-telemetry = ["dep:serde_json"]
sqlite = ["dep:rusqlite"]
# Static-link the crate's bundled libdbus instead of pkg-config `dbus-1`.
# Production/Nix builds leave this off and use the system library.
dbus-vendored = ["dbus/vendored"]
sound = ["rodio"]
# Set by `neomacs`'s `webview` feature.  `build.rs` turns it into
# `cfg(neomacs_have_wkwebview)` on macOS, which is what decides whether
# `xwidget-internal` is provided: the evaluator cannot see
# `neomacs-webview`'s feature directly, and advertising the layer without the
# backend leaves `xwidget-webkit-browse-url` failing at creation.
webview = []
# The Linux display runtime enables this when it links its native GSettings
# adapter. Bare evaluator builds must not advertise a native subscription.
desktop-font-settings = []
# Opt-in per-char validator for the display-motion stop cache (indent.rs
# DisplayStopCache): re-runs every DisplayStopProp probe on each fast-path char
# and asserts the cached stop skipped nothing. OFF by default (like GNU's
# MARKER_DEBUG) because it is O(scan) -- the exact per-char work the cache exists
# to skip -- so it must not tax ordinary debug/test builds. Enable it in a
# dedicated validation run.
display-stop-validate = []
# Numeric redisplay policy injection for dependent crate fixtures only.
# Dev-dependencies opt in; shipping builds retain process-once selectors.
redisplay-test-policy = []
# Tiered JIT execution subsystem (src/emacs_core/runtime/jit/ +
# runtime/bytecode/ELISP_VM_MODERNIZATION.md). DEFAULT-ON (see `default` above): the
# baseline JIT ships enabled. Toggle it at runtime with `NEOVM_JIT=0` (no
# recompile); build the interpreter-only engine with `--no-default-features`.
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-object",
    "dep:object",
    "dep:cranelift-native",
]
# Dynamic, execution-weighted interpreter opcode histogram — a profiling aid for
# sizing JIT work (which ops dominate real execution). Compiled in ONLY under
# this feature so the production dispatch loop pays nothing (the bump site
# vanishes). Distinct from the STATIC per-compiled-function op-mix behind
# NEOVM_JIT_PROFILE. Run a profiling build with `--features vm-profile`.
vm-profile = []
# Typed differential-fuzzing seam used by the independent cargo-fuzz package.
# Kept out of production and ordinary dependency builds.
fuzzing = []
# Opt-in performance and measurement probes (benchmarks, callgrind micros,
# profiling aids, latency/throughput matrices).  They are measurement tools,
# not correctness tests, so the default suite compiles them out; run them
# explicitly with `--features perf-probes` (release for timings).  Keep them
# from rotting with `cargo check -p neovm-core --features perf-probes --tests`.
perf-probes = []
# Opt-in compiler-contract suites (trybuild): their fixtures compile with the
# source-free gate toolchain, so they stay out of the ordinary suite.
# The postgate compiles them with
# `cargo check -p neovm-core --features contract-fixtures --tests`.
contract-fixtures = []

[dev-dependencies]
proc-macro2 = "1"
serde_json.workspace = true
static_assertions.workspace = true
neomacs-test-oracle.workspace = true
neomacs-test-env.workspace = true
trybuild = "1.0"
expect-test.workspace = true
thiserror.workspace = true
neomacs-infra.workspace = true
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }
proptest.workspace = true
tracing-test.workspace = true
tree-sitter-json = "0.24"
syn = { version = "3.0.3", features = ["full", "visit"] }

[build-dependencies]
syn = { version = "3.0.3", features = ["full", "visit"] }
proc-macro2 = "1"
serde_json.workspace = true
cc = "1.4.5"
flate2.workspace = true
pkg-config.workspace = true
sha2.workspace = true

[[test]]
name = "thread_safety_contracts"
path = "tests/thread_safety_contracts.rs"

[[test]]
name = "chartable_write_contracts"
path = "tests/chartable_write_contracts.rs"

[[test]]
name = "p0s3_contracts"
path = "tests/p0s3_contracts.rs"

[[test]]
name = "p1rv_contracts"
path = "tests/p1rv_contracts.rs"

# Runs its checks on a child process's MAIN thread, which libtest never
# offers; the file answers the libtest CLI subset nextest uses.
[[test]]
name = "main_thread_stack"
path = "tests/main_thread_stack.rs"
harness = false

[[bench]]
name = "buffer_text_backends"
harness = false

[[bench]]
name = "layout_input_capture"
harness = false

# These three were crate-wide "allow" until 2026-07: that silenced the
# compiler's cheapest correctness signal for ALL code, including new code.
# They are now live. Pre-existing not-yet-wired GNU-parity scaffolding was
# grandfathered with per-item allows (grep for "grandfathered when
# dead_code lint was enabled") - delete the item or wire it up, then drop
# the marker. Do not add new blanket allows here.
[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[[test]]
name = "gnu_overlay_deletion_allocations"
path = "tests/gnu_overlay_deletion_allocations.rs"

# The remaining core integration suites share one harness; keep them
# linked once. Nextest still runs every test in its own process.
[[test]]
name = "core"
path = "tests/core.rs"
