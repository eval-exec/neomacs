[package]
name = "neomacs-renderer-wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WGPU text renderer primitives for Neomacs"

[features]
default = []
video = ["dep:neomacs-video"]
video-dmabuf = ["video"]
webview = []

[dependencies]
rustc-hash.workspace = true
cosmic-text.workspace = true
swash.workspace = true
fontdb.workspace = true
# `glsl` gates ShaderSource::Glsl for composed Shadertoy-dialect surfaces.
# Keep it at the concrete renderer boundary so portable surface bootstrap does
# not compile Naga's GLSL frontend on browser targets.
wgpu = { workspace = true, features = ["glsl"] }
naga.workspace = true
tracing.workspace = true
bytemuck.workspace = true
pollster.workspace = true
image.workspace = true
imagesize.workspace = true
flate2.workspace = true
libc.workspace = true
resvg.workspace = true
svgtypes.workspace = true
simplecss.workspace = true
neomacs-display-protocol.workspace = true
neomacs-font-materializer.workspace = true
neomacs-layout-engine.workspace = true
neomacs-host-runtime.workspace = true
neomacs-video = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ash.workspace = true
wgpu-hal.workspace = true

[dev-dependencies]
neomacs-test-fonts.workspace = true
tracing-test.workspace = true

[lints]
workspace = true
