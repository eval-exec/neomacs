[workspace]
members = [
    "neomacs-allocator",
    "neomacs-bin",
    "neomacs-display-runtime",
    "neomacs-display-protocol",
    "neomacs-layout-engine",
    "neomacs-renderer-wgpu",
    "neomacs-diagnostics",
    "neovm-core",
    "neovm-host-abi",
    "neovm-oracle-tests",
    "neovm-worker",
    "neomacs-tui-tests",
    "neomacs-gui-tests",
    "neomacs-melpa-tests",
    "neomacs-test-oracle",
    "xtask",
]
default-members = [
    "neomacs-bin",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.0.14"
edition = "2024"
authors = ["Eval Exec <execvy@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/eval-exec/neomacs"

# Lint baseline shared by the frontend crates that opt in with `[lints]
# workspace = true` (display-protocol, layout-engine, renderer-wgpu,
# display-runtime, neomacs-bin). Deliberately modest: Rust defaults plus an
# explicit `unsafe_op_in_unsafe_fn` warn, with Clippy's default lints left at
# warn. CI runs `clippy -- -D warnings`, which promotes them to hard errors.
# The neovm-* crates do NOT opt in, so their lint behavior is unchanged.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Clippy default-group lints stay at their default level (warn). Bulk categories
# that are impractical to resolve without restructuring (e.g. wide FFI /
# scene-builder signatures) are handled with crate- or item-scoped `#[allow]`
# at each site with a justification, rather than being escalated or muted here.

[workspace.dependencies]
# Internal crates
neomacs-allocator = { path = "neomacs-allocator" }
neovm-core = { path = "neovm-core", default-features = false }
neovm-host-abi = { path = "neovm-host-abi" }
neovm-oracle-tests = { path = "neovm-oracle-tests" }
neomacs-display-runtime = { path = "neomacs-display-runtime", default-features = false }
neomacs-display-protocol = { path = "neomacs-display-protocol", default-features = false }
neomacs-layout-engine = { path = "neomacs-layout-engine", default-features = false }
neomacs-renderer-wgpu = { path = "neomacs-renderer-wgpu", default-features = false }
neomacs-diagnostics = { path = "neomacs-diagnostics", default-features = false }
neomacs-test-oracle = { path = "neomacs-test-oracle" }

# Cranelift is one API-coupled release train: these crates exchange nominal IR
# types and must move together. Dependabot groups the family, and xtask verifies
# that every member stays on the same minor release line.
cranelift-codegen = "0.134.3"
cranelift-frontend = "0.134.3"
cranelift-jit = "0.134.3"
cranelift-module = "0.134.3"
cranelift-object = "0.134.3"
cranelift-native = "0.134.3"

# Logging / tracing
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-log = "0.2"
tracing-appender = "0.2"
tracing-test = "0.2.6"

# Concurrency & threading
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
rayon = "1"

# FFI / system
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
notify = "8"
fs4 = { version = "1", features = ["sync"] }
sysinfo = "0.39"

# Crypto
aes = "0.9.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
base64 = "0.22"
x509-parser = "0.18"

# Misc
# Rust-native regexp dialect for patterns defined inside Rust. Lisp-visible
# patterns must go through `neovm_core::emacs_core::regex` instead.
native-regex = { package = "regex", version = "1" }
# Direct dep for the regex-emacs multi-literal SIMD prefilter
# (`util::prefilter::Prefilter` — memchr/Teddy/Aho-Corasick auto-select).
# Only the literal-prefilter machinery is needed, so skip the heavy
# nfa/dfa/meta/syntax layers (feature-unified with `regex`'s copy anyway).
regex-automata = { version = "0.4", default-features = false, features = ["std", "perf-literal"] }
memchr = "2"
rustc-hash = "2"
hashbrown = "0.17"
num_enum = "0.7.6"
strum = { version = "0.28", features = ["derive"] }
unicode_names2 = "3.1.0"
unicode-script = "0.5"
unicode-general-category = "1.1.0"
stacker = "0.1"
dns-lookup = "3"
hostname = "0.4"
network-interface = "2"
libloading = "0.9"
tree-sitter = "0.26.8"
tree-sitter-language = "0.1.7"
fontconfig = "0.11.0"
yeslogic-fontconfig-sys = "6.0.0"
x11-dl = "2.21"
core-foundation = "0.10.1"
core-text = "22.0.0"
dwrote = { version = "0.11.5", default-features = false }
winapi = { version = "0.3", features = ["dwrite"] }
sys-locale = "0.3.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2.0"
once_cell = "1.19"
cfg-if = "1.0"
bitflags = { version = "2.0", features = ["serde"] }
enumflags2 = "0.7"
bytemuck = { version = "1.18", features = ["derive"] }
memmap2 = "0.9"
image = "0.25"
imagesize = "0.15"
allsorts = "0.17.0"
encoding_rs = "0.8"

# Compression
flate2 = "1"

# Parsing
quick-xml = "0.41"
tl = "0.7"
htmlize = { version = "1.1", default-features = false, features = ["unescape"] }

# Database
rusqlite = { version = "0.35", features = ["bundled"] }

# Arbitrary precision integers (bignum support).
# Uses malachite, a pure-Rust bignum library derived from GMP/FLINT
# algorithms. This avoids C library compilation issues on Windows CI.
malachite = "0.9"

# Fast integer to-decimal formatting (used by the JSON serializer).
itoa = "1.0"

# GPU / windowing
winit = "0.30"
# "glsl" gates ShaderSource::Glsl, which the render thread needs to compile
# composed Shadertoy-dialect surface shaders (shader_surface.rs).
wgpu = { version = "30", features = ["glsl"] }
wgpu-hal = { version = "30", features = ["vulkan"] }
# Shader-surface WGSL/GLSL validation on the Lisp thread (same version wgpu embeds)
naga = { version = "30", features = ["wgsl-in", "glsl-in"] }
raw-window-handle = "0.6"
ash = "0.38"
pollster = "1.0"
resvg = "0.47"
svgtypes = "0.16.1"
simplecss = "0.2.2"
cosmic-text = "0.18.2"
# >=0.2.9 required: 0.2.7 rebuilt the TrueType hinting instance for every
# rasterized glyph (dfrg/swash#114 -- default-weight variation coords made the
# hinting-cache key never match, ~7.7% of our redisplay CPU); 0.2.8 fixed that
# but regressed to wrong-size glyphs after cache eviction (dfrg/swash#120);
# 0.2.9 has both fixes.
swash = "0.2.9"
fontdb = "0.23"
ttf-parser = "0.25"
arboard = "3.4"
smithay-clipboard = "0.7.3"

# GStreamer (video)
gstreamer = "0.25"
gstreamer-video = "0.25"
gstreamer-app = "0.25"
gstreamer-allocators = "0.25"

# Terminal emulation
rio-vt = "0.5.3"
parking_lot = "0.12"
portable-pty = "0.9"
smallvec = "1.13"

# Build dependencies
cbindgen = "0.27"
which = "7.0"
bindgen = "0.72"
pkg-config = "0.3"

# OS pipe
os_pipe = "1.2.3"

# I/O multiplexing (epoll/kqueue/wepoll)
polling = "3"
socket2 = { version = "0.6", features = ["all"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1.0"
rustls-pki-types = "1"

# Windows
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

# Dev / test
proptest = "1.6"
expect-test = "1.5.1"
tempfile = "3.27.0"
colored = "3"
wait-timeout = "0.2"

[profile.release]
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"

# This test-only crate is a 52 MiB corpus compiled into one test harness.
# Keep production dependencies in release mode without optimizing test bodies.
[profile.release.package.neovm-oracle-tests]
opt-level = 0

# Nix enables `_FORTIFY_SOURCE`, which rejects the C dependency's default dev
# `-O0` before jemalloc's configure probes can run. Keep Rust dev builds
# unchanged while giving only jemalloc's native build the required optimization.
[profile.dev.package.tikv-jemalloc-sys]
opt-level = 1

# Optimized build driven by a PGO profile. Same codegen settings as release,
# but cargo gives it its own target/release-pgo directory, so a PGO build never
# replaces an ordinary release binary (or invalidates its pdump fingerprint).
# The profile data itself is supplied by RUSTFLAGS, which xtask sets --
# see `cargo xtask fresh-build --profile release-pgo`.
[profile.release-pgo]
inherits = "release"

# PGO build that keeps its symbols, for profiling the configuration actually
# shipped: PGO changes inlining and block layout, so hotspots measured on a
# plain release build do not necessarily hold for release-pgo.
[profile.release-pgo-profiling]
inherits = "release-pgo"
debug = true
strip = "none"

# Instrumented pass of a PGO build. Separate from release-pgo so the
# counter-collecting binary (which is slow, and useless afterwards) never
# occupies the directory the optimized one lands in.
[profile.release-pgo-gen]
inherits = "release"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[patch.crates-io]
cosmic-text = { git = "https://github.com/eval-exec/cosmic-text", rev = "5dd3fec8572e771794e3f203ab6780d828e9ce09" }
