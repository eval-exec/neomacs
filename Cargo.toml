[workspace]
members = [
    "neomacs-bin",
    "neomacs-display-runtime",
    "neomacs-display-protocol",
    "neomacs-layout-engine",
    "neomacs-renderer-wgpu",
    "neomacs-diagnostics",
    "neovm-core",
    "neovm-host-abi",
    "neovm-oracle-tests",
    "neovm-worker",
    "neomacs-tui-tests",
    "neomacs-gui-tests",
    "neomacs-melpa-tests",
    "xtask",
]
default-members = [
    "neomacs-bin",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.0.12"
edition = "2024"
authors = ["Eval Exec <execvy@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/eval-exec/neomacs"

# Lint baseline shared by the frontend crates that opt in with `[lints]
# workspace = true` (display-protocol, layout-engine, renderer-wgpu,
# display-runtime, neomacs-bin). Deliberately modest: Rust defaults plus an
# explicit `unsafe_op_in_unsafe_fn` warn, with Clippy's default lints left at
# warn. CI runs `clippy -- -D warnings`, which promotes them to hard errors.
# The neovm-* crates do NOT opt in, so their lint behavior is unchanged.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Clippy default-group lints stay at their default level (warn). Bulk categories
# that are impractical to resolve without restructuring (e.g. wide FFI /
# scene-builder signatures) are handled with crate- or item-scoped `#[allow]`
# at each site with a justification, rather than being escalated or muted here.

[workspace.dependencies]
# Internal crates
neovm-core = { path = "neovm-core", version = "0.0.12", default-features = false }
neovm-host-abi = { path = "neovm-host-abi", version = "0.0.12" }
neovm-oracle-tests = { path = "neovm-oracle-tests", version = "0.0.12" }
neomacs-display-runtime = { path = "neomacs-display-runtime", version = "0.0.12", default-features = false }
neomacs-display-protocol = { path = "neomacs-display-protocol", version = "0.0.12", default-features = false }
neomacs-layout-engine = { path = "neomacs-layout-engine", version = "0.0.12", default-features = false }
neomacs-renderer-wgpu = { path = "neomacs-renderer-wgpu", version = "0.0.12", default-features = false }
neomacs-diagnostics = { path = "neomacs-diagnostics", version = "0.0.12", default-features = false }

# Logging / tracing
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-log = "0.2"
tracing-appender = "0.2"
tracing-test = "0.2.6"

# Concurrency & threading
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
rayon = "1"

# FFI / system
libc = "0.2"
notify = "8"
fs4 = { version = "1", features = ["sync"] }
sysinfo = "0.39"

# Crypto
aes = "0.9.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
base64 = "0.22"
x509-parser = "0.18"

# Misc
regex = "1"
# Direct dep for the regex-emacs multi-literal SIMD prefilter
# (`util::prefilter::Prefilter` — memchr/Teddy/Aho-Corasick auto-select).
# Only the literal-prefilter machinery is needed, so skip the heavy
# nfa/dfa/meta/syntax layers (feature-unified with `regex`'s copy anyway).
regex-automata = { version = "0.4", default-features = false, features = ["std", "perf-literal"] }
memchr = "2"
rustc-hash = "2"
num_enum = "0.7.6"
strum = { version = "0.28", features = ["derive"] }
unicode_names2 = "2.0.0"
unicode-script = "0.5"
unicode-general-category = "1.1.0"
stacker = "0.1"
dns-lookup = "3"
hostname = "0.4"
network-interface = "2"
libloading = "0.9"
tree-sitter = "0.26.8"
tree-sitter-language = "0.1.7"
fontconfig = "0.10.0"
yeslogic-fontconfig-sys = "6.0.0"
x11-dl = "2.21"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0"
once_cell = "1.19"
cfg-if = "1.0"
bitflags = { version = "2.0", features = ["serde"] }
enumflags2 = "0.7"
bytemuck = { version = "1.18", features = ["derive"] }
memmap2 = "0.9"
image = "0.25"
allsorts = "0.16.1"
encoding_rs = "0.8"

# Compression
flate2 = "1"

# Parsing
quick-xml = "0.41"
tl = "0.7"

# Database
rusqlite = { version = "0.35", features = ["bundled"] }

# Arbitrary precision integers (bignum support).
# Uses malachite, a pure-Rust bignum library derived from GMP/FLINT
# algorithms. This avoids C library compilation issues on Windows CI.
malachite = "0.9"

# Fast integer to-decimal formatting (used by the JSON serializer).
itoa = "1.0"

# GPU / windowing
winit = "0.30"
wgpu = "29"
wgpu-hal = { version = "29", features = ["vulkan"] }
raw-window-handle = "0.6"
ash = "0.38"
pollster = "0.4"
resvg = "0.47"
librsvg = "2.62"
cairo-rs = "0.22"
gio = "0.22"
glib = "0.22"
cosmic-text = "0.18.2"
# >=0.2.9 required: 0.2.7 rebuilt the TrueType hinting instance for every
# rasterized glyph (dfrg/swash#114 -- default-weight variation coords made the
# hinting-cache key never match, ~7.7% of our redisplay CPU); 0.2.8 fixed that
# but regressed to wrong-size glyphs after cache eviction (dfrg/swash#120);
# 0.2.9 has both fixes.
swash = "0.2.9"
fontdb = "0.23"
ttf-parser = "0.25"
arboard = "3.4"
smithay-clipboard = "0.7.3"

# GStreamer (video)
gstreamer = "0.25"
gstreamer-video = "0.25"
gstreamer-app = "0.25"
gstreamer-allocators = "0.25"

# Terminal emulation
alacritty_terminal = "0.26"
parking_lot = "0.12"
portable-pty = "0.9"
smallvec = "1.13"

# Build dependencies
cbindgen = "0.27"
which = "7.0"
bindgen = "0.72"
pkg-config = "0.3"

# OS pipe
os_pipe = "1.1"

# I/O multiplexing (epoll/kqueue/wepoll)
polling = "3"
socket2 = { version = "0.6", features = ["all"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1.0"
rustls-pki-types = "1"

# Windows
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

# Dev / test
proptest = "1.6"
expect-test = "1.5.1"
tempfile = "3.27.0"
colored = "3"

[profile.release]
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[patch.crates-io]
cosmic-text = { git = "https://github.com/eval-exec/cosmic-text", rev = "5dd3fec8572e771794e3f203ab6780d828e9ce09" }
