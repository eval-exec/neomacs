[package]
name = "neomacs-display-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust runtime display engine for Neomacs"

[dependencies]
# Text rendering - Pure Rust stack
cosmic-text.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true

# Vulkan for DMA-BUF import (WPE WebKit integration)
ash.workspace = true

# GStreamer for video
gstreamer = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-allocators = { workspace = true, optional = true }

# Winit + wgpu backend (always enabled)
winit.workspace = true
wgpu.workspace = true
wgpu-hal.workspace = true
raw-window-handle.workspace = true
arboard.workspace = true
bytemuck.workspace = true
pollster.workspace = true

# Image decoding (async)
image.workspace = true

# SVG rendering (pure Rust, no C deps)
resvg.workspace = true

# Utilities
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bitflags.workspace = true
once_cell.workspace = true
cfg-if.workspace = true

# Thread communication
crossbeam-channel.workspace = true

# Cross-platform TTY terminal I/O
crossterm = "0.29"

# FFI / system
libc.workspace = true

# NeoVM Elisp evaluator
neovm-core.workspace = true
neomacs-display-protocol.workspace = true
neomacs-layout-engine.workspace = true
neomacs-renderer-wgpu.workspace = true

# Terminal emulation (neo-term)
rio-vt = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[features]
# Default: all features enabled
default = ["video", "neo-term"]
tty-backend = []
# Video with GStreamer
video = [
    "gstreamer",
    "gstreamer-video",
    "gstreamer-app",
    "neomacs-renderer-wgpu/video",
]
video-dmabuf = [
    "video",
    "gstreamer-allocators",
    "neomacs-renderer-wgpu/video-dmabuf",
]
# WPE WebKit integration
wpe-webkit = [
    "neomacs-renderer-wgpu/wpe-webkit",
    "dep:bindgen",
    "dep:pkg-config",
]
# GPU-accelerated terminal emulator
neo-term = [
    "dep:rio-vt",
    "parking_lot",
    "portable-pty",
    "neomacs-display-protocol/neo-term",
    "neomacs-layout-engine/neo-term",
]

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard.workspace = true
x11-dl.workspace = true

[lints]
workspace = true
