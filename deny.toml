# Dependency policy enforced by the `cargo-deny` CI job.

[advisories]
ignore = [
    # Transitive dependencies with no fixed release. Keep each advisory explicit
    # so cargo-deny still fails when a new advisory reaches the workspace.
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled in by rav1e; no safe upgrade is available" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is used by the text and SVG stacks; no maintained replacement is available yet" },
    { id = "RUSTSEC-2026-0194", reason = "affected quick-xml releases are confined to inferno profiling output and Wayland protocol generation" },
    { id = "RUSTSEC-2026-0195", reason = "affected quick-xml releases are confined to inferno profiling output and Wayland protocol generation" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is pulled in by usvg; no maintained replacement is available yet" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-3.0-only",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

# Inferno renders developer-requested profiling flamegraphs. Keep its CDDL
# allowance local to that tool instead of accepting CDDL for every dependency.
exceptions = [
    { allow = ["CDDL-1.0"], crate = "inferno" },
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally omit versions. Keep other wildcard
# dependencies visible without rejecting the workspace's own crates.
wildcards = "warn"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/eval-exec/cosmic-text",
  "https://github.com/eval-exec/freetype-sys",
]
