[package]
name = "neomacs-layout-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust layout engine crate for Neomacs"

[features]
default = []
neo-term = ["neomacs-display-protocol/neo-term"]
bundled = ["freetype-rs/bundled"]

[dependencies]
rustc-hash.workspace = true
neomacs-display-protocol = { workspace = true }
neovm-core.workspace = true
cosmic-text.workspace = true
fontdb.workspace = true
tracing.workspace = true
once_cell.workspace = true
ttf-parser.workspace = true
allsorts.workspace = true
unicode-script.workspace = true
strum.workspace = true
num_enum.workspace = true

[target.'cfg(unix)'.dependencies]
fontconfig.workspace = true
yeslogic-fontconfig-sys.workspace = true
x11-dl.workspace = true
# FreeType px-metric/named-instance probe reproduces GNU's cairo-freetype
# driver. Gated to `cfg(unix)`, so it is compiled and used on BOTH Linux and
# macOS. Only Windows (`cfg(not(unix))`) gets the
# `None`/empty stubs in `font_probe` and falls back to fontdb selection.
freetype-rs = { version = "0.38.0" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-text.workspace = true

[target.'cfg(windows)'.dependencies]
dwrote.workspace = true
sys-locale.workspace = true
winapi.workspace = true

[dev-dependencies]
tracing-test.workspace = true

[lints]
workspace = true
