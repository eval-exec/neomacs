# The GNU Emacs reference this project's parity numbers are measured against.
#
# WHY THIS FILE EXISTS (ledger 214).  Every parity number this project
# publishes -- the oracle's expectations, ledger 195's motion sweep, ledger
# 205's below-content audit, the TUI suite -- is a comparison against ONE GNU
# Emacs build.  Until this file existed each harness only checked that *an*
# emacs could be RUN (ledger 210 and 211 made that check honest), and none of
# them checked *which* one.  A reference that VANISHED was caught; a reference
# that CHANGED would have been scored in silence.
#
# WHAT IDENTIFIES THE BUILD.  The parity reference is a RELEASE, not a
# byte-exact artifact: the tag emacs-31.1, which the running editor reports as
# `emacs-version'.  That is the only identity an installed GNU can prove.  It
# embeds no repository revision -- `emacs-repository-version' is computed by
# running git in `source-directory' (lisp/version.el), and `make install'
# creates no source tree to ask.  GNU's own `fingerprint' (lib/fingerprint.h;
# lib-src/make-fingerprint.c hashes the temacs executable into the dump header,
# src/pdumper.c:116 and 361-367) identifies a binary-and-dump PAIR, which
# src/pdumper.c:5687 enforces when the editor runs -- but it is a BUILD
# identity, so a rebuild on another toolchain differs while the source is
# unchanged.
#
# The fingerprint and SHA-256 fields below are PROVENANCE, recorded by
# `pin-reference' and `observe()': they name the build the numbers were first
# measured against, and they move only through a re-baselining.  Attestation
# gates on the release version; see crates/neomacs-parity-reference/src/lib.rs.
#
# RE-BASELINING.  A rebuild of the GNU mirror is its own change with its own
# re-baselining, never a side effect of a session.  To re-pin, run
#
#     cargo run -p xtask -- pin-reference --emacs PATH --reason "..."
#
# which rewrites the keys below and appends to the log in this comment block.
# Editing the keys by hand defeats the log; the command exists so that the
# record cannot be forgotten.
#
# RE-BASELINING LOG
#   2026-09-16  GNU Emacs 31.1 built 2026-09-13T03:18:28-04:00 from mirror commit a360712c9d2.
