# The GNU Emacs reference this project's parity numbers are measured against.
#
# WHY THIS FILE EXISTS (ledger 214).  Every parity number this project
# publishes -- the oracle's expectations, ledger 195's motion sweep, ledger
# 205's below-content audit, the TUI suite -- is a comparison against ONE GNU
# Emacs build.  Until this file existed each harness only checked that *an*
# emacs could be RUN (ledger 210 and 211 made that check honest), and none of
# them checked *which* one.  A reference that VANISHED was caught; a reference
# that CHANGED would have been scored in silence.
#
# WHAT IDENTIFIES THE BUILD.  `fingerprint' is GNU's own: lib/fingerprint.h
# declares `unsigned char fingerprint[32]' and says it exists so that we "have
# a unique value that we can use to pair data files (like a dump file) with a
# specific build of Emacs".  lib-src/make-fingerprint.c computes it as a
# SHA-256 over the temacs executable and patches it into the binary; pdumper.c
# writes it into the dump header (offset 16, after the 16-byte magic
# "DUMPEDGNUEMACS\0\0") and src/pdumper.c:5687 REFUSES to load a dump whose
# fingerprint does not match the binary's.  So the fingerprint identifies the
# binary and its dump as a PAIR, and reading it costs one 48-byte file read.
# This binary carries no .note.gnu.build-id -- it is stripped and the link did
# not emit one -- so the fingerprint is the only free identity available.
#
# The SHA-256 digests are the complete content identity and are what an
# `exhaustive' attestation checks.  The fingerprint is a BUILD identity: it
# catches every rebuild, which is the incident this file exists for, but it is
# computed over temacs at build time and so does not cover a shipped file
# edited afterwards.  See crates/neomacs-parity-reference/src/lib.rs for the two
# depths and what each one is worth.
#
# RE-BASELINING.  A rebuild of the GNU mirror is its own change with its own
# re-baselining, never a side effect of a session.  To re-pin, run
#
#     cargo run -p xtask -- pin-reference --emacs PATH --reason "..."
#
# which rewrites the keys below and appends to the log in this comment block.
# Editing the keys by hand defeats the log; the command exists so that the
# record cannot be forgotten.
#
